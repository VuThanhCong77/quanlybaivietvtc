<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Soạn thảo bài viết</title>

<!-- CSS DÙNG CHUNG -->
<link rel="stylesheet" href="layout.css">

<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

<style>
/* CSS Đầy đủ và Tối ưu */
body {font-family: Arial, sans-serif; max-width: 1500px; margin: auto; padding: 20px; background-color: #f4f7f8;background:#f5f5f5;}
h1 {color: #0a7f99; text-align: center; margin-bottom: 5px;}
#storage-status {text-align: center; font-size: 13px; color: #666; margin-bottom: 20px;}
label {display: block; font-weight: bold; margin-top: 15px;}
select, input[type="text"] {width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
#toolbar {margin-top: 10px; padding: 10px; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;} 
#toolbar button, #toolbar select {padding: 6px 12px; cursor: pointer; border: 1px solid #aaa; background: #fff; border-radius: 3px; font-size: 13px;}
#content-area {border: 1px solid #ccc; padding: 15px; min-height: 400px; margin-top: 5px; background: #fff; line-height: 1.6; text-align: justify; overflow-y: auto; border-radius: 4px;}
button {padding: 10px 20px; margin-top: 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s;}

/* Màu sắc các nút */
#saveButton {background: #2ecc71; color: white;}
#saveButton:hover {background: #27ae60;}
.home-btn {background: #3498db; color: white;}
.btn-github {background: #2c3e50 !important; color: white !important;}
.btn-backup {background: #9b59b6; color: white;}
.btn-restore {background: #34495e; color: white;}
.btn-clear {background: #e67e22; color: white;}

#delete-list {margin-top: 30px; border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fff;}
.post-item {display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee;}
.edit-btn {background: #f39c12; color: white; padding: 5px 10px; font-size: 12px;}
.delete-btn {background: #e74c3c; color: white; padding: 5px 10px; font-size: 12px;}
.file-section {background: #f9f9f9; padding: 15px; border: 1px solid #eee; margin-top: 15px; border-radius: 4px;}

.category-group{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-top:10px;
}

.category-group label{
display:flex;
align-items:center;
gap:8px;
padding:10px;
background:#f5f5f5;
border-radius:10px;
cursor:pointer;
transition:0.3s;
font-size:15px;
}

.category-group label:hover{
background:#e8f0ff;
}

.category-group input{
accent-color:#0066cc;
}

/* =========================
RESPONSIVE MOBILE
========================= */
@media (max-width:768px){

body{
padding:10px;
font-size:15px;
overflow-x:hidden;
}

/* Header */
.site-header{
flex-direction:column;
padding:10px;
gap:10px;
}

.header-center{
flex-direction:column;
text-align:center;
}

.header-logo img{
width:70px;
height:70px;
}

.header-title h1{
font-size:22px !important;
line-height:1.3;
}

.header-title span{
font-size:13px;
}

/* Menu */
.header-nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
}

.header-nav a{
font-size:13px;
padding:8px 10px;
border-radius:8px;
background:#f5f5f5;
}

/* Input */
input[type="text"],
select{
font-size:16px;
padding:12px;
}

/* Toolbar */
#toolbar{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:10px;
}

#toolbar button,
#toolbar select{
width:100%;
font-size:13px;
padding:10px 6px;
}

/* Nội dung soạn thảo */
#content-area{
min-height:300px;
padding:12px;
font-size:16px;
line-height:1.8;
overflow-wrap:break-word;
word-break:break-word;
}

/* Ảnh trong bài */
#content-area img{
max-width:100% !important;
height:auto !important;
border-radius:8px;
}

/* Bảng */
#content-area table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

/* Nhóm chuyên mục */
.category-group{
grid-template-columns:1fr;
}

.category-group label{
font-size:14px;
padding:12px;
}

/* Buttons */
button{
width:100%;
margin-top:10px;
font-size:15px;
padding:12px;
}

/* Khu backup */
#backup-restore-section{
padding:15px;
}

/* Danh sách bài */
.post-item{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

.post-item div{
display:flex;
width:100%;
gap:10px;
}

.post-item button{
flex:1;
}

/* File section */
.file-section{
padding:12px;
}

/* Fix zoom iPhone */
input,
textarea,
select{
font-size:16px;
}
}

</style>
</head>
<body>

<header class="site-header">

    <!-- CENTER -->
<div class="header-center">
   <a href="index.html" class="header-logo">
      <img src="images/logo.png" alt="Logo">
    </a>
    <div class="header-title">
      <h1 style="color:#fff;">SOẠN THẢO BÀI VIẾT</h1>
      <span>Trí tuệ - Tri thức - Tư duy</span>
    </div>
</div>

 <!-- RIGHT -->
  <nav class="header-nav">
    <a href="index.html">🏠 Trang chủ</a>
    <a href="suckhoe.html">❤️ Sức khỏe</a>
    <a href="baiviet.html">✍ Bài viết</a>
    <a href="tintuc.html">📢 Tin tức</a>
    <a href="anh.html">📷 Thư viện</a>
    <a href="vanban.html">📄 Văn bản</a>
    <a href="tailieu.html">📁 Tài liệu</a>
    <a href="lich_cong_tac.html" >📅 Lịch</a>  
  </nav>

</header>

<div class="page-wrapper">
<main class="main-content">

<div id="storage-status">Đang kiểm tra bộ nhớ...</div>

<input type="hidden" id="postId" value="">

<label>🌸 Tiêu đề bài viết</label>
<input type="text" id="title" placeholder="🌸 Nhập tiêu đề...">

<label>🌺 Mô tả ngắn 200 từ (Hiện ở trang chủ)</label>
<input type="text" id="shortDescription" placeholder="🌺 Tóm tắt ngắn gọn nội dung bài viết (200 từ)">

<label>Chuyên mục</label>
<p style="color:#e42828;">*Ghi chú: 4 mục đầu tiên chỉ được chọn 01</p>

<div class="category-group">

<label style="color:#e42828;">
<input type="checkbox" name="category" value="baiviet" >
Bài viết
</label>

<label style="color:#e42828;">
<input type="checkbox" name="category" value="tintuc">
Tin tức
</label>

<label style="color:#e42828;">
<input type="checkbox" name="category" value="tailieu">
Tài liệu
</label>

<label style="color:#e42828;">
<input type="checkbox" name="category" value="suckhoe">
Sức khỏe
</label>

<label>
<input type="checkbox" name="category" value="tritue">
Trí tuệ
</label>

<label>
<input type="checkbox" name="category" value="hanhphuc">
Hạnh phúc
</label>

<label>
<input type="checkbox" name="category" value="giatricuocsong">
Giá trị cuộc sống
</label>


<label>
<input type="checkbox" name="category" value="chinhtri">
Chính trị
</label>

<label>
<input type="checkbox" name="category" value="kinhte">
Kinh tế
</label>

<label>
<input type="checkbox" name="category" value="xahoi">
Xã hội
</label>

<label>
<input type="checkbox" name="category" value="quocphong_anninh">
Quốc phòng - An ninh
</label>

</div>

<label>📖 Nội dung chi tiết</label>
<div id="toolbar">
  <button onclick="formatText('bold')"><b>B</b></button>
  <button onclick="formatText('italic')"><i>I</i></button>
  <button onclick="formatText('underline')"><u>U</u></button>
  <button onclick="formatText('justifyLeft')">Trái</button>
  <button onclick="formatText('justifyCenter')">Giữa</button>
  <button onclick="formatText('justifyFull')">Đều</button>
  <button onclick="indentFirstLine()">⇥ 1cm</button>
  <button onclick="insertTable()">Chèn Bảng</button>
  <button onclick="insertGitHubImage()" class="btn-github">🖼️ Chèn ảnh GitHub/URL (Khuyên dùng)</button>
  <button onclick="insertLocalImage()">📷 Chèn ảnh từ máy (Dễ đầy bộ nhớ)</button>
  <button onclick="insertLink()">Chèn Link</button>
</div>

<div id="content-area" contenteditable="true">📖 </div>
<input type="file" id="localImgInput" accept="image/*" style="display:none;">

<div class="file-section">
    <label style="color: #c0392b;">URL Ảnh Đại Diện (Nên dùng Link GitHub: images/tên tệp.jpg)</label>
    <input type="text" id="thumbnailUrl" placeholder="Ví dụ: images/hoasen.jpg">
    
    <label style="margin-top: 15px;">Hoặc Tải ảnh đại diện từ máy (Nếu ảnh nhẹ)</label>
    <input type="file" id="imageFile" accept="image/*">

    <label style="color: #0a7f99; margin-top: 15px;">Tệp đính kèm (PDF, Word...)</label>
    <div id="currentFileInfo" style="font-size: 12px; color: blue; margin-bottom: 5px;"></div>
    <input type="file" id="documentFile" accept=".pdf,.doc,.docx,.xls,.xlsx">
</div>

<button onclick="savePost()" id="saveButton">Lưu bài viết</button>
<button onclick="location.href='index.html'" class="home-btn">Quay lại Trang chủ</button>

<div id="backup-restore-section" style="margin-top: 30px; padding: 20px; border: 2px solid #0a7f99; border-radius: 8px; background: #e7f5fa;">
    <h3>Quản lý & Xuất dữ liệu ( posts_data.json )</h3>
    <button onclick="backupPosts()" class="btn-backup">💾 Xuất file JSON (Lấy bài viết mới)</button>
    <input type="file" id="restoreFile" style="display:none;" accept=".json" onchange="restorePosts()">
    <button onclick="document.getElementById('restoreFile').click()" class="btn-restore">🔄 Nhập file JSON (Sửa bài cũ)</button>
    <button onclick="clearAllData()" class="btn-clear">🗑️ Xóa sạch bộ nhớ tạm</button>
</div>

<div id="delete-list">
    <h2>Danh sách bài viết trong bộ nhớ tạm</h2>
    <div id="delete-list-content"></div>
</div>

</main>
</div>

<script>
// 1. Kiểm tra mật khẩu
if (sessionStorage.getItem('isAdmin') !== 'true') {
    if (prompt("Nhập mật khẩu quản trị:") === "123") sessionStorage.setItem('isAdmin', 'true');
    else location.href = "index.html";
}

// 2. Các hàm soạn thảo
function formatText(cmd, val = null) { document.execCommand(cmd, false, val); document.getElementById('content-area').focus(); }

function indentFirstLine() {
    document.execCommand('formatBlock', false, 'p');
    const selection = window.getSelection();
    let node = selection.getRangeAt(0).startContainer;
    if (node.nodeType === 3) node = node.parentNode;
    node.style.textIndent = "1cm";
}

function insertGitHubImage() {
    let url = prompt("Dán link ảnh GitHub (Link Raw):");
    if (url) {
        if (url.includes("github.com") && !url.includes("raw.githubusercontent.com")) {
            url = url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
        }
        document.execCommand('insertHTML', false, `<img src="${url}" style="max-width:100%; display:block; margin:10px auto;">`);
    }
}

function insertLocalImage() {
    const input = document.getElementById('localImgInput');
    input.click();
    input.onchange = e => {
        const file = e.target.files[0];
        if (file && file.size > 500000) alert("Cảnh báo: Ảnh lớn dễ gây lỗi không lưu được!");
        const reader = new FileReader();
        reader.onload = ev => document.execCommand('insertHTML', false, `<img src="${ev.target.result}" style="max-width:100%;">`);
        reader.readAsDataURL(file);
    };
}

function insertTable() {
    const r = prompt("Số hàng:", 3), c = prompt("Số cột:", 3);
    if (r && c) {
        let html = '<table border="1" style="width:100%; border-collapse: collapse; margin: 10px 0;">';
        for (let i = 0; i < r; i++) {
            html += '<tr>';
            for (let j = 0; j < c; j++) html += '<td style="padding: 8px; border: 1px solid #ccc;">Nội dung</td>';
            html += '</tr>';
        }
        document.execCommand('insertHTML', false, html + '</table>');
    }
}

function insertLink() { const url = prompt("Nhập URL:"); if (url) document.execCommand('createLink', false, url); }

function fileToBase64(file) {
    return new Promise((resolve) => {
        if (!file) resolve(null);
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

// 3. Hàm Lưu & Quản lý dữ liệu
async function savePost() {
    const id = document.getElementById('postId').value || Date.now().toString();
    const title = document.getElementById('title').value;
    const contentHtml = document.getElementById('content-area').innerHTML;
    const categories = [
...document.querySelectorAll('input[name="category"]:checked')
].map(cb => cb.value);
    if (!title || contentHtml === "Bắt đầu soạn thảo...") { alert("Vui lòng nhập tiêu đề và nội dung!"); return; }

    let posts = JSON.parse(localStorage.getItem("posts") || "[]");
    let oldPost = posts.find(p => String(p.id) === String(id));

    // Xử lý ảnh đại diện
    let thumb = document.getElementById('thumbnailUrl').value;
    const thumbFile = document.getElementById('imageFile').files[0];
    if (!thumb && thumbFile) thumb = await fileToBase64(thumbFile);
    else if (!thumb && oldPost) thumb = oldPost.thumbnail;

    // Xử lý tệp đính kèm
    const docFile = document.getElementById('documentFile').files[0];
    let fData = oldPost ? oldPost.fileData : '';
    let fName = oldPost ? oldPost.fileName : '';
    if (docFile) {
        fData = await fileToBase64(docFile);
        fName = docFile.name;
    }

    const newPost = {
        id: id,
        title: title,
        category: categories,
        description: contentHtml,
        shortDescription: document.getElementById('shortDescription').value || (document.getElementById('content-area').innerText.substring(0, 150) + "..."),
        date: oldPost ? oldPost.date : new Date().toISOString().slice(0, 10),
        author: "Admin",
        thumbnail: thumb,
        fileData: fData,
        fileName: fName,
        likes: oldPost ? oldPost.likes : 0
    };

    const index = posts.findIndex(p => String(p.id) === String(id));
    if (index > -1) posts[index] = newPost; else posts.push(newPost);

    try {
        localStorage.setItem("posts", JSON.stringify(posts));
        alert("Lưu tạm thành công! Đừng quên 'Xuất file JSON' để cập nhật web.");
        loadDeleteList();
    } catch (e) {
        alert("LỖI: Bộ nhớ đầy! Vui lòng xóa bớt bài cũ hoặc dùng link ảnh GitHub.");
    }
}

function loadDeleteList() {
    const posts = JSON.parse(localStorage.getItem("posts") || "[]");
    const used = (JSON.stringify(localStorage).length / 1024 / 1024).toFixed(2);
    document.getElementById('storage-status').innerText = `Bộ nhớ đã dùng: ${used}MB / Giới hạn ~5MB`;
    
const categoryNames = {
baiviet:"Bài viết",
tintuc:"Tin tức",
tailieu:"Tài liệu",
suckhoe:"Sức khỏe",
tritue:"Trí tuệ",
hanhphuc:"Hạnh phúc",
giatricuocsong:"Giá trị cuộc sống",
chinhtri:"Chính trị",
kinhte:"Kinh tế",
xahoi:"Xã hội",
quocphong_anninh:"Quốc phòng - An ninh"
};

document.getElementById('delete-list-content').innerHTML =
posts.sort((a,b) => b.id - a.id).map(p => {

const categories = Array.isArray(p.category)
? p.category.map(c => categoryNames[c] || c).join(" • ")
: (categoryNames[p.category] || p.category);

return `
<div class="post-item">
<span>[${categories}] ${p.title}</span>

<div>
<button class="edit-btn"
onclick="loadPostForEdit('${p.id}')">
Sửa
</button>

<button class="delete-btn"
onclick="deletePost('${p.id}')">
Xóa
</button>
</div>

</div>
`;

}).join('');
}


function loadPostForEdit(id) {
    const posts = JSON.parse(localStorage.getItem("posts") || "[]");
    const p = posts.find(x => String(x.id) === String(id));
    if (!p) return;

    document.getElementById('postId').value = p.id;
    document.getElementById('title').value = p.title;
    document.getElementById('shortDescription').value = p.shortDescription;

    document.querySelectorAll('input[name="category"]').forEach(cb => {

if(Array.isArray(p.category)){
cb.checked = p.category.includes(cb.value);
}else{
cb.checked = p.category === cb.value;
}

});

    document.getElementById('content-area').innerHTML = p.description;
    if (p.thumbnail && !p.thumbnail.startsWith('data:')) document.getElementById('thumbnailUrl').value = p.thumbnail;
    if (p.fileName) document.getElementById('currentFileInfo').innerText = "Đã có tệp: " + p.fileName;
    document.getElementById('saveButton').innerText = "Cập nhật bài viết";
    window.scrollTo(0,0);
}

function deletePost(id) {
    if (confirm("Xóa bài này khỏi bộ nhớ tạm?")) {
        let posts = JSON.parse(localStorage.getItem("posts") || "[]");
        localStorage.setItem("posts", JSON.stringify(posts.filter(p => String(p.id) !== String(id))));
        loadDeleteList();
    }
}

function backupPosts() {
    const data = localStorage.getItem("posts") || "[]";
    const blob = new Blob([data], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "posts_data.json";
    a.click();
}

function restorePosts() {
    const file = document.getElementById('restoreFile').files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            localStorage.setItem("posts", e.target.result);
            alert("Đã nhập dữ liệu thành công!");
            loadDeleteList();
        };
        reader.readAsText(file);
    }
}

function clearAllData() {
    if(confirm("CẢNH BÁO: Hành động này xóa sạch bộ nhớ tạm trình duyệt. Hãy chắc chắn bạn đã nhấn 'Xuất file JSON' để lưu lại file dữ liệu.")) {
        localStorage.removeItem("posts");
        location.reload();
    }
}

window.onload = () => {
    loadDeleteList();
    const id = new URLSearchParams(window.location.search).get('id');
    if (id) loadPostForEdit(id);
};
</script>
</body>
</html>
