<style>
h1,h2 {
font-size: 18px;
}
/* ===============================
   NÚT LÊN ĐẦU TRANG
   =============================== */
#backToTop{
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #0a7f99, #0ab3c9);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: none;
  z-index: 3000;
  box-shadow: 0 6px 16px rgba(0,0,0,.25);
  transition: all .25s ease;
}

#backToTop:hover{
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0,0,0,.35);
}

@media(max-width:600px){
  #backToTop{
    right: 12px;
    bottom: 16px;
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}

body{
  font-family:Arial;
  background:#f5f7fa;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:6px;
}
h1,h2{color:#0b5394}
input,button{
  padding:8px;
  margin:5px 0;
}
button{cursor:pointer}
ul{list-style:none;padding:0}
li{
  background:#eef2f5;
  margin:6px 0;
  padding:8px;
  border-radius:4px;
}
.action button{
  margin-left:5px;
}
.note{
  background:#fffbe6;
  border-left:4px solid #f0c000;
  padding:10px;
  margin:15px 0;
}
</style>
</head>

<body>
<div class="container">
<a href="../hoctap.html">📖 Học tập</a>

<h1>BÀI 12: CRUD JAVASCRIPT CƠ BẢN</h1>

<div class="note">
<strong>Mục tiêu:</strong> Quản lý danh sách có thêm – sửa – xóa – lưu dữ liệu.
</div>

<h2>1. Nhập nội dung</h2>
<input type="text" id="noidung" placeholder="Nhập nội dung">
<button onclick="them()">Thêm</button>

<h2>2. Danh sách</h2>
<ul id="danhsach"></ul>

</div>

<script>
let ds = JSON.parse(localStorage.getItem("ds")) || [];
let indexSua = -1;

hienThi();

function them(){
  let nd = document.getElementById("noidung").value;
  if(nd===""){
    alert("Chưa nhập nội dung");
    return;
  }

  if(indexSua === -1){
    ds.push(nd);
  }else{
    ds[indexSua] = nd;
    indexSua = -1;
  }

  luu();
  document.getElementById("noidung").value="";
  hienThi();
}

function hienThi(){
  let ul = document.getElementById("danhsach");
  ul.innerHTML="";

  ds.forEach(function(item,i){
    let li = document.createElement("li");
    li.innerHTML = `
      ${i+1}. ${item}
      <span class="action">
        <button onclick="sua(${i})">Sửa</button>
        <button onclick="xoa(${i})">Xóa</button>
      </span>
    `;
    ul.appendChild(li);
  });
}

function sua(i){
  document.getElementById("noidung").value = ds[i];
  indexSua = i;
}

function xoa(i){
  if(confirm("Xóa mục này?")){
    ds.splice(i,1);
    luu();
    hienThi();
  }
}

function luu(){
  localStorage.setItem("ds", JSON.stringify(ds));
}
</script>
<!-- NÚT LÊN ĐẦU TRANG -->
<button id="backToTop" title="Lên đầu trang">⬆</button>

<script>
/* ===============================
   BACK TO TOP – TỰ ĐỘNG
   =============================== */
const backToTop = document.getElementById("backToTop");

window.addEventListener("scroll", () => {
  if (window.scrollY > 300) {
    backToTop.style.display = "block";
  } else {
    backToTop.style.display = "none";
  }
});

backToTop.addEventListener("click", () => {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>

</body>
</html>
