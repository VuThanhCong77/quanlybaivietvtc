<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 16 – Quản lý danh sách (CRUD)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="../icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="../icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="../icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

<style>
h1, h2, h3, h4 {
font-size: 18px;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    color: #0b5394;
}

h2 {
    background: #d9e2f3;
    padding: 8px;
    border-left: 6px solid #0b5394;
}

.box {
    background: #fff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
}

button {
    padding: 6px 12px;
    cursor: pointer;
}

ul {
    padding-left: 20px;
}

li {
    margin-bottom: 6px;
}
/* ===============================
   NÚT LÊN ĐẦU TRANG
   =============================== */
#backToTop{
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #0a7f99, #0ab3c9);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: none;
  z-index: 3000;
  box-shadow: 0 6px 16px rgba(0,0,0,.25);
  transition: all .25s ease;
}

#backToTop:hover{
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0,0,0,.35);
}

@media(max-width:600px){
  #backToTop{
    right: 12px;
    bottom: 16px;
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}

</style>
</head>

<body>
<div class="container">

<a href="../hoctap.html">📖 Học tập</a>

<h1>BÀI 16: QUẢN LÝ DANH SÁCH (CRUD)</h1>

<div class="box">
<h2>1. Thêm dữ liệu</h2>
<input type="text" id="title" placeholder="Nhập nội dung...">
<button onclick="addItem()">➕ Thêm</button>
</div>

<div class="box">
<h2>2. Danh sách dữ liệu</h2>
<ul id="list"></ul>
</div>
</div>

<script>
// ===== DỮ LIỆU =====
let items = JSON.parse(localStorage.getItem("items")) || [];

// ===== HIỂN THỊ =====
function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    items.forEach((item, index) => {
        list.innerHTML += `
            <li>
                ${item}
                <button onclick="deleteItem(${index})">❌</button>
            </li>
        `;
    });

    localStorage.setItem("items", JSON.stringify(items));
}

// ===== THÊM =====
function addItem() {
    const input = document.getElementById("title");
    if (input.value.trim() === "") return;

    items.push(input.value);
    input.value = "";
    render();
}

// ===== XÓA =====
function deleteItem(index) {
    items.splice(index, 1);
    render();
}

// ===== KHI MỞ TRANG =====
render();
</script>
<!-- NÚT LÊN ĐẦU TRANG -->
<button id="backToTop" title="Lên đầu trang">⬆</button>

<script>
/* ===============================
   BACK TO TOP – TỰ ĐỘNG
   =============================== */
const backToTop = document.getElementById("backToTop");

window.addEventListener("scroll", () => {
  if (window.scrollY > 300) {
    backToTop.style.display = "block";
  } else {
    backToTop.style.display = "none";
  }
});

backToTop.addEventListener("click", () => {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>

</body>
</html>
