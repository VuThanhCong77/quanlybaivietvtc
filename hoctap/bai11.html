
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 11 - Lưu dữ liệu với LocalStorage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="../icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="../icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="../icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

<style>
h1,h2 {
font-size: 18px;
}
/* ===============================
   NÚT LÊN ĐẦU TRANG
   =============================== */
#backToTop{
  position: fixed;
  right: 18px;
  bottom: 22px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #0a7f99, #0ab3c9);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: none;
  z-index: 3000;
  box-shadow: 0 6px 16px rgba(0,0,0,.25);
  transition: all .25s ease;
}

#backToTop:hover{
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0,0,0,.35);
}

@media(max-width:600px){
  #backToTop{
    right: 12px;
    bottom: 16px;
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}

body{
  font-family:Arial;
  background:#f4f6f8;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:6px;
}
h1,h2{color:#b30000}
input,button{
  padding:8px;
  margin:5px 0;
}
ul{list-style:none;padding:0}
li{
  background:#eef2f5;
  margin:5px 0;
  padding:8px;
  border-radius:4px;
}
.note{
  background:#fffbe6;
  border-left:4px solid #f0c000;
  padding:10px;
  margin:15px 0;
}
</style>
</head>
<body>

<div class="container">
<a href="../hoctap.html">📖 Học tập</a>
<h1>BÀI 11: LƯU DỮ LIỆU VỚI LOCALSTORAGE</h1>

<div class="note">
<strong>Mục tiêu:</strong> Website ghi nhớ dữ liệu ngay cả khi tải lại trang.
</div>

<h2>1. Nhập công việc cần làm</h2>
<input type="text" id="task" placeholder="Nhập công việc">
<button onclick="themViec()">Thêm</button>

<h2>2. Danh sách công việc</h2>
<ul id="danhsach"></ul>
<button onclick="xoaTatCa()">Xóa toàn bộ</button>

<h2>3. Kiến thức trọng tâm</h2>
<ul>
<li>localStorage.setItem()</li>
<li>localStorage.getItem()</li>
<li>JSON.stringify()</li>
<li>JSON.parse()</li>
</ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
hienThi();

function themViec(){
  let t = document.getElementById("task").value;
  if(t===""){
    alert("Chưa nhập nội dung");
    return;
  }
  tasks.push(t);
  localStorage.setItem("tasks", JSON.stringify(tasks));
  document.getElementById("task").value="";
  hienThi();
}

function hienThi(){
  let ul = document.getElementById("danhsach");
  ul.innerHTML="";
  tasks.forEach(function(item,index){
    let li=document.createElement("li");
    li.textContent=(index+1)+". "+item;
    ul.appendChild(li);
  });
}

function xoaTatCa(){
  if(confirm("Xóa toàn bộ dữ liệu?")){
    localStorage.removeItem("tasks");
    tasks=[];
    hienThi();
  }
}
</script>
<!-- NÚT LÊN ĐẦU TRANG -->
<button id="backToTop" title="Lên đầu trang">⬆</button>

<script>
/* ===============================
   BACK TO TOP – TỰ ĐỘNG
   =============================== */
const backToTop = document.getElementById("backToTop");

window.addEventListener("scroll", () => {
  if (window.scrollY > 300) {
    backToTop.style.display = "block";
  } else {
    backToTop.style.display = "none";
  }
});

backToTop.addEventListener("click", () => {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>

</body>
</html>
