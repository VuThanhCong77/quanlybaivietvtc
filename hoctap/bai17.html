<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 17 – Cập nhật dữ liệu (UPDATE)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
h1, h2, h3, h4 {
font-size: 18px;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    color: #0b5394;
}

h2 {
    background: #d9e2f3;
    padding: 8px;
    border-left: 6px solid #0b5394;
}

.box {
    background: #fff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
}

button {
    padding: 6px 12px;
    margin-right: 6px;
    cursor: pointer;
}

ul {
    padding-left: 20px;
}

li {
    margin-bottom: 6px;
}
</style>
</head>

<body>
<a href="../hoctap.html">📖 Học tập</a>

<h1>BÀI 17: CẬP NHẬT DỮ LIỆU (UPDATE)</h1>

<div class="box">
<h2>1. Form nhập / chỉnh sửa</h2>
<input type="text" id="content" placeholder="Nhập nội dung...">
<button onclick="save()">💾 Lưu</button>
<button onclick="cancelEdit()">↩ Hủy</button>
</div>

<div class="box">
<h2>2. Danh sách dữ liệu</h2>
<ul id="list"></ul>
</div>

<script>
// ===== DỮ LIỆU =====
let items = JSON.parse(localStorage.getItem("items17")) || [];
let editIndex = -1;

// ===== HIỂN THỊ =====
function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    items.forEach((item, index) => {
        list.innerHTML += `
            <li>
                ${item}
                <button onclick="editItem(${index})">✏️</button>
                <button onclick="deleteItem(${index})">❌</button>
            </li>
        `;
    });

    localStorage.setItem("items17", JSON.stringify(items));
}

// ===== LƯU (THÊM / SỬA) =====
function save() {
    const input = document.getElementById("content");
    if (input.value.trim() === "") return;

    if (editIndex === -1) {
        // Thêm mới
        items.push(input.value);
    } else {
        // Cập nhật
        items[editIndex] = input.value;
        editIndex = -1;
    }

    input.value = "";
    render();
}

// ===== CHỌN SỬA =====
function editItem(index) {
    document.getElementById("content").value = items[index];
    editIndex = index;
}

// ===== HỦY =====
function cancelEdit() {
    document.getElementById("content").value = "";
    editIndex = -1;
}

// ===== XÓA =====
function deleteItem(index) {
    if (!confirm("Xóa mục này?")) return;
    items.splice(index, 1);
    render();
}

// ===== KHỞI TẠO =====
render();
</script>

</body>
</html>
