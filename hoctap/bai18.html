<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 18 – Dữ liệu dạng đối tượng</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="../icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="../icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="../icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

<style>
h1, h2, h3, h4 {
font-size: 18px;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    color: #0b5394;
}

h2 {
    background: #d9e2f3;
    padding: 8px;
    border-left: 6px solid #0b5394;
}

.box {
    background: #fff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    font-family: inherit;
}

button {
    padding: 6px 12px;
    cursor: pointer;
}

.article {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.article small {
    color: #666;
}
</style>
</head>

<body>
<a href="../hoctap.html">📖 Học tập</a>
<h1>BÀI 18: TỔ CHỨC DỮ LIỆU DẠNG ĐỐI TƯỢNG</h1>

<div class="box">
<h2>1. Thêm bài viết</h2>

<input type="text" id="title" placeholder="Tiêu đề bài viết">
<textarea id="content" placeholder="Nội dung bài viết"></textarea>

<button onclick="addPost()">➕ Thêm bài</button>
</div>

<div class="box">
<h2>2. Danh sách bài viết</h2>
<div id="posts"></div>
</div>

<script>
// ===== DỮ LIỆU =====
let posts = JSON.parse(localStorage.getItem("posts18")) || [];

// ===== TẠO ID =====
function generateId() {
    return Date.now();
}

// ===== HIỂN THỊ =====
function render() {
    const box = document.getElementById("posts");
    box.innerHTML = "";

    posts.forEach(post => {
        box.innerHTML += `
            <div class="article">
                <h3>${post.title}</h3>
                <small>ID: ${post.id} | ${post.date}</small>
                <p>${post.content}</p>
            </div>
        `;
    });

    localStorage.setItem("posts18", JSON.stringify(posts));
}

// ===== THÊM =====
function addPost() {
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    if (!title || !content) return;

    const post = {
        id: generateId(),
        title: title,
        content: content,
        date: new Date().toLocaleDateString("vi-VN")
    };

    posts.unshift(post);

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    render();
}

// ===== KHỞI TẠO =====
render();
</script>

</body>
</html>
