<style>
:root{
  --primary:#4A3B2A;
  --accent:#CBB67A;
  --bg:#f5efe0;
}
body{margin:0;font-family:"Times New Roman",serif;background:var(--bg)}

header{background:var(--primary);color:#fff;padding:12px;text-align:center;position:sticky;top:0}

.toolbar{display:flex;gap:10px;padding:10px;flex-wrap:wrap;justify-content:center}
input,select{padding:8px;border-radius:6px;border:1px solid #ccc}

.timeline{display:flex;overflow-x:auto;gap:10px;padding:10px;background:#2f2519}
.year{color:#fff;padding:8px 14px;background:#6b5842;border-radius:20px;cursor:pointer}
.year.active{background:#ffc107;color:#000;font-weight:bold}

.container{padding:12px;max-width:1000px;margin:auto}
.card{background:#fff;margin-bottom:14px;padding:14px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.15);cursor:pointer}
.card:hover{transform:translateY(-2px)}

.badge{background:#0b3d91;color:#fff;padding:3px 8px;border-radius:10px;font-size:12px}
.title{font-weight:bold;margin-left:6px;color:#4c1821}
.details{display:none;margin-top:10px;line-height:1.6}

img,video{width:100%;border-radius:8px;margin-top:8px}

.featured{border-left:6px solid red;background:#fff8f8}

footer{text-align:center;padding:10px;background:var(--primary);color:#fff;margin-top:20px}

@media(max-width:768px){
.timeline{display:none}
}
</style>

<style>
/* MENU NGANG DESKTOP */
.nav-links{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:8px 0;
  background:rgba(255,255,255,.15);

@media(max-width:991px){
  .nav-links{display:none}

/* MENU */
.nav-links a,

  color:#ffffff;
  font-weight:600;
}

.tooltip {
  position: relative;
  display: inline-block;
  cursor: pointer;
}

.tooltip .tooltip-text {
  visibility: hidden;
  width: auto;
  background-color: #727e05;
  color: #fff;
  text-align: center;
  padding: 5px;
  border-radius: 6px;

  position: absolute;
  bottom: -150%; /* hiện phía dưới */
  left: 100%;
  transform: translateX(-50%);
  z-index: 1;

  opacity: 0;
  transition: opacity 0.3s;
}

.tooltip:hover .tooltip-text {
  visibility: visible;
  opacity: 1;
}
</style>

<style>
/* Menu quay lại*/
.floating-menu{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:9999;
}

/* Nút chính */
.main-float{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#1565c0,#0d47a1);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:.3s;
}

.main-float:hover{
    transform:scale(1.1);
  }

/* Các nút phụ */
.sub-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:10px;

    opacity:0;
    transform:translateY(20px);
    pointer-events:none;

    transition:.35s ease;
}

/* Khi mở */
.sub-buttons.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

/* Nút con */
.sub-buttons button{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#e91e63;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:.3s;
}

.sub-buttons button:hover{
    transform:scale(1.1);
    background:#00acc1;
}

/* ===== BANNER SLIDER ===== */

.banner-slider{
position:relative;
width:100%;
max-width:1200px;
margin:auto;
overflow:hidden;
border-radius:10px;
}

/* slide track */

.slides{
display:flex;
transition:transform 0.8s ease;
}

/* mỗi slide */

.slide{
min-width:100%;
display:flex;
gap:10px;
}

/* ảnh */

.banner-img{
flex:1;
overflow:hidden;
border-radius:8px;
}

.banner-img img{
width:100%;
height:360px;
object-fit:cover;
transition:transform 0.7s;
}

.banner-img:hover img{
transform:scale(1.08);
}

/* nút điều hướng */

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.5);
color:rgb(243, 239, 13);
border:none;
font-size:26px;
width:40px;
height:40px;
cursor:pointer;
border-radius:50%;
}

.prev{
left:10px;
}

.next{
right:10px;
}

.prev:hover,.next:hover{
background:#df092d;

}
/* chấm tròn */

.dots{
text-align:center;
margin-top:10px;
}

.dot{
height:12px;
width:12px;
margin:0 4px;
background:#bbb;
border-radius:50%;
display:inline-block;
cursor:pointer;
}

.dot.active{
background:#d40000;
}

/* mobile */

@media(max-width:768px){

.slide{
flex-direction:column;
}

.banner-img img{
height:220px;
}
}

.img-giua {

  text-align: center;
  height: auto;
}

.card {
  background: #CBB67A;
  font-family: Times New Roman;
  padding:15px; 
  border-radius:8px; 
  }

</style>

<option value="Đảng">Đảng</option>

<script>
let data=[];
let currentYear=null;

fetch('sukien.json')
.then(r=>r.json())
.then(d=>{
  data=d;
  init();
});

function init(){
  let years=[...new Set(data.map(e=>e.year))].sort((a,b)=>b-a);

  let timeline=document.getElementById('timeline');
  let yearSelect=document.getElementById('yearSelect');

  years.forEach(y=>{
    let btn=document.createElement('div');
    btn.className='year';
    btn.innerText=y;
    btn.onclick=()=>selectYear(y);
    timeline.appendChild(btn);

    let opt=document.createElement('option');
    opt.value=y;
    opt.innerText=y;
    yearSelect.appendChild(opt);
  });

  yearSelect.onchange=(e)=>selectYear(e.target.value);

  selectYear(years[0]);
}

function selectYear(year){
  currentYear=year;

  document.querySelectorAll('.year').forEach(e=>{
    e.classList.toggle('active', e.innerText==year);
  });

  render();
}

function render(){
  let keyword=document.getElementById('search').value.toLowerCase();
  let cat=document.getElementById('categoryFilter').value;

  let list=data.filter(e=>
    e.year==currentYear &&
    (!cat || e.category==cat) &&
    (
      e.title.toLowerCase().includes(keyword) ||
      (e.tags && e.tags.join('').toLowerCase().includes(keyword))
    )
  );

  let content=document.getElementById('content');
  content.innerHTML='';

  if(list.length===0){
    content.innerHTML='<p>Không có dữ liệu</p>';
    return;
  }

  list.forEach(e=>{
    let div=document.createElement('div');
    div.className='card '+(e.featured?'featured':'');

    div.innerHTML=`
      <div>
        <span class="badge">${e.time||''}</span>
        <span class="title">${e.title}</span>
      </div>
      <div class="details">
        <p>${e.desc||''}</p>
        ${e.image?`<img loading="lazy" src="${e.image}">`:''}
        ${e.video?`<video controls src="${e.video}"></video>`:''}
        ${e.audio?`<audio controls src="${e.audio}"></audio>`:''}
        ${e.pdf?`<p><a href="${e.pdf}" target="_blank">📄 Xem tài liệu</a></p>`:''}
      </div>
    `;

    div.onclick=()=>{
      let d=div.querySelector('.details');
      d.style.display=d.style.display==='block'?'none':'block';
    };

    content.appendChild(div);
  });
}

document.getElementById('search').onkeyup=render;
document.getElementById('categoryFilter').onchange=render;
</script>

<div class="floating-menu">

<script>
function toggleFloatMenu(){
    document.getElementById("subButtons").classList.toggle("show");
}

function scrollToTop(){
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
</script>

<script>

const slides = document.getElementById("slides");
const total = slides.children.length;

let index = 0;

const dotsContainer = document.getElementById("dots");

/* tạo chấm */

for(let i=0;i<total;i++){

let dot=document.createElement("span");

dot.className="dot";

dot.onclick=function(){goSlide(i)};

dotsContainer.appendChild(dot);

}

function updateDots(){

let dots=document.querySelectorAll(".dot");

dots.forEach(d=>d.classList.remove("active"));

dots[index].classList.add("active");

}

function showSlide(){

slides.style.transform="translateX(-"+index*100+"%)";

updateDots();

}

function nextSlide(){

index++;

if(index>=total){
index=0;
}

showSlide();

}

function prevSlide(){

index--;

if(index<0){
index=total-1;
}

showSlide();

}

function goSlide(i){

index=i;

showSlide();

}

/* auto slide */

setInterval(nextSlide,5000);

showSlide();

</script>
