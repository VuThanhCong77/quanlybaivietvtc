<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Podcast | Vũ Thành Công</title>

<link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/podcast.css">

</head>

<body>


<section class="podcast">

<h1>🎙 Podcast - Đi qua những mùa nhớ</h1>

<div id="podcast-list"></div>


<div id="podcastPlayer" class="podcast-player">

  <div class="podcast-info">

    <div class="podcast-status">
      🎙 Đang phát
    </div>

    <div id="podcastChapter" class="podcast-chapter">
      Chương I: Ký ức tuổi thơ
    </div>

    <div id="podcastTitle" class="podcast-title">
      Những trưa hè oi ả
    </div>

  </div>

  <div class="podcast-controls">

    <button id="prevBtn" title="Bài trước">
      ⏮
    </button>

    <button id="playBtn" title="Phát">
      ▶️
    </button>

    <button id="pauseBtn" title="Tạm dừng">
      ⏸
    </button>

    <button id="stopBtn" title="Dừng">
      ⏹
    </button>

    <button id="nextBtn" title="Bài tiếp theo">
      ⏭
    </button>

  </div>

</div>

</section>


<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/podcast.js"></script>

</body>
</html>
