<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast | Vũ Thành Công</title>

    <!-- Liên kết file CSS chính của bạn -->
    <link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/podcast.css">
    <link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/dieu-huong.css">
   
    <style>
        /* THIẾT KẾ KHUNG CHỌN DANH MỤC THẢ XUỐNG GỌN GÀNG */
        .category-select-wrapper {
            max-width: 400px;
            margin: 10px auto 25px auto;
            text-align: center;
            padding: 0 10px;
        }

        .category-select-wrapper label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        .category-dropdown {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #333;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            outline: none;
        }

        .category-dropdown:hover, .category-dropdown:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }
    </style>
</head>

<body>

<section class="podcast">
    <h1>🎙 Nghe bài viết</h1>

    <!-- MENU THẢ XUỐNG LỌC CHỦ ĐỀ -->
    <div class="category-select-wrapper">
        <label for="categorySelect">📂 Lọc theo chủ đề:</label>
        <select id="categorySelect" class="category-dropdown" onchange="filterByCategory(this.value)">
            <!-- Các tùy chọn danh mục sẽ được sinh tự động tại đây -->
        </select>
    </div>

    <!-- KHUNG CHỨA DANH SÁCH BÀI VIẾT -->
    <div id="podcast-list">
        <p style="text-align: center; color: #666;">Đang tải danh sách bài viết...</p>
    </div>

    <!-- THANH TRÌNH PHÁT CỐ ĐỊNH -->
    <div id="podcastPlayer" class="podcast-player">
        <div class="podcast-info">
            <div id="podcastStatus" class="podcast-status">
                🎙 Sẵn sàng phát
            </div>
            <div id="podcastChapter" class="podcast-chapter">
                Chọn bài viết để nghe
            </div>
            <div id="podcastTitle" class="podcast-title">
                Chưa chọn bài viết
            </div>
        </div>

        <div class="podcast-controls">
            <button id="prevBtn" title="Bài trước">⏮</button>
            <button id="playBtn" title="Phát">▶️</button>
            <button id="pauseBtn" title="Tạm dừng">⏸</button>
            <button id="stopBtn" title="Dừng">⏹</button>
            <button id="nextBtn" title="Bài tiếp theo">⏭</button>
        </div>
    </div>
</section>

<!-- NÚT TRỜ VỀ -->
<button id="nut-tro-ve" class="nut-dieu-huong" onclick="history.back()" title="Trở về">←</button>

<!-- NÚT LÊN ĐẦU TRANG -->
<button id="nut-len-dau" class="nut-dieu-huong" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Lên đầu trang">↑</button>

<script>
    let articles = [];
    let filteredArticles = [];
    let currentIndex = -1;
    let synth = window.speechSynthesis;
    let currentCategory = 'Tất cả';
    
    let sentenceQueue = [];
    let currentSentenceIndex = 0;
    let isSpeaking = false;
    let isPaused = false;

    const podcastListEl = document.getElementById('podcast-list');
    const categorySelectEl = document.getElementById('categorySelect');
    const podcastTitleEl = document.getElementById('podcastTitle');
    const podcastChapterEl = document.getElementById('podcastChapter');
    const podcastStatusEl = document.getElementById('podcastStatus');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Tải dữ liệu từ tệp JSON
    async function loadArticles() {
        try {
            const response = await fetch('https://vuthanhcong77.github.io/quanlybaivietvtc/du-lieu/bai-viet.json');
            if (!response.ok) throw new Error('Không thể tải tệp bai-viet.json');
            articles = await response.json();
            filteredArticles = articles;
            
            buildCategoryDropdown(); // Tạo danh sách xổ xuống
            renderPodcastList();     // Hiển thị danh sách ban đầu
        } catch (error) {
            console.error(error);
            podcastListEl.innerHTML = `<p style="color:red; text-align:center;">Lỗi tải dữ liệu. Vui lòng kiểm tra lại đường dẫn!</p>`;
        }
    }

    // Tự động quét các chủ đề để đưa vào thẻ <select>
    function buildCategoryDropdown() {
        let categoriesSet = new Set();
        articles.forEach(item => {
            if (Array.isArray(item.category)) {
                item.category.forEach(cat => categoriesSet.add(cat.trim()));
            } else if (typeof item.category === 'string' && item.category.trim() !== '') {
                categoriesSet.add(item.category.trim());
            }
        });

        categorySelectEl.innerHTML = '';

        // Tùy chọn "Tất cả"
        const allOption = document.createElement('option');
        allOption.value = 'Tất cả';
        allOption.innerText = '✨ Tất cả chủ đề';
        categorySelectEl.appendChild(allOption);

        // Các tùy chọn theo từng chủ đề
        categoriesSet.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.innerText = cat;
            categorySelectEl.appendChild(option);
        });
    }

    // Xử lý khi chọn danh mục từ menu xổ xuống
    function filterByCategory(category) {
        currentCategory = category;

        if (category === 'Tất cả') {
            filteredArticles = articles;
        } else {
            filteredArticles = articles.filter(item => {
                if (Array.isArray(item.category)) {
                    return item.category.map(c => c.trim()).includes(category);
                } else if (typeof item.category === 'string') {
                    return item.category.trim() === category;
                }
                return false;
            });
        }

        renderPodcastList();
    }

    // Hiển thị danh sách bài viết theo CSS card sẵn có
    function renderPodcastList() {
        podcastListEl.innerHTML = '';

        if (filteredArticles.length === 0) {
            podcastListEl.innerHTML = `<p style="text-align: center; color: #666; padding: 20px;">Không có bài viết nào thuộc chủ đề này.</p>`;
            return;
        }

        filteredArticles.forEach((item) => {
            const card = document.createElement('div');
            card.className = `podcast-card ${item === articles[currentIndex] ? 'active' : ''}`;

            const categoryText = Array.isArray(item.category) ? item.category.join(' • ') : (item.category || 'Tổng hợp');

            card.innerHTML = `
                <img src="${item.image || 'https://via.placeholder.com/220x140'}" alt="${item.title}" class="podcast-thumb" onerror="this.src='https://via.placeholder.com/220x140'">
                <div class="podcast-content">
                    <span class="podcast-category">${categoryText}</span>
                    <h3>${item.title}</h3>
                    <p>${item.desc || ''}</p>
                    <div class="podcast-actions">
                        <button onclick="selectAndPlayArticle(${articles.indexOf(item)})">▶ Nghe bài viết</button>
                        <a href="${item.url}" target="_blank">Đọc bài viết</a>
                    </div>
                </div>
            `;
            podcastListEl.appendChild(card);
        });
    }

    async function fetchArticleContent(url) {
        try {
            podcastStatusEl.innerText = "⏳ Đang tải nội dung...";
            const res = await fetch(url);
            if (!res.ok) throw new Error("Không thể fetch URL");
            const htmlText = await res.text();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            
            const removeSelectors = ['header', 'footer', 'nav', 'script', 'style', '.sidebar', '#nut-tro-ve', '#nut-len-dau'];
            removeSelectors.forEach(s => doc.querySelectorAll(s).forEach(el => el.remove()));

            const contentEl = doc.querySelector('article') || doc.querySelector('.content') || doc.querySelector('main') || doc.body;
            return contentEl.innerText || contentEl.textContent || "";
        } catch (e) {
            console.warn("Dùng mô tả dự phòng:", e);
            return null;
        }
    }

    async function selectAndPlayArticle(index) {
        if (index < 0 || index >= articles.length) return;
        
        stopSpeech();
        currentIndex = index;
        renderPodcastList();

        const item = articles[currentIndex];
        podcastTitleEl.innerText = item.title;
        podcastChapterEl.innerText = Array.isArray(item.category) ? item.category.join(' • ') : (item.category || '');

        let rawText = await fetchArticleContent(item.url);
        
        if (!rawText || rawText.length < 50) {
            rawText = `${item.title}.\n${item.desc || ''}`;
        }

        sentenceQueue = rawText
            .split(/(?<=[.!?;\n])\s+/)
            .map(s => s.trim())
            .filter(s => s.length > 0);

        currentSentenceIndex = 0;
        playCurrentSentence();
    }

    function playCurrentSentence() {
        if (currentSentenceIndex >= sentenceQueue.length) {
            isSpeaking = false;
            isPaused = false;
            podcastStatusEl.innerText = "⏹ Đã hoàn tất";
            return;
        }

        const sentenceText = sentenceQueue[currentSentenceIndex];
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(sentenceText);
        utterance.lang = 'vi-VN';
        utterance.rate = 0.95;

        utterance.onstart = () => {
            isSpeaking = true;
            isPaused = false;
            podcastStatusEl.innerText = `🎙 Đang phát (${currentSentenceIndex + 1}/${sentenceQueue.length})`;
        };

        utterance.onend = () => {
            currentSentenceIndex++;
            setTimeout(() => {
                if (isSpeaking && !isPaused) {
                    playCurrentSentence();
                }
            }, 60);
        };

        utterance.onerror = () => {
            currentSentenceIndex++;
            if (isSpeaking && !isPaused) {
                playCurrentSentence();
            }
        };

        synth.speak(utterance);
    }

    playBtn.onclick = () => {
        if (currentIndex === -1 && articles.length > 0) {
            const firstItem = filteredArticles[0] || articles[0];
            selectAndPlayArticle(articles.indexOf(firstItem));
            return;
        }
        if (isPaused) {
            synth.resume();
            isPaused = false;
            isSpeaking = true;
            podcastStatusEl.innerText = "🎙 Đang phát";
        } else if (!isSpeaking && sentenceQueue.length > 0) {
            isSpeaking = true;
            playCurrentSentence();
        }
    };

    pauseBtn.onclick = () => {
        if (synth.speaking && !synth.paused) {
            synth.pause();
            isPaused = true;
            isSpeaking = false;
            podcastStatusEl.innerText = "⏸ Tạm dừng";
        }
    };

    stopBtn.onclick = () => {
        stopSpeech();
    };

    prevBtn.onclick = () => {
        const currentFilteredIndex = filteredArticles.findIndex(item => item === articles[currentIndex]);
        if (currentFilteredIndex > 0) {
            selectAndPlayArticle(articles.indexOf(filteredArticles[currentFilteredIndex - 1]));
        }
    };

    nextBtn.onclick = () => {
        const currentFilteredIndex = filteredArticles.findIndex(item => item === articles[currentIndex]);
        if (currentFilteredIndex !== -1 && currentFilteredIndex < filteredArticles.length - 1) {
            selectAndPlayArticle(articles.indexOf(filteredArticles[currentFilteredIndex + 1]));
        }
    };

    function stopSpeech() {
        synth.cancel();
        isSpeaking = false;
        isPaused = false;
        sentenceQueue = [];
        currentSentenceIndex = 0;
        podcastStatusEl.innerText = "⏹ Đã dừng";
    }

    window.addEventListener('DOMContentLoaded', loadArticles);
</script>

</body>
</html>
