<script>
let currentPost = null;

async function loadPost() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            document.getElementById('view-title').innerText = "Thiếu ID bài viết!";
            return;
        }

        const response = await fetch('posts_data.json');
        const data = await response.json();
        
        // Tìm bài viết
       const post = data.find(p =>
String(p.id).trim() === String(postId).trim()
);

       if(post && !Array.isArray(post.category)){
post.category = [post.category];
}

        if (post) {
            currentPost = post; // Gán ngay lập tức
            loadRelatedPosts(post);
            document.title = post.title;
            document.getElementById('view-title').innerText = post.title;
            document.getElementById('view-date').innerText = post.date || "Không xác định";
            document.getElementById('view-author').innerText = post.author || "Admin";
            document.getElementById('view-content').innerHTML = post.description || "";
     articleLoaded = true;
     syncViews(post);
    
            const imgElement = document.getElementById('view-image');
            if (post.thumbnail) {
                // Tự động chuyển link GitHub thành link Raw nếu cần
                let finalImg = post.thumbnail.replace('github.com', 'raw.githubusercontent.com').replace('/tree/', '/');
                imgElement.src = finalImg;
                imgElement.style.display = 'block';
            }
        } else {
            document.getElementById('post-container').innerHTML = `<h2 class="text-danger">Bài viết chưa được cập nhật!</h2>`;
        }
    } catch (error) {
        console.error("Lỗi load bài viết:", error);
    }
}

function copyLink(btn){

    if (!currentPost) return;

const link =
"https://vuthanhcong77.github.io/quanlybaivietvtc/post.html?id=" +
currentPost.id;

    navigator.clipboard.writeText(link)
    .then(()=>{

        btn.classList.add("copied");

        btn.innerHTML =
        '<i class="fas fa-check-circle"></i><span>Đã sao chép liên kết</span>';

        setTimeout(()=>{

            btn.classList.remove("copied");

            btn.innerHTML =
            '<i class="fas fa-share-alt"></i><span>Copy link chia sẻ</span>';

        },1800);

    })
    .catch(()=>{
        alert("Không copy được liên kết!");
    });
}

function guiGopY() {
    const noiDung = document.getElementById("gy-noidung").value.trim();
    if (!noiDung) {
        alert("Vui lòng nhập nội dung!");
        return;
    }

    const data = {
        postId: currentPost?.id || "",
        tieuDe: currentPost?.title || document.title,
        ten: document.getElementById("gy-ten").value || "Ẩn danh",
        noiDung: noiDung,
        thoiGian: new Date().toLocaleString('vi-VN'),
        url: window.location.href
    };

    fetch("https://script.google.com/macros/s/AKfycbzb_ovIs2kZto3vuHVPATt1Iq0Uvb0GiQo3hvCm_FAcjRgfaTPyjTG0Qir4ECEkyOE8-g/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(() => {
        document.getElementById("gy-thongbao").innerText = "Gửi thành công!";
        document.getElementById("gy-noidung").value = "";
    })
    .catch(() => alert("Có lỗi xảy ra!"));
}

document.addEventListener('DOMContentLoaded', loadPost);


const VIEW_API = "https://script.google.com/macros/s/AKfycbxi8dkZZjOCRR6IcyVYA2qP0t9ce94UCdeV-xSMrWpqk87ebV-uBfIcTQmjycV_5R4bWw/exec";

async function syncViews(post) {
  try {

    const res = await fetch(
      VIEW_API +
      "?action=increment" +
      "&postId=" + encodeURIComponent(post.id) +
      "&title=" + encodeURIComponent(post.title)
    );

    const data = await res.json();

    if (data.views !== undefined) {
      document.getElementById("view-count").innerText = data.views;
    }

  } catch (err) {
    console.error("Lỗi đồng bộ lượt xem:", err);
  }
}
</script>

<script>

async function loadRelatedPosts(currentPost){

    try{

        const response =
            await fetch('posts_data.json');

        const posts = await response.json();

        // Lọc bài liên quan
        const relatedPosts = posts.filter(post => {

            // bỏ bài hiện tại
            if(post.id === currentPost.id){
                return false;
            }

            // cùng category
const postCats = Array.isArray(post.category)
? post.category
: [post.category];

const currentCats = Array.isArray(currentPost.category)
? currentPost.category
: [currentPost.category];

const sameCategory =
postCats.some(cat => currentCats.includes(cat));

            // cùng tags
            const sameTags =
                post.tags &&
                currentPost.tags &&
                post.tags.some(tag =>
                    currentPost.tags.includes(tag)
                );

            return sameCategory || sameTags;

        }).slice(0,4);

        const container =
            document.getElementById("relatedPosts");

        // Không có bài
        if(relatedPosts.length === 0){

            container.innerHTML =
                '<div class="text-muted">Chưa có bài liên quan.</div>';

            return;
        }

        // Render
        container.innerHTML =
            relatedPosts.map(post => `

            <a href="?id=${post.id}"
               class="related-card">

                <img src="${post.thumbnail}"
                     alt="${post.title}"
                     loading="lazy">

                <div class="related-content">

                    <h4>${post.title}</h4>

                    <p>
                        ${(post.description || '')
                        .replace(/<[^>]+>/g,'')
                        .substring(0,90)}...
                    </p>

                    <div class="related-date">
                        <i class="fas fa-calendar-alt"></i>
                        ${post.date || ''}
                    </div>

                </div>

            </a>

            `).join('');

    }
    catch(error){

        console.error(
            "Lỗi bài liên quan:",
            error
        );

    }

}

</script>

<script>
const btn = document.getElementById("ttsBtn");
const progress = document.getElementById("ttsProgress");
const timeDisplay = document.getElementById("ttsTime");
const rateSelect = document.getElementById("ttsRate");
const voiceSelect = document.getElementById("ttsVoice");

let utterance;
let voices = [];
let textContent = "";
let articleLoaded = false;
let currentCharIndex = 0;
let isPlaying = false;
let isPaused = false;
let totalDuration = 0;
let startTime = 0;
let timer;

// Lấy nội dung bài viết
function getArticleText() {
  return document.getElementById("view-content").innerText;
}

// Format thời gian
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" + s : s);
}

// Load voice
function loadVoices() {
  voices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;

// Lấy voice tiếng Việt
function getVietnameseVoice(type) {
  const viVoices = voices.filter(v => v.lang.includes("vi"));

  if (viVoices.length === 0) return null;

  if (type === "male") {
    return viVoices.find(v =>
      v.name.toLowerCase().includes("male") ||
      v.name.toLowerCase().includes("nam")
    ) || viVoices[0];
  } else {
    return viVoices.find(v =>
      v.name.toLowerCase().includes("female") ||
      v.name.toLowerCase().includes("nu") ||
      v.name.toLowerCase().includes("woman")
    ) || viVoices[0];
  }
}

// Bắt đầu đọc
function speakFrom(index = 0) {

  if (!articleLoaded) {
    alert("Bài viết đang tải, vui lòng chờ 1-2 giây!");
    return;
  }

  speechSynthesis.cancel();
  clearInterval(timer);

  textContent = getArticleText();
  if (!textContent.trim()) return;

  utterance = new SpeechSynthesisUtterance(
    textContent.substring(index)
  );

  utterance.lang = "vi-VN";
  utterance.rate = parseFloat(rateSelect.value);

  const voice = getVietnameseVoice(voiceSelect.value);
  if (voice) utterance.voice = voice;

  utterance.onboundary = function(event) {
    currentCharIndex = index + event.charIndex;
  };

  utterance.onstart = function() {
    isPlaying = true;
    isPaused = false;
    btn.innerText = "⏸";
    startTimer();
  };

  utterance.onend = function() {
    resetPlayer();
  };

  speechSynthesis.speak(utterance);
}

// Timer
function startTimer() {
const words = textContent.split(/\s+/).length;
const baseWPM = 180;
const adjustedWPM = baseWPM * parseFloat(rateSelect.value);
totalDuration = (words / adjustedWPM) * 60;

  startTime = Date.now();

  timer = setInterval(() => {
    if (!isPaused) {
      const elapsed = (Date.now() - startTime) / 1000;
      progress.value = (currentCharIndex / textContent.length) * 100;
      timeDisplay.innerText =
        formatTime(elapsed) + " / " + formatTime(totalDuration);
    }
  }, 500);
}

function resetPlayer() {
  clearInterval(timer);
  isPlaying = false;
  isPaused = false;
  currentCharIndex = 0;
  btn.innerText = "▶";
  progress.value = 0;
}

// Nút chính
btn.addEventListener("click", () => {

  if (!isPlaying) {
    speakFrom(currentCharIndex);
  }
  else if (!isPaused) {
    speechSynthesis.pause();
    isPaused = true;
    btn.innerText = "▶";
  }
  else {
    speechSynthesis.resume();
    isPaused = false;
    btn.innerText = "⏸";
  }

});

// Khi đổi tốc độ
rateSelect.addEventListener("change", () => {
  if (isPlaying) {
    speechSynthesis.cancel();
    speakFrom(currentCharIndex);
  }
});

// Khi đổi giọng
voiceSelect.addEventListener("change", () => {
  if (isPlaying) {
    speechSynthesis.cancel();
    speakFrom(currentCharIndex);
  }
});

// Kéo thanh tiến trình
progress.addEventListener("input", () => {
  if (!textContent) return;
  speechSynthesis.cancel();
  currentCharIndex = Math.floor(
    (progress.value / 100) * textContent.length
  );
  speakFrom(currentCharIndex);
});

</script>


<script>

function scrollToTop(){
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function updateSEO(post){

    if(!post) return;

    const cleanDesc =
        (post.description || '')
        .replace(/<[^>]+>/g,'')
        .substring(0,160);

    document.title = post.title;

    document.querySelector(
        'meta[name="description"]'
    )?.setAttribute("content", cleanDesc);

    document.querySelector(
        'meta[property="og:title"]'
    )?.setAttribute("content", post.title);

    document.querySelector(
        'meta[property="og:description"]'
    )?.setAttribute("content", cleanDesc);

}

</script>
