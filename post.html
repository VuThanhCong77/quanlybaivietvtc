<script>
let currentPost = null;

async function loadPost() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            document.getElementById('view-title').innerText = "Thiếu ID bài viết!";
            return;
        }

        const response = await fetch('posts_data.json');
        const data = await response.json();
        
        // Tìm bài viết
        const post = data.find(p => String(p.id) === String(postId));

        if (post) {
            currentPost = post; // Gán ngay lập tức
            document.title = post.title;
            document.getElementById('view-title').innerText = post.title;
            document.getElementById('view-date').innerText = post.date || "Không xác định";
            document.getElementById('view-author').innerText = post.author || "Admin";
            document.getElementById('view-content').innerHTML = post.description || "";

     syncViews(post);
    
            const imgElement = document.getElementById('view-image');
            if (post.thumbnail) {
                // Tự động chuyển link GitHub thành link Raw nếu cần
                let finalImg = post.thumbnail.replace('github.com', 'raw.githubusercontent.com').replace('/tree/', '/');
                imgElement.src = finalImg;
                imgElement.style.display = 'block';
            }
        } else {
            document.getElementById('post-container').innerHTML = `<h2 class="text-danger">Bài viết không tồn tại!</h2>`;
        }
    } catch (error) {
        console.error("Lỗi load bài viết:", error);
    }
}

function copyLink(btn){
    if (!currentPost) return;

    const link =
      "https://vuthanhcong77.github.io/quanlybaivietvtc/posts/" +
      currentPost.id +
      ".html";

    navigator.clipboard.writeText(link)
      .then(()=>{
        const oldText = btn.innerText;
        btn.classList.add("copied");
        btn.innerText = "✅ Đã sao chép link chia sẻ";

        setTimeout(()=>{
          btn.classList.remove("copied");
          btn.innerText = oldText;
        }, 1800);
      })
      .catch(()=>{
        alert("Không copy được liên kết!");
      });
}

function guiGopY() {
    const noiDung = document.getElementById("gy-noidung").value.trim();
    if (!noiDung) {
        alert("Vui lòng nhập nội dung!");
        return;
    }

    const data = {
        postId: currentPost?.id || "",
        tieuDe: currentPost?.title || document.title,
        ten: document.getElementById("gy-ten").value || "Ẩn danh",
        noiDung: noiDung,
        thoiGian: new Date().toLocaleString('vi-VN'),
        url: window.location.href
    };

    fetch("https://script.google.com/macros/s/AKfycbzb_ovIs2kZto3vuHVPATt1Iq0Uvb0GiQo3hvCm_FAcjRgfaTPyjTG0Qir4ECEkyOE8-g/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(() => {
        document.getElementById("gy-thongbao").innerText = "Gửi thành công!";
        document.getElementById("gy-noidung").value = "";
    })
    .catch(() => alert("Có lỗi xảy ra!"));
}

document.addEventListener('DOMContentLoaded', loadPost);


const VIEW_API = "https://script.google.com/macros/s/AKfycby6zKaFcyJbnhYq_aU9sUVjMMXspRKQXemdoltOzH-JzeOwC76XTzXAXznz2j_v85bA2A/exec";

function syncViews(post) {

  // 1️⃣ Tăng lượt xem
  fetch(VIEW_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      postId: String(post.id),
      title: post.title
    })
  });

  // 2️⃣ Lấy tổng lượt xem mới nhất
  fetch(VIEW_API + "?postId=" + post.id)
    .then(res => res.json())
    .then(data => {
      if (data && data.views !== undefined) {
        document.getElementById("view-count").innerText = data.views;
      }
    })
    .catch(err => console.error("Lỗi lấy lượt xem", err));
}

document.addEventListener("DOMContentLoaded", function () {

    const backToTopBtn = document.getElementById("backToTop");

    if (!backToTopBtn) return;

    window.addEventListener("scroll", function () {
        if (document.documentElement.scrollTop > 300 || document.body.scrollTop > 300) {
            backToTopBtn.style.display = "block";
        } else {
            backToTopBtn.style.display = "none";
        }
    });

    backToTopBtn.addEventListener("click", function () {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });

});
</script>
<button id="backToTop" title="Về đầu trang">

</button>
