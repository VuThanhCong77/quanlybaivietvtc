<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiện ích | Vũ Thành Công</title>

<style>
/* =====================================================
   VỊ TRÍ NÚT NỔI CHÍNH
   ===================================================== */
.vtc-floating-tools {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 9998;
    font-family: inherit;
}

.vtc-tools-main {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #0099DA, #006fa8);
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 111, 168, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.vtc-tools-main:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 25px rgba(0, 111, 168, 0.45);
}

/* =====================================================
   MENU 8 TIỆN ÍCH
   ===================================================== */
.vtc-tools-menu {
    position: absolute;
    right: 0;
    bottom: 68px;
    width: 230px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: rgba(255, 255, 255, .97);
    border: 1px solid rgba(0, 153, 218, .15);
    border-radius: 17px;
    box-shadow: 0 10px 35px rgba(0, 60, 100, .18);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px) scale(.92);
    transform-origin: bottom right;
    transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
}

.vtc-floating-tools.open .vtc-tools-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

/* =====================================================
   TỪNG TIỆN ÍCH
   ===================================================== */
.vtc-tool {
    min-width: 0;
    height: 67px;
    padding: 5px 2px;
    border: 0;
    border-radius: 11px;
    background: #f5fbfe;
    color: #24566b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: background .18s ease, transform .18s ease, color .18s ease;
}

.vtc-tool span {
    font-size: 21px;
    line-height: 1;
}

.vtc-tool small {
    font-size: 10px;
    line-height: 1.1;
    text-align: center;
    white-space: nowrap;
}

.vtc-tool:hover {
    background: #e2f5fc;
    color: #0075a8;
    transform: translateY(-2px);
}

.vtc-tool:focus-visible {
    outline: 3px solid rgba(0, 153, 218, .25);
    outline-offset: 2px;
}

/* =====================================================
   QR MODAL
   ===================================================== */
.vtc-qr-modal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, .45);
}

.vtc-qr-modal.active {
    display: flex;
}

.vtc-qr-box {
    position: relative;
    width: min(350px, 100%);
    padding: 25px;
    text-align: center;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 15px 50px rgba(0, 0, 0, .25);
}

.vtc-qr-box h3 {
    margin: 0 0 18px;
    color: #006fa8;
}

#vtcQrCode {
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#vtcQrCode img {
    width: 220px;
    height: 220px;
    max-width: 100%;
}

.vtc-qr-box p {
    margin: 12px 0;
    color: #666;
    font-size: 14px;
}

.vtc-qr-close {
    position: absolute;
    top: 7px;
    right: 12px;
    width: 32px;
    height: 32px;
    border: 0;
    background: transparent;
    color: #777;
    font-size: 27px;
    cursor: pointer;
}

.vtc-copy-url {
    padding: 9px 17px;
    border: 0;
    border-radius: 8px;
    background: #0099DA;
    color: white;
    cursor: pointer;
}

/* =====================================================
   ĐIỆN THOẠI
   ===================================================== */
@media (max-width: 600px) {
    .vtc-floating-tools {
        right: 15px;
        bottom: 15px;
    }

    .vtc-tools-main {
        width: 46px;
        height: 46px;
        font-size: 20px;
    }

    .vtc-tools-menu {
        right: 0;
        bottom: 58px;
        width: 210px;
        padding: 10px;
        gap: 7px;
        border-radius: 15px;
    }

    .vtc-tool {
        height: 62px;
    }

    .vtc-tool span {
        font-size: 20px;
    }

    .vtc-tool small {
        font-size: 9px;
    }
}
</style>
</head>
<body>

<!-- =====================================================
     BỘ TIỆN ÍCH NỔI VŨ THÀNH CÔNG
     ===================================================== -->
<div class="vtc-floating-tools">
    <!-- Nút chính -->
    <button
        class="vtc-tools-main"
        id="vtcToolsMain"
        type="button"
        aria-label="Mở tiện ích"
        aria-expanded="false"
        title="Tiện ích">
        🧰
    </button>
    
    <!-- 8 tiện ích -->
    <div class="vtc-tools-menu" id="vtcToolsMenu">
        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/lich-cong-tac.html"
           class="vtc-tool"
           title="Lịch công tác">
            <span>📅</span>
            <small>Lịch</small>
        </a>

        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/quan-tri/soan-bai-viet.html"
           class="vtc-tool"
           title="Soạn bài viết">
            <span>📝</span>
            <small>Soạn bài</small>
        </a>

        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/kho-tai-lieu/van-ban-pdf.html"
           class="vtc-tool"
           title="Tra cứu văn bản">
            <span>📚</span>
            <small>Tài liệu</small>
        </a>

        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/thanh-phan/QLVB-VTC1.1.html"
           class="vtc-tool"
           title="Quản lý hồ sơ">
            <span>🗂️</span>
            <small>Hồ sơ</small>
        </a>

        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/podcast/Podcast-bai-viet.html"
           class="vtc-tool"
           title="Nghe bài viết">
            <span>🎙️</span>
            <small>Bài viết</small>
        </a>
        
        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/KPI/ghi-chu.html"
           class="vtc-tool"
           title="Ghi chú">
            <span>📝</span>
            <small>Ghi chú</small>
        </a>      

        <button
            class="vtc-tool"
            type="button"
            data-vtc-action="qr">
            <span>📱</span>
            <small>QR Code</small>
        </button>

        <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/KPI/01VTC-KPI-3B-3-5B.html"
           class="vtc-tool"
           title="KPI">
            <span>🎯</span>
            <small>KPI</small>
        </a>
    </div>
</div>

<!-- Hộp QR -->
<div class="vtc-qr-modal" id="vtcQrModal" aria-hidden="true">
    <div class="vtc-qr-box">
        <button class="vtc-qr-close" type="button" aria-label="Đóng">×</button>
        <h3>📱 Mã QR</h3>
        <div id="vtcQrCode"></div>
        <p>Quét mã để mở trang này</p>
        <button class="vtc-copy-url" id="vtcCopyUrl" type="button">Sao chép liên kết</button>
    </div>
</div>
  
<script>
/* =====================================================
   LOGIC XỬ LÝ TƯƠNG TÁC TIỆN ÍCH
   ===================================================== */
document.addEventListener("DOMContentLoaded", function () {
    const box = document.querySelector(".vtc-floating-tools");
    const main = document.getElementById("vtcToolsMain");
    if (!box || !main) return;

    // Mở / Đóng menu
    main.addEventListener("click", function (event) {
        event.stopPropagation();
        const opened = box.classList.toggle("open");
        main.setAttribute("aria-expanded", opened ? "true" : "false");
    });

    // Click bên ngoài -> Đóng menu
    document.addEventListener("click", function (event) {
        if (!box.contains(event.target)) {
            box.classList.remove("open");
            main.setAttribute("aria-expanded", "false");
        }
    });

    // QR Code
    const qrButton = document.querySelector('[data-vtc-action="qr"]');
    if (qrButton) {
        qrButton.addEventListener("click", function () {
            vtcOpenQR();
        });
    }
});

function vtcOpenQR() {
    const modal = document.getElementById("vtcQrModal");
    const qr = document.getElementById("vtcQrCode");
    if (!modal || !qr) return;

    const url = window.location.href;
    qr.innerHTML = "";

    const img = document.createElement("img");
    img.src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(url);
    img.alt = "Mã QR của trang";
    qr.appendChild(img);

    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
}

document.addEventListener("click", function (event) {
    const modal = document.getElementById("vtcQrModal");
    if (!modal) return;

    if (event.target === modal || event.target.closest(".vtc-qr-close")) {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
    }
});

document.addEventListener("click", async function (event) {
    const button = event.target.closest("#vtcCopyUrl");
    if (!button) return;

    try {
        await navigator.clipboard.writeText(window.location.href);
        const oldText = button.textContent;
        button.textContent = "✓ Đã sao chép";
        setTimeout(function () {
            button.textContent = oldText;
        }, 1800);
    } catch (error) {
        alert("Không thể sao chép liên kết.");
    }
});
</script>

</body>
</html>
