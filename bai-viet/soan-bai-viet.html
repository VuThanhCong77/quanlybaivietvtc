<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Trình tạo bài viết</title>

<link rel="icon"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon32.ico">
<link rel="icon"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon192.ico">

<link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/main.css">


<style>

/* ===========================
   GIAO DIỆN CHUNG
=========================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:#f4f6f9;
    color:#333;
    max-width:1300px;
    margin:30px auto;
    padding:30px;
    line-height:1.6;
}

/* ===========================
   TIÊU ĐỀ
=========================== */

h1{
    text-align:center;
    margin-bottom:30px;
    color:#0d6efd;
    font-size:34px;
    font-weight:700;
}

/* ===========================
   KHUNG CHỨA
=========================== */

body{
    background:#eef2f7;
}

form,
.main-box{
    background:#fff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

/* ===========================
   LABEL
=========================== */

label{
    display:block;
    margin:18px 0 8px;
    font-size:15px;
    font-weight:600;
    color:#444;
}

/* ===========================
   INPUT - TEXTAREA - SELECT
=========================== */

input,
textarea,
select{

    width:100%;
    padding:12px 15px;

    border:1px solid #d0d7de;
    border-radius:8px;

    font-size:15px;

    transition:.25s;

    background:#fff;
}

input:focus,
textarea:focus,
select:focus{

    outline:none;

    border-color:#0d6efd;

    box-shadow:0 0 8px rgba(13,110,253,.25);
}

textarea{

    resize:vertical;
}

/* mô tả */

.short-text{

    min-height:80px;

    max-height:150px;
}

/* nội dung */

.long-text{

    min-height:650px;

    font-family:Consolas, monospace;

    font-size:15px;
}

/* ===========================
   BUTTON
=========================== */

button{

    background:#0d6efd;

    color:white;

    border:none;

    border-radius:8px;

    padding:12px 24px;

    margin-top:20px;

    margin-right:10px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

button:hover{

    background:#0b5ed7;

    transform:translateY(-2px);

    box-shadow:0 5px 15px rgba(13,110,253,.25);
}

button:active{

    transform:scale(.98);
}

/* ===========================
   Ô OUTPUT
=========================== */

#output{

    margin-top:30px;

    height:420px;

    background:#1e1e1e;

    color:#00ff66;

    border:none;

    border-radius:10px;

    padding:15px;

    font-family:Consolas, monospace;

    font-size:14px;

    white-space:pre;

    overflow:auto;
}

/* ===========================
   HÀNG NÚT
=========================== */

.button-group{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:20px;
}

/* ===========================
   RESPONSIVE
=========================== */

@media(max-width:768px){

    body{

        padding:15px;

        margin:10px;
    }

    h1{

        font-size:26px;
    }

    button{

        width:100%;

        margin-right:0;
    }

}

</style>

</head>
<body>

    src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/anh.jpg"

</div>

</textarea>

<div class="button-group">

<script>

let htmlContent="";

const BASE =
"https://vuthanhcong77.github.io/quanlybaivietvtc";

<!-- GOOGLE ARTICLE -->

function imageUrl(path){

        return path;
    }

    return "https://vuthanhcong77.github.io/quanlybaivietvtc/" +

function taoHTML(){

const folder =
document.getElementById("folder").value;

const folderName = {

"tong-hop":"Tổng hợp",

"kiem-tra":"Chuyên môn",

"van-ban":"Hồi ký"

const postId=
document.getElementById("postId").value;


const PAGE =
`${BASE}/bai-viet/${folder}/${postId}.html`;


const title=
document.getElementById("title").value;

const desc=
document.getElementById("desc").value;

const date=
document.getElementById("date").value;

const category=
document.getElementById("category").value;


const image=
document.getElementById("image").value;

const content=
document.getElementById("content").value;

htmlContent=`<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

${title} | Vũ Thành Công
</title>

<meta name="description"
content="${desc}">

<meta name="keywords"
content="${title}, ${category}, Vũ Thành Công, Hải Phòng, Lưu Kiếm">

<meta name="author"
content="Vũ Thành Công">

<meta name="robots"
content="index, follow, max-image-preview:large">

<meta name="theme-color"
content="#0a7f99">

<link rel="canonical"
href="${PAGE}">

<!-- FACEBOOK - ZALO -->

<meta property="og:locale"
content="vi_VN">

<meta property="og:type"
content="article">

<meta property="og:site_name"
content="Vũ Thành Công">

<meta property="og:title"
content="${title}">

<meta property="og:description"
content="${desc}">

<meta property="og:url"
content="${PAGE}">

<meta property="og:image"
content="${imageUrl(image)}">

<meta property="og:image:width"
content="1200">

<meta property="og:image:height"
content="630">

<meta property="og:image:alt"
content="${title}">

<meta property="article:author"
content="Vũ Thành Công">

<meta property="article:published_time"
content="${date}">

<meta property="article:section"
content="${category}">

<!-- TWITTER -->

<meta name="twitter:card"
content="summary_large_image">

<meta name="twitter:title"
content="${title}">

<meta name="twitter:description"
content="${desc}">

<meta name="twitter:image"
content="${imageUrl(image)}">

<script type="application/ld+json">
{
"@context":"https://schema.org",
"@type":"Article",
"headline":"${title}",
"description":"${desc}",
"image":"${imageUrl(image)}",
"datePublished":"${date}",
"dateModified":"${date}",
"author":{
"@type":"Person",
"name":"Vũ Thành Công"
},
"publisher":{
"@type":"Organization",
"name":"Vũ Thành Công",
"logo":{
"@type":"ImageObject",
"url":"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon192.png"
}
},
"mainEntityOfPage":{
"@id":"${PAGE}"
},
"inLanguage":"vi"
}
<\/script>

<!-- =========================
FONT + ICON + BOOTSTRAP
========================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link rel="manifest"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/manifest.json">


<link rel="icon"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon32.ico">

<link rel="icon"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon192.ico">

<link rel="stylesheet"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/main.css">

<body

<section class="tac-gia">

</main>

<button
id="nut-tro-ve"

</button>

<script src="${BASE}/tai-nguyen/js/menu.js"><\/script>

<script src="${BASE}/tai-nguyen/js/co-chu.js"><\/script>
<script src="${BASE}/tai-nguyen/js/xem-bai-viet.js"><\/script>
<script src="${BASE}/tai-nguyen/js/chia-se.js"><\/script>
<script src="${BASE}/tai-nguyen/js/gop-y.js"><\/script>
<script src="${BASE}/tai-nguyen/js/thich.js"><\/script>
<script src="${BASE}/tai-nguyen/js/bai-viet-lien-quan.js"><\/script>
<script src="${BASE}/tai-nguyen/js/main.js"><\/script>

<script type="module" src="${BASE}/firebase-config.js"><\/script>
<script type="module" src="${BASE}/notification.js"><\/script>

<script>
fetch("https://vuthanhcong77.github.io/quanlybaivietvtc/subscribe.html")
.then(r=>r.text())
.then(html=>{
    document.getElementById("subscribe-container").innerHTML = html;
});
<\/script>


<\/body>
<\/html>`;

document.getElementById("output").value=
htmlContent;

}

function taiFile(){

if(!htmlContent){
taoHTML();
}

const blob=
new Blob([htmlContent],
{type:"text/html"});

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
document.getElementById("postId").value
+ ".html";

a.click();

}

function taoJsonMetadata(){

const folder =
document.getElementById("folder").value;

const postId =
document.getElementById("postId").value;

const PAGE =
`${BASE}/bai-viet/${folder}/${postId}.html`;

const title =
document.getElementById("title").value;

const desc =
document.getElementById("desc").value;

const image =
document.getElementById("image").value;

const date =
document.getElementById("date").value;

const category =
document.getElementById("category").value;

return {
id: postId,

title: title,

desc: desc,

image: image,

url: PAGE,

date: date,

category: category.split(",").map(item => item.trim()),

featured: true,

views: 18
};

}

function taiJson(){

const data =
taoJsonMetadata();

const blob =
new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:
"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
document.getElementById("postId").value
+ ".json";

a.click();

}

async function xuatTatCa(){

taoHTML();

taiFile();

setTimeout(
taiJson,
500
);

}

function toSlug(text) {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
}

// Lấy input
const titleInput = document.getElementById('title');
const postIdInput = document.getElementById('postId');

// Tự động cập nhật khi gõ tiêu đề
titleInput.addEventListener('input', function () {
  postIdInput.value = toSlug(this.value);
});

</script>

<script>

async function loadComponent(id, file){

    try{

        const response = await fetch(file);

        if(!response.ok){

            throw new Error(
                "Lỗi tải component: " + file
            );

        }

        const html = await response.text();

        document.getElementById(id)
        .innerHTML = html;

    }catch(error){

        console.log(error);

    }

}

document.addEventListener(
"DOMContentLoaded",
()=>{

    loadComponent(
        "menu",
        "https://vuthanhcong77.github.io/quanlybaivietvtc/thanh-phan/menu.html"
    );

  }
);

</script>

<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/menu.js"></script>

</body>
