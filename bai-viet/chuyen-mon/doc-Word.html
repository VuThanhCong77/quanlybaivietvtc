<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đọc văn bản Word</title>

<style>
body{
    font-family: system-ui, -apple-system, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
    display:flex;
    justify-content:center;
}

.player{
    width:100%;
    max-width:1200px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    padding:18px;
}

.title{
    font-weight:600;
    font-size:16px;
    margin-bottom:10px;
}

#content{
    max-height:180px;
    overflow:auto;
    font-size:14px;
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    background:#fafafa;
}

.controls{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
}

.play-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    border:none;
    background:#0d6efd;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.select-group{
    display:flex;
    gap:8px;
    flex:1;
    justify-content:flex-end;
}

select{
    padding:6px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:13px;
}

.progress-container{
    margin-top:15px;
}

progress{
    width:100%;
    height:6px;
}

.time{
    font-size:12px;
    text-align:right;
    color:#666;
    margin-top:4px;
}

/* Mobile tối ưu */
@media(max-width:480px){
    .controls{
        flex-direction:column;
        align-items:stretch;
    }
    .select-group{
        justify-content:space-between;
    }
}
</style>

<link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/menu.css">

</head>
<body>


<div class="player">

    <div id="menu"></div>

   <div>Trình đọc văn bản Word</div>

    <input type="file" id="fileInput" accept=".docx">

    <div id="content">Tải file Word để hiển thị nội dung...</div>

    <div class="controls">
        <button class="play-btn" onclick="toggleSpeech()" id="playBtn">▶</button>

        <div class="select-group">
            <select id="voiceSelect"></select>
            <select id="rate">
                <option value="0.8">0.8x</option>
                <option value="1" selected>1x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
            </select>
        </div>
    </div>

    <div class="progress-container">
        <progress id="progressBar" value="0" max="100"></progress>
        <div class="time" id="timeDisplay">00:00</div>
    </div>
</div>


<script>
let totalDuration = 0;
let totalWords = 0;
let speech;
let isPaused = false;
let isSpeaking = false;
let progressInterval;
let startTime;

const fileInput = document.getElementById("fileInput");
const contentDiv = document.getElementById("content");
const voiceSelect = document.getElementById("voiceSelect");
const progressBar = document.getElementById("progressBar");
const timeDisplay = document.getElementById("timeDisplay");
const playBtn = document.getElementById("playBtn");

fileInput.addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(){
        mammoth.extractRawText({ arrayBuffer: reader.result })
        .then(result => {
            contentDiv.innerText = result.value;
        });
    };
    reader.readAsArrayBuffer(file);
});

function loadVoices(){
    const voices = speechSynthesis.getVoices()
        .filter(v => v.lang.toLowerCase().includes("vi"));

    voiceSelect.innerHTML = "";

    const femaleGroup = document.createElement("optgroup");
    femaleGroup.label = "Giọng Nữ";

    const maleGroup = document.createElement("optgroup");
    maleGroup.label = "Giọng Nam";

    voices.forEach(v => {
        const option = document.createElement("option");
        option.value = v.name;
        option.textContent = v.name;

        const nameLower = v.name.toLowerCase();

        if(nameLower.includes("female") ||
           nameLower.includes("woman") ||
           nameLower.includes("nữ")){
            femaleGroup.appendChild(option);
        }
        else if(nameLower.includes("male") ||
                nameLower.includes("man") ||
                nameLower.includes("nam")){
            maleGroup.appendChild(option);
        }
        else{
            // Nếu không xác định được → mặc định nhóm Nam
            maleGroup.appendChild(option);
        }
    });

    if(femaleGroup.children.length > 0)
        voiceSelect.appendChild(femaleGroup);

    if(maleGroup.children.length > 0)
        voiceSelect.appendChild(maleGroup);
}

speechSynthesis.onvoiceschanged = loadVoices;

if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
}
loadVoices();

function toggleSpeech(){
    const text = contentDiv.innerText.trim();
    if(!text) return alert("Chưa có nội dung.");

    if(isSpeaking){
        speechSynthesis.cancel();
        stopSpeech();
        return;
    }

    const rateValue = parseFloat(document.getElementById("rate").value);

// Tính tổng số từ
totalWords = text.split(/\s+/).length;

// tốc độ đọc trung bình ~180 từ/phút ở rate = 1
let wordsPerMinuteBase = 180;

// điều chỉnh theo rate
let adjustedWPM = wordsPerMinuteBase * rateValue;

// tính tổng thời gian (giây)
totalDuration = Math.ceil((totalWords / adjustedWPM) * 60);

// cập nhật max cho progress
progressBar.max = totalDuration;

    const selectedVoice = speechSynthesis.getVoices()
        .find(v => v.name === voiceSelect.value);

    const chunks = text.match(/.{1,200}(\s|$)/g); // chia đoạn 200 ký tự
    let index = 0;

    function speakChunk(){
        if(index >= chunks.length){
            stopSpeech();
            return;
        }

        speech = new SpeechSynthesisUtterance(chunks[index]);
        speech.lang = "vi-VN";
        speech.rate = rateValue;

        if(selectedVoice) speech.voice = selectedVoice;

        speech.onend = function(){
            index++;
            speakChunk();
        };

        speechSynthesis.speak(speech);
    }

    isSpeaking = true;
    playBtn.innerText = "⏹";
    startTime = Date.now();
    startProgress();

    speakChunk();
}

function stopSpeech(){
    clearInterval(progressInterval);
    speechSynthesis.cancel();
    progressBar.value = 0;
    timeDisplay.innerText = "00:00";
    isSpeaking = false;
    playBtn.innerText = "▶";
}

function startProgress(){
    progressInterval = setInterval(()=>{
        if(!isPaused){
            let elapsed = Math.floor((Date.now()-startTime)/1000);

            if(elapsed >= totalDuration){
                stopSpeech();
                return;
            }

            timeDisplay.innerText = 
                formatTime(elapsed) + " / " + formatTime(totalDuration);

            progressBar.value = elapsed;
        }
    },1000);
}

function formatTime(sec){
    let m = Math.floor(sec/60);
    let s = sec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
</script>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    
<script>

async function loadComponent(id, file){

    try{

        const response = await fetch(file);

        if(!response.ok){

            throw new Error(
                "Lỗi tải component: " + file
            );

        }

        const html = await response.text();

        document.getElementById(id)
        .innerHTML = html;

    }catch(error){

        console.log(error);

    }

}

document.addEventListener(
"DOMContentLoaded",
()=>{

    loadComponent(
        "menu",
        "https://vuthanhcong77.github.io/quanlybaivietvtc/thanh-phan/menu.html"
    );

  }
);

</script>

</body>
</html>
