<script>
async function loadComponent(id, file){

    try{

        const response = await fetch(file);

        if(!response.ok){

            throw new Error(
                "Lỗi tải component: " + file
            );

        }

        const html = await response.text();

        document.getElementById(id)
        .innerHTML = html;

    }catch(error){

        console.log(error);

    }

}

document.addEventListener(
"DOMContentLoaded",
()=>{

    loadComponent(
        "menu",
         "https://vuthanhcong77.github.io/quanlybaivietvtc/thanh-phan/menu.html"
    );

  }
);
</script>

<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/menu.js"></script>

<script>
        function getGoogleViewerUrl(url) {
            return 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
        }

        function viewPDF(fileUrl) {
            document.getElementById('pdf-frame').src = getGoogleViewerUrl(fileUrl);
        }

        // Tự động tải file đầu tiên có trong danh sách khi vừa mở trang
        window.onload = function() {
            const selectElement = document.getElementById('pdf-select') || document.getElementById('pdfSelect');
            if (selectElement && selectElement.value) {
                viewPDF(selectElement.value);
            }
        };
</script>
