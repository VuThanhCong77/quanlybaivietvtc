<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quy định số 21</title>

<meta property="og:image:alt"
content="Quy định số 21 về công tác kiểm tra, giám sát, thi hành kỷ luật của Đảng">

<meta name="keywords"
content="Sông Đá Bạc, Lưu Kiếm, Hải Phòng, Vũ Thành Công, câu chuyện cuộc đời, quê hương, tin tức, ký sự, hồi ký, truyền cảm hứng tích cực">
<meta name="author" content="Vũ Thành Công">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#0a7f99">

<link rel="canonical"
href="https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/chuyen-mon/qd-21.html">

<meta property="og:image" content="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/codang.png">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="../../tai-nguyen/css/menu.css">

<style>

/* ===== BASE ===== */
body{
  margin:0;
  font-family:'Times New Roman', serif;
  line-height:1.8;
  background:#e7e4e4;
}

header{
  max-width:900px;
  width: calc(100% - 20px); /* chừa mép 2 bên */
  margin: 10px auto 0 auto;
  position: sticky;
  top: 0;
  left: 0;
  right: 0;

  height: 60px;

  display: flex;
  align-items: center;

  background: #ffffff;
  box-shadow: 0 2px 10px rgba(0,0,0,.1);

  z-index: 99999;
}

/* ===== SEARCH ===== */
#search-container{
  display:flex;
  gap:8px;
  padding:10px;
  max-width:1200px;
  margin:auto;
}

#searchInput{
  flex:1;
  padding:10px;
  border:2px solid #1976d2;
  border-radius:8px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:#fff;
}

#searchBtn{background:#1976d2;}
#prevBtn{background:#1976d2;}
#nextBtn{background:#009688;}

/* ===== LAYOUT ===== */
.viewer-layout{
  display:flex;
  min-height:calc(100vh - 120px);
  background:#fff;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:300px;
  background:#f1f1f1;
  overflow-y:auto;
  border-right:1px solid #ddd;
}

.menu-item{
  padding:12px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}

.menu-item:hover{
  background:#e3f2fd;
}

.menu-item.active{
  background:#bbdefb;
  font-weight:bold;
}

/* ===== CONTENT ===== */
.content-view{
  flex:1;
  padding:30px;
}

.content-page{
  max-width:900px;
  margin:auto;
  font-size:18px;
  text-align:justify;
}

/* ===== HIGHLIGHT ===== */
mark{background:yellow;}
.current-match{background:orange;}

/* ===== FLOAT ===== */
#backToTop{
  position:fixed;
  right:20px;
  bottom:20px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#1976d2;
  color:#fff;
  border:none;
  display:none;
}

.floating-back{
  position:fixed;
  top:15px;
  right:15px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#1d4ed8;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
}

a{
  text-decoration:none; 
}

a:hover{
  color:#dc2626;
}

@media (max-width: 768px){

/* ===== HEADER FIX ===== */
header{
  height: 50px;
  font-size: 14px;
}

/* tránh che nội dung */
body{
  padding-top: 50px;
}

/* ===== SEARCH STACK ===== */
#search-container{
  flex-wrap: wrap;
  gap:6px;
}

#searchInput{
  width: 100%;
}

#searchBtn,
#prevBtn,
#nextBtn{
  flex: 1;
  font-size: 14px;
}

/* ===== LAYOUT CHUYỂN DỌC ===== */
.viewer-layout{
  flex-direction: column;
  height: auto;
}

/* ===== SIDEBAR MOBILE ===== */
.sidebar{
  width: 100%;
  max-height: 200px;
  overflow-y: auto;
  border-right: none;
  border-bottom: 1px solid #ddd;
}

/* menu item nhỏ lại */
.menu-item{
  font-size: 14px;
  padding: 10px;
}

/* ===== CONTENT MOBILE ===== */
.content-view{
  padding: 15px;
}

.content-page{
  font-size: 16px;
  line-height: 1.7;
}

/* ===== FLOAT BUTTON FIX ===== */
#backToTop{
  width: 40px;
  height: 40px;
  right: 15px;
  bottom: 15px;
}

.floating-back{
  width: 40px;
  height: 40px;
  top: 10px;
  right: 10px;
  font-size: 18px;
}

}

</style>
</head>

<body>

<header>
  
<!-- SEARCH -->
<div id="search-container">
<a href="../../index.html">🏠 21-QĐ/TW </a>

<input id="searchInput" placeholder="Tìm nội dung...">

<button id="searchBtn">Tìm</button>
<button id="prevBtn">⬆</button>
<button id="nextBtn">⬇</button>

<span id="resultBox"></span>

</div>

</header>

<!-- LAYOUT -->
<div class="viewer-layout">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- CONTENT -->
<div class="content-view">

<h2 id="page-title">Đang tải...</h2>

<div class="content-page" id="content">Đang tải...</div>

<div>
<button onclick="TTS.speak()">🔊</button>
<button onclick="TTS.pause()">⏸</button>
<button onclick="TTS.resume()">▶</button>
<button onclick="TTS.stop()">⏹</button>
</div>

</div>
</div>

<!-- BACK -->
<button id="backToTop">▲</button>
<button class="floating-back" onclick="history.back()">←</button>

<script>

/* =====================
STATE
===================== */
const App = {
  sections: [],
  current: 0,
  matches: [],
  matchIndex: 0
};

/* =====================
LOAD DATA
===================== */
async function loadData(){
  const res = await fetch("./qd21.json");
  const data = await res.json();

  App.sections = data.sections || data;

  renderSidebar();
  showSection(0);
}

/* =====================
SIDEBAR
===================== */
function renderSidebar(){
  const sidebar = document.getElementById("sidebar");

  sidebar.innerHTML = App.sections.map((s,i)=>`
    <div class="menu-item ${i===0?'active':''}"
         data-i="${i}">
      ${s.heading || s.title}
    </div>
  `).join("");

  sidebar.onclick = e=>{
    const item = e.target.closest(".menu-item");
    if(!item) return;
    showSection(+item.dataset.i);
  };
}

/* =====================
SHOW SECTION
===================== */
function showSection(i){
  App.current = i;

  const s = App.sections[i];

  document.getElementById("page-title").textContent =
    s.heading || s.title;

  document.getElementById("content").innerHTML =
    s.content || s.noidung || "";

  document.querySelectorAll(".menu-item")
    .forEach(el=>el.classList.remove("active"));

  document.querySelectorAll(".menu-item")[i]
    .classList.add("active");

  clearSearch();
}

/* =====================
SEARCH
===================== */
function escapeRegExp(t){
  return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function search(){
  const keyword = searchInput.value.trim();
  if(!keyword) return;

  const s = App.sections[App.current];
  const regex = new RegExp(escapeRegExp(keyword),"gi");

  const html = (s.content||s.noidung||"")
    .replace(regex,m=>`<mark>${m}</mark>`);

  document.getElementById("content").innerHTML = html;

  App.matches = document.querySelectorAll("mark");
  App.matchIndex = 0;

  updateMatch();
}

function updateMatch(){
  if(!App.matches.length) return;

  App.matches.forEach(m=>m.classList.remove("current-match"));

  const el = App.matches[App.matchIndex];
  el.classList.add("current-match");
  el.scrollIntoView({behavior:"smooth",block:"center"});

  resultBox.textContent =
    `${App.matchIndex+1}/${App.matches.length}`;
}

/* =====================
TTS
===================== */
const TTS = {
  speak(){
    const text = document.getElementById("content").innerText;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="vi-VN";
    speechSynthesis.speak(u);
  },
  pause(){speechSynthesis.pause();},
  resume(){speechSynthesis.resume();},
  stop(){speechSynthesis.cancel();}
};

/* =====================
EVENTS
===================== */
const searchInput = document.getElementById("searchInput");
const resultBox = document.getElementById("resultBox");

document.getElementById("searchBtn").onclick = search;

document.getElementById("nextBtn").onclick = ()=>{
  if(!App.matches.length) return;
  App.matchIndex = (App.matchIndex+1)%App.matches.length;
  updateMatch();
};

document.getElementById("prevBtn").onclick = ()=>{
  if(!App.matches.length) return;
  App.matchIndex =
    (App.matchIndex-1+App.matches.length)%App.matches.length;
  updateMatch();
};

searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});

/* =====================
UTIL
===================== */
function clearSearch(){
  App.matches=[];
  App.matchIndex=0;
  resultBox.textContent="";
}

/* =====================
INIT
===================== */
loadData();

</script>

</body>
</html>
