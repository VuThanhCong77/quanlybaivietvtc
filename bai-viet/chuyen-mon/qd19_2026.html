<script>
/* MENU */

document.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>t.parentElement.classList.toggle('open'))

/* BACK TO TOP */
const topBtn=document.getElementById('backToTop')
window.onscroll=()=>topBtn.style.display=window.scrollY>300?'block':'none'
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'})
</script>

<script>

const qd19_2026Title = document.getElementById("qd19_2026-title");
const qd19_2026Area  = document.getElementById("text-qd19_2026");

const searchInput = document.getElementById("search-input");
const searchBtn   = document.getElementById("search-button");
const prevBtn     = document.getElementById("prev-match");
const nextBtn     = document.getElementById("next-match");
const resultBox   = document.getElementById("search-results");
const countSpan   = document.getElementById("match-count");

let matches = [];
let currentIndex = -1;
let originalHTML = "";

/* ===== LOAD qd19_2026 ===== */
fetch("qd19_2026.json")
  .then(res => {
    if (!res.ok) throw new Error("Không tìm thấy qd19_2026.json");
    return res.json();
  })
  .then(data => {
    qd19_2026Title.innerHTML = data.title || "Văn bản";
    qd19_2026Area.innerHTML  = data.qd19_2026 || "Chưa có nội dung.";
    originalHTML = qd19_2026Area.innerHTML;
  })
  .catch(err => {
    qd19_2026Title.innerHTML = "Lỗi tải văn bản";
    qd19_2026Area.innerHTML  = "❌ Không tải được nội dung.";
    console.error(err);
  });
</script>

<script>
/* ===== SEARCH ===== */

function escapeReg(text){
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

searchBtn.onclick = () => {
  const keyword = searchInput.value.trim();
  if (!keyword || !originalHTML) return;

  const regex = new RegExp(`(${escapeReg(keyword)})`, "gi");
  qd19_2026Area.innerHTML = originalHTML.replace(regex, "<mark>$1</mark>");

  matches = qd19_2026Area.querySelectorAll("mark");
  currentIndex = -1;

  if (!matches.length) {
    alert("Không tìm thấy nội dung phù hợp");
    return;
  }

  prevBtn.disabled = false;
  nextBtn.disabled = false;
  resultBox.style.display = "block";
  goNext();
};

const fixedNav = document.getElementById("search-nav-fixed");

searchBtn.onclick = () => {
  const keyword = searchInput.value.trim();
  if (!keyword) return;

  if (!originalHTML) originalHTML = qd19_2026Area.innerHTML;

  const regex = new RegExp(`(${escapeReg(keyword)})`, "gi");
  qd19_2026Area.innerHTML = originalHTML.replace(regex, "<mark>$1</mark>");

  matches = qd19_2026Area.querySelectorAll("mark");
  currentIndex = -1;

  if (matches.length === 0) {
    fixedNav.style.display = "none";
    alert("Không tìm thấy nội dung phù hợp");
    return;
  }

  prevBtn.disabled = false;
  nextBtn.disabled = false;
  fixedNav.style.display = "flex";
  goNext();
};

/* ===== NAV RESULT ===== */
function updateMatch(){
  matches.forEach(m=>m.classList.remove("current-match"));

  const el = matches[currentIndex];

  el.classList.add("current-match");

  el.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  countSpan.innerText =
      `${currentIndex+1}/${matches.length}`;
}

function goNext(){
  currentIndex=(currentIndex+1)%matches.length;
  updateMatch();
}

function goPrev(){
  currentIndex=(currentIndex-1+matches.length)%matches.length;
  updateMatch();
}

nextBtn.onclick=goNext;
prevBtn.onclick=goPrev;

searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") searchBtn.click();
});
</script>

<script>
let utterance;

function startSpeak() {
  const text = document.getElementById("text-qd19_2026").innerText;

  speechSynthesis.cancel(); // tránh chồng giọng

  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "vi-VN";
  utterance.rate = 1;

  speechSynthesis.speak(utterance);
}

function pauseSpeak() {
  speechSynthesis.pause();
}

function resumeSpeak() {
  speechSynthesis.resume();
}

function stopSpeak() {
  speechSynthesis.cancel();
}
</script>

   <button id="next-match">↓</button>
