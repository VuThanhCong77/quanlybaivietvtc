<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Ảnh lên GitHub Pages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #24292e; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2da44e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        img#preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            display: none;
        }
    </style>

<link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/menu.css">
<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/goi-menu.js"></script>
<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/menu.js"></script>
    
</head>
<body>

    <header id="menu"></header>
    
    <h2>Upload Ảnh lên GitHub</h2>

    <div class="form-group">
        <label for="token">1. GitHub Personal Access Token (PAT):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <small style="color: #666;">Token cần có quyền <code>repo</code> hoặc <code>contents:write</code>.</small>
    </div>

    <div class="form-group">
        <label for="fileInput">2. Chọn ảnh cần tải lên:</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <img id="preview" alt="Xem trước">

    <div class="form-group" style="margin-top: 15px;">
        <button id="uploadBtn" onclick="uploadToGitHub()">Đẩy Ảnh Lên GitHub</button>
    </div>

    <div id="status"></div>

    <script>
        const OWNER = "vuthanhcong77";
        const REPO = "quanlybaivietvtc";
        const FOLDER_PATH = "tai-nguyen/anh-bai-viet"; // Đường dẫn thư mục lưu trữ

        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const statusDiv = document.getElementById('status');
        const uploadBtn = document.getElementById('uploadBtn');

        // Xem trước ảnh khi chọn
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        async function uploadToGitHub() {
            const token = document.getElementById('token').value.trim();
            const file = fileInput.files[0];

            if (!token) {
                showStatus("Vui lòng nhập GitHub Token!", "error");
                return;
            }
            if (!file) {
                showStatus("Vui lòng chọn 1 file ảnh!", "error");
                return;
            }

            // Tự động lấy tên file gốc + đuôi gốc
            const filePath = `${FOLDER_PATH}/${file.name}`;

            showStatus("Đang xử lý và tải ảnh lên...", "info");
            uploadBtn.disabled = true;

            try {
                // 1. Chuyển đổi file nguyên bản sang dạng Base64
                const base64Content = await convertFileToBase64(file);
                
                // 2. Kiểm tra xem file đã tồn tại trên GitHub chưa
                const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}`;
                let sha = null;

                const checkResponse = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (checkResponse.ok) {
                    const existingData = await checkResponse.json();
                    sha = existingData.sha; // Lấy SHA để ghi đè file cùng tên nếu có
                }

                // 3. Gửi Yêu cầu Push/Upload file lên GitHub
                const bodyData = {
                    message: `Upload ảnh bài viết: ${file.name}`,
                    content: base64Content,
                    branch: "main"
                };

                if (sha) {
                    bodyData.sha = sha;
                }

                const uploadResponse = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (uploadResponse.ok) {
                    const finalUrl = `https://${OWNER}.github.io/${REPO}/${filePath}?v=${new Date().getTime()}`;
                    showStatus(`✅ Tải ảnh lên thành công!<br>File: <b>${file.name}</b><br>Đường dẫn: <a href="${finalUrl}" target="_blank">${finalUrl}</a><br><i>(Lưu ý: GitHub Pages có thể mất 1-2 phút để cập nhật)</i>`, "success");
                } else {
                    const errorData = await uploadResponse.json();
                    showStatus(`❌ Lỗi (${uploadResponse.status}): ${errorData.message}`, "error");
                }

            } catch (err) {
                showStatus(`❌ Lỗi kết nối: ${err.message}`, "error");
            } finally {
                uploadBtn.disabled = false;
            }
        }

        // Hàm đọc file nguyên bản và chuyển sang Base64
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Tách bỏ phần header Data URL (VD: "data:image/png;base64,") chỉ lấy phần Base64 thuần
                    const base64String = e.target.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showStatus(text, type) {
            statusDiv.innerHTML = text;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
