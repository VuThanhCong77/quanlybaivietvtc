<style>
body{
    margin:0;

.container{
    max-width:1200px;
    margin:0 auto;
    background:#fff;

}

/* HEADER */
.header{
    background:#3e6fe0;
    color:#fff;
    padding:15px;
    font-size:20px;
    text-align:center;
}

/* TOOLBAR */
.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:10px;
    background:#fff;
}

.toolbar input, .toolbar select{
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
}

.toolbar button{
    padding:8px 12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    cursor:pointer;
    position:relative;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.info{
    padding:8px;
    font-size:13px;
}

.badge{
    position:absolute;
    top:8px;
    left:8px;
    background:gold;
    color:black;
    padding:3px 6px;
    font-size:11px;
    border-radius:5px;
}

.views{
    font-size:12px;
    color:#555;
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.lightbox img{
    max-width:90%;
    max-height:80%;
}

.close{
    position:absolute;
    top:20px;
    right:25px;
    font-size:30px;
    color:#fff;
    cursor:pointer;
}

@media (max-width: 768px){

    /* KHUNG FULL MOBILE */
    .container{
        margin:0;
        border-radius:0;
        box-shadow:none;
    }

    /* TOOLBAR CHUYỂN DẠNG CỘT */
    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button{
        width:100%;
        font-size:14px;
    }

    /* GRID 2 CỘT TRÊN MOBILE */
    .grid{
        grid-template-columns:repeat(2, 1fr);
        gap:8px;
        padding:10px;
    }

    /* CARD NHỎ HƠN */
    .card img{
        height:120px;
    }

    .info{
        font-size:12px;
    }

    /* LIGHTBOX */
    .lightbox img{
        max-width:95%;
        max-height:70%;
    }
}

.lightbox{
    cursor: zoom-out;
}

.nav{
    position:absolute;
    top:50%;

<body>

<div class="container">

<div class="header" >
    <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/index.html">🏠</a>
    | 📷 Thư viện ảnh
</div>

<!-- TOOLBAR -->
<div class="toolbar">
    <input id="imgUrl" placeholder="URL ảnh...">
    <input id="imgTitle" placeholder="Tiêu đề ảnh">
    
    <select id="imgCat">
        <option>Tin tức</option>
        <option>Chính trị</option>
        <option>Gia đình</option>
        <option>Du lịch</option>
        <option>Kỷ niệm</option>
        <option>Hạnh phúc</option>
        <option>Kinh tế</option>
        <option>Văn hóa</option>
    </select>

    <button onclick="addImage()">➕ Thêm</button>

    <input id="search" placeholder="Tìm ảnh..." oninput="render()">

   <button onclick="exportJSON()">Xuất JSON</button>

   <button class="share-btn copy" onclick="copyLink()">
        🔗 Sao chép
    </button>

</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

    <div class="close" onclick="closeLB()">×</div>

    <div class="nav prev" onclick="prevImg()">❮</div>

    <img id="lbImg">

    <div class="nav next" onclick="nextImg()">❯</div>

    <div class="counter" id="counter"></div>

    <button class="share-btn copy" onclick="copyLink()">
        🔗 Sao chép
    </button>

    <div class="share-bar">

</div>

</div>

<script>
const API_URL = "https://vuthanhcong77.github.io/quanlybaivietvtc/du-lieu/thu-vien-anh.json";

let images = [];
let currentIndex = 0;

/* LOAD DỮ LIỆU */
async function loadImages(){
    try{
        const res = await fetch(API_URL);
        images = await res.json();

        // nếu file rỗng thì dùng mặc định
        if(!Array.isArray(images) || images.length === 0){
            images = [
                {id:1,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/1.png",title:"Phong cảnh",cat:"Du lịch",featured:true,views:0},
                {id:2,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/ytuonghay.jpg",title:"Thiên nhiên",cat:"Gia đình",featured:false,views:0}
            ];
        }

        render();

    }catch(e){
        console.log("Lỗi load JSON:", e);

        images = [
            {id:1,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/1.png",title:"Phong cảnh",cat:"Du lịch",featured:true,views:0}
        ];

        render();
    }
}

/* THÊM ẢNH */
function addImage(){
    const url = document.getElementById("imgUrl").value;
    const title = document.getElementById("imgTitle").value;
    const cat = document.getElementById("imgCat").value;

    if(!url) return alert("Nhập URL ảnh");

    images.unshift({
        id: Date.now(),
        url,
        title,
        cat,
        featured:false,
        views:0
    });

    render();
}

/* RENDER */
function render(){
    const q = document.getElementById("search").value.toLowerCase();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    images
    .map((img, index) => ({...img, index}))
    .filter(i =>
        (i.title || "").toLowerCase().includes(q) ||
        (i.cat || "").toLowerCase().includes(q)
    )
    .forEach(img => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            ${img.featured ? '<div class="badge">Nổi bật</div>' : ""}
            <img src="${img.url}">
            <div class="info">
                <b>${img.title}</b><br>
                <span>${img.cat}</span><br>
                <div class="views">👁 ${img.views} lượt xem</div>
            </div>
        `;

        card.onclick = () => openImg(img.index);

        grid.appendChild(card);
    });
}

/* LIGHTBOX */
function openImg(i){

    currentIndex = i;

    showCurrentImage();

}

function showCurrentImage(){

    if(!images[currentIndex]) return;

    images[currentIndex].views++;

    document.getElementById("lbImg").src =
        images[currentIndex].url;

    document.getElementById("counter").innerHTML =
        (currentIndex + 1) + " / " + images.length;

    document.getElementById("lightbox").style.display = "flex";

    render();
}

function nextImg(){

    currentIndex++;

    if(currentIndex >= images.length){
        currentIndex = 0;
    }

    showCurrentImage();
}

function prevImg(){

    currentIndex--;

    if(currentIndex < 0){
        currentIndex = images.length - 1;
    }

    showCurrentImage();
}

function closeLB(){
    document.getElementById("lightbox").style.display = "none";
}

/* START */
loadImages();

/* CLICK OUTSIDE CLOSE */
document.getElementById("lightbox").addEventListener("click", function(e){
    if(e.target.id === "lightbox"){
        closeLB();
    }
});

/* XUAT JSON */

function exportJSON(){
    const dataStr = JSON.stringify(images, null, 2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "thu-vien-anh.json";
    a.click();

    URL.revokeObjectURL(url);
}

document.addEventListener("keydown", function(e){

    const lb =
        document.getElementById("lightbox");

    if(lb.style.display !== "flex") return;

    if(e.key === "ArrowRight"){
        nextImg();
    }

    if(e.key === "ArrowLeft"){
        prevImg();
    }

    if(e.key === "Escape"){
        closeLB();
    }

});

let startX = 0;

document.getElementById("lightbox")
.addEventListener("touchstart", e => {

    startX = e.touches[0].clientX;

});

document.getElementById("lightbox")
.addEventListener("touchend", e => {

    let endX = e.changedTouches[0].clientX;

    let diff = startX - endX;

    if(Math.abs(diff) < 50) return;

    if(diff > 0){
        nextImg();
    }else{
        prevImg();
    }

});

async function copyLink() {

    const pageUrl = "https://vuthanhcong77.github.io/quanlybaivietvtc/thu-vien-anh.html";

    try {

        await navigator.clipboard.writeText(pageUrl);

        alert("Đã sao chép liên kết Thư viện ảnh.");

    } catch {

        prompt("Sao chép liên kết:", pageUrl);

    }

}

async function copyLink() {

    const pageUrl = window.location.origin + window.location.pathname;

    try {

        await navigator.clipboard.writeText(pageUrl);

        alert("Đã sao chép liên kết Thư viện ảnh.");

    } catch {

        prompt("Sao chép liên kết:", pageUrl);

    }

}

// Sao chép liên kết toàn bộ thư viện
function copyGalleryLink() {
    return "https://vuthanhcong77.github.io/quanlybaivietvtc/thu-vien-anh.html";
}

// Sao chép liên kết ảnh đang xem
function copyImageLink() {
    return window.location.origin +
           window.location.pathname +
           "?id=" + images[currentIndex].id;
}
</script>
