<style>

*,
*::before,
*::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
    background: #e5e7eb;
    line-height: 1.5;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 58px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #2563eb, #3e6fe0);
    color: #fff;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 700;
}

.header a {
    color: #fff;
    text-decoration: none;
    transition: transform .2s ease;
}

.header a:hover,
.header a:focus-visible {
    transform: scale(1.15);
}


.container{
    max-width:1200px;
    margin:0 auto;
    background:#fff;
    min-height:100vh;
    box-shadow:0 0 10px rgba(0,0,0,0.05);
}

/* TOOLBAR */
.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 15px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
}

.toolbar input,
.toolbar select {
    min-height: 40px;
    padding: 9px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: #fff;
    color: #1f2937;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}

.toolbar input {
    flex: 1 1 190px;
}

.toolbar select {
    flex: 0 1 150px;
}

.toolbar input:focus,
.toolbar select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
}

.toolbar button,
.share-btn {
    min-height: 40px;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
}

.toolbar button {
    background: #2563eb;
}

.toolbar button:hover,
.share-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
}

.toolbar button:active,
.share-btn:active {
    transform: translateY(0);
}

.toolbar button:focus-visible,
.share-btn:focus-visible,
.close:focus-visible,
.nav:focus-visible {
    outline: 3px solid #facc15;
    outline-offset: 3px;
}


/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
    padding:15px;
}

.card {
    position: relative;
    overflow: hidden;
    background: #fff;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
    transition: transform .25s ease, box-shadow .25s ease;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .16);
}

.card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    height: auto;
    object-fit: cover;
    background: #e5e7eb;
    transition: transform .3s ease;
}

.card:hover img {
    transform: scale(1.04);
}

.info {
    min-height: 84px;
    padding: 10px;
    font-size: 13px;
}

.info b {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-height: 1.35;
}

.badge {
    position: absolute;
    z-index: 2;
    top: 8px;
    left: 8px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #facc15;
    color: #422006;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
}

.views{
    font-size:12px;
    color:#555;
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    z-index: 9999;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
    background: rgba(0, 0, 0, .9);
    cursor: zoom-out;
}

.close {
    position: absolute;
    z-index: 1001;
    top: 14px;
    right: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    color: #fff;
    font-size: 34px;
    line-height: 38px;
    text-align: center;
    cursor: pointer;
    transition: background .2s, transform .2s;
}

.close:hover {
    background: rgba(255, 255, 255, .15);
    transform: rotate(90deg);
}

@media (max-width: 768px) {

    .container {
        margin: 0;
        border-radius: 0;
        box-shadow: none;
    }

    /* TOOLBAR GỌN HƠN TRÊN ĐIỆN THOẠI */
    .toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
        background: #f8fafc;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button {
        width: 100%;
        min-width: 0;
        min-height: 38px;
        padding: 8px 10px;
        font-size: 13px;
    }

    /* URL và tiêu đề chiếm toàn bộ hàng */
    #imgUrl,
    #imgTitle,
    #search {
        grid-column: 1 / -1;
    }

    /* Danh mục và nút thêm nằm cùng một hàng */
    #imgCat {
        grid-column: 1;
    }

    .toolbar button[noscript="addImage()"] {
        grid-column: 2;
    }

    /* Nút xuất JSON và sao chép chia đôi chiều ngang */
    .toolbar button[noscript="exportJSON"],
    .toolbar .copy {
        grid-column: span 1;
    }

    /* GRID ẢNH */
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
    }

    .card img {
        height: 320px;
    }

    .info {
        padding: 8px;
        font-size: 12px;
    }

    /* LIGHTBOX */
    .lightbox img {
        max-width: 95%;
        max-height: 70%;
    }

    .nav {
        font-size: 38px;
    }

    .counter {
        bottom: 10px;
        font-size: 13px;
    }

    .share-bar {
        width: 95%;
    }

    .share-btn {
        flex: 1;
        font-size: 13px;
        padding: 10px;
    }
}


@media (max-width: 380px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

.lightbox{
    cursor: zoom-out;
}

.nav {
    position: absolute;
    z-index: 1000;
    top: 50%;
    width: 48px;
    height: 60px;
    padding: 0;
    border-radius: 8px;
    color: #fff;
    font-size: 42px;
    line-height: 56px;
    text-align: center;
    user-select: none;
    cursor: pointer;
    transform: translateY(-50%);
    transition: background .2s;
}

.nav:hover {
    background: rgba(255, 255, 255, .15);
}

.prev {
    left: 12px;
}

.next {
    right: 12px;
}

.counter{
    position:absolute;
    bottom:20px;
    color:white;
    font-size:15px;
    background:rgba(0,0,0,.5);
    padding:6px 12px;
    border-radius:20px;
}

.lightbox img {
    display: block;
    max-width: min(90vw, 1200px);
    max-height: 85vh;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
}


@media(max-width:768px){

    .nav{
        font-size:38px;
    }

    .counter{
        bottom:10px;
        font-size:13px;
    }

}

.share-bar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.share-btn{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    transition:.25s;
}

.share-btn:hover{
    transform:translateY(-2px);
}

.copy{
    background:#555;
}

@media(max-width:768px){

.share-bar{
    width:95%;
}

.share-btn{
    flex:1;
    font-size:13px;
    padding:10px;
}

}

@media (prefers-color-scheme: dark) {
    body {
        background: #111827;
    }

    .container {
        background: #1f2937;
    }

    .toolbar {
        background: #111827;
        border-color: #374151;
    }

    .toolbar input,
    .toolbar select {
        background: #1f2937;
        border-color: #4b5563;
        color: #f9fafb;
    }

    .card {
        background: #1f2937;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    .info {
        color: #f9fafb;
    }

    .views {
        color: #cbd5e1;
    }
}

<body>

<div class="container">

<div class="header" >
    <a href="https://vuthanhcong77.github.io/quanlybaivietvtc/index.html">📷</a>
    | Thư viện ảnh
</div>

<!-- TOOLBAR -->
<div class="toolbar">
    <input id="imgUrl" placeholder="URL ảnh...">
    <input id="imgTitle" placeholder="Tiêu đề ảnh">
    
    <select id="imgCat">
        <option>Tin tức</option>
        <option>Chính trị</option>
        <option>Gia đình</option>
        <option>Du lịch</option>
        <option>Kỷ niệm</option>
        <option>Hạnh phúc</option>
        <option>Kinh tế</option>
        <option>Văn hóa</option>
    </select>

    <button onclick="addImage()">➕ Thêm</button>

    <input id="search" placeholder="Tìm ảnh..." oninput="render()">

   <button onclick="exportJSON()">Xuất JSON</button>

   <button class="share-btn copy" onclick="copyLink()">
        🔗 Sao chép
    </button>

</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

    <div class="close" onclick="closeLB()">×</div>

    <div class="nav prev" onclick="prevImg()">❮</div>

    <img id="lbImg">

    <div class="nav next" onclick="nextImg()">❯</div>

    <div class="counter" id="counter"></div>

<div class="share-bar">
   <button class="share-btn copy" onclick="copyLink()">
        🔗 Sao chép
    </button>
</div>

</div>

<script>
const API_URL = "https://vuthanhcong77.github.io/quanlybaivietvtc/du-lieu/thu-vien-anh.json";

let images = [];
let currentIndex = 0;

/* LOAD DỮ LIỆU */
async function loadImages(){
    try{
        const res = await fetch(API_URL);
        images = await res.json();

        // nếu file rỗng thì dùng mặc định
        if(!Array.isArray(images) || images.length === 0){
            images = [
                {id:1,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/1.png",title:"Phong cảnh",cat:"Du lịch",featured:true,views:0},
                {id:2,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/ytuonghay.jpg",title:"Thiên nhiên",cat:"Gia đình",featured:false,views:0}
            ];
        }

        render();

    }catch(e){
        console.log("Lỗi load JSON:", e);

        images = [
            {id:1,url:"https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/anh-bai-viet/1.png",title:"Phong cảnh",cat:"Du lịch",featured:true,views:0}
        ];

        render();
    }
}

/* THÊM ẢNH */
function addImage(){
    const url = document.getElementById("imgUrl").value;
    const title = document.getElementById("imgTitle").value;
    const cat = document.getElementById("imgCat").value;

    if(!url) return alert("Nhập URL ảnh");

    images.unshift({
        id: Date.now(),
        url,
        title,
        cat,
        featured:false,
        views:0
    });

    render();
}

/* RENDER */
function render(){
    const q = document.getElementById("search").value.toLowerCase();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    images
    .map((img, index) => ({...img, index}))
    .filter(i =>
        (i.title || "").toLowerCase().includes(q) ||
        (i.cat || "").toLowerCase().includes(q)
    )
    .forEach(img => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            ${img.featured ? '<div class="badge">Nổi bật</div>' : ""}
            <img src="${img.url}" alt="${img.title || "Ảnh trong thư viện"}" loading="lazy">
            <div class="info">
                <b>${img.title}</b><br>
                <span>${img.cat}</span><br>
                <div class="views">👁 ${img.views} lượt xem</div>
            </div>
        `;

        card.onclick = () => openImg(img.index);

        grid.appendChild(card);
    });
}

/* LIGHTBOX */
function openImg(i){

    currentIndex = i;

    showCurrentImage();

}

function showCurrentImage(){

    if(!images[currentIndex]) return;

    images[currentIndex].views++;

    document.getElementById("lbImg").src =
        images[currentIndex].url;

    document.getElementById("counter").innerHTML =
        (currentIndex + 1) + " / " + images.length;

    document.getElementById("lightbox").style.display = "flex";

    render();
}

function nextImg(){

    currentIndex++;

    if(currentIndex >= images.length){
        currentIndex = 0;
    }

    showCurrentImage();
}

function prevImg(){

    currentIndex--;

    if(currentIndex < 0){
        currentIndex = images.length - 1;
    }

    showCurrentImage();
}

function closeLB(){
    document.getElementById("lightbox").style.display = "none";
}

/* START */
loadImages();

/* CLICK OUTSIDE CLOSE */
document.getElementById("lightbox").addEventListener("click", function(e){
    if(e.target.id === "lightbox"){
        closeLB();
    }
});

/* XUAT JSON */

function exportJSON(){
    const dataStr = JSON.stringify(images, null, 2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "thu-vien-anh.json";
    a.click();

    URL.revokeObjectURL(url);
}

document.addEventListener("keydown", function(e){

    const lb =
        document.getElementById("lightbox");

    if(lb.style.display !== "flex") return;

    if(e.key === "ArrowRight"){
        nextImg();
    }

    if(e.key === "ArrowLeft"){
        prevImg();
    }

    if(e.key === "Escape"){
        closeLB();
    }

});

let startX = 0;

document.getElementById("lightbox")
.addEventListener("touchstart", e => {

    startX = e.touches[0].clientX;

});

document.getElementById("lightbox")
.addEventListener("touchend", e => {

    let endX = e.changedTouches[0].clientX;

    let diff = startX - endX;

    if(Math.abs(diff) < 50) return;

    if(diff > 0){
        nextImg();
    }else{
        prevImg();
    }

});

async function copyLink() {

    const url = window.location.href;

    try{
        await navigator.clipboard.writeText(url);
        alert("Đã sao chép liên kết.");
    }catch(e){
        prompt("Sao chép liên kết:", url);
    }

}

</script>
