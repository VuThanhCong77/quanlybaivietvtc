<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem PDF Đa Thiết Bị</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: 1px solid #007bff; background: #fff; color: #007bff; border-radius: 5px; cursor: pointer; }
        button.active { background: #007bff; color: #fff; }
        iframe { width: 100%; height: 70vh; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

    <h3>Danh Sách Văn Bản</h3>
    
    <div class="btn-group">
        <button class="active" onclick="viewPDF('https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/chuyen-mon/pdf/qd-89-2022.pdf', this)">Văn bản 1</button>
        <button onclick="viewPDF('https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/chuyen-mon/pdf/hd-quy-trinh-ktgs2026.pdf', this)">Văn bản 2</button>
    </div>

    <iframe id="pdf-frame" src=""></iframe>

    <script>
        // Đường dẫn file PDF ban đầu
        const defaultPDF = 'https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/chuyen-mon/pdf/hd-quy-trinh-ktgs2026.pdf';

        function getGoogleViewerUrl(url) {
            return 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
        }

        function viewPDF(fileUrl, btn) {
            document.getElementById('pdf-frame').src = getGoogleViewerUrl(fileUrl);
            
            if (btn) {
                document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        // Tải file đầu tiên khi vào trang
        viewPDF(defaultPDF);
    </script>

</body>
</html>
