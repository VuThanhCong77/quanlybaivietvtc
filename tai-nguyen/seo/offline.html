<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Không có kết nối</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#222;
}

.offline-box{

    width:100%;
    max-width:420px;

    background:#ffffff;

    border-radius:24px;

    padding:40px 28px;

    text-align:center;

    box-shadow:
    0 10px 35px rgba(0,0,0,.15);
}

.logo{

    width:90px;
    height:90px;

    border-radius:50%;

    object-fit:cover;

    margin-bottom:18px;

    border:4px solid #0a7f99;
}

.icon{

    font-size:58px;

    color:#0a7f99;

    margin-bottom:18px;
}

h1{
    font-size:28px;
    margin-bottom:14px;
}

p{
    font-size:16px;
    line-height:1.7;
    color:#555;
}

.quote{
    margin-top:20px;

    font-style:italic;

    color:#0a7f99;
}

.retry-btn{

    margin-top:28px;

    border:none;

    background:
    linear-gradient(
        135deg,
        #0a7f99,
        #0ab3c9
    );

    color:#fff;

    padding:14px 28px;

    border-radius:50px;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.retry-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px rgba(0,0,0,.18);
}

.status{
    margin-top:16px;
    font-size:14px;
    color:#777;
}

</style>
</head>

<body>

<div class="offline-box">

    <img
        src="/tai-nguyen/icons/CK.png"
        alt="Logo"
        class="logo"
    >

    <div class="icon">
        <i class="fas fa-wifi"></i>
    </div>

    <h1>Mất kết nối mạng</h1>

    <p>
        Không thể tải nội dung lúc này.
        Vui lòng kiểm tra internet
        và thử lại sau.
    </p>

    <div class="quote">
        “Lan tỏa tri thức và năng lượng sống tích cực mỗi ngày.”
    </div>

    <button
        class="retry-btn"
        onclick="window.location.reload()">

        <i class="fas fa-rotate-right"></i>
        Thử lại

    </button>

    <div class="status" id="networkStatus">
        Đang kiểm tra kết nối...
    </div>

</div>

<script>

function updateNetworkStatus(){

    const status =
        document.getElementById("networkStatus");

    if(navigator.onLine){

        status.innerHTML =
            "🟢 Đã có kết nối mạng";

    }else{

        status.innerHTML =
            "🔴 Hiện đang offline";

    }

}

window.addEventListener(
    "online",
    updateNetworkStatus
);

window.addEventListener(
    "offline",
    updateNetworkStatus
);

updateNetworkStatus();

</script>

</body>
</html>
