<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 Tài liệu | Vũ Thành Công</title>

<!-- CSS LAYOUT DÙNG CHUNG -->
<link rel="stylesheet" href="layout.css">

<style>
/* ==================================================
   CSS RIÊNG CHO TRANG TÀI LIỆU
   ================================================== */

/* ===== MENU MOBILE ===== */
.menu-overlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  visibility: hidden;
  z-index: 998;
  transition: .3s;
}
.menu-overlay.active{
  opacity: 1;
  visibility: visible;
}

.nav-menu{
  position: fixed;
  top: 0;
  left: -280px;
  width: 260px;
  height: 100%;
  background: #fff;
  box-shadow: 2px 0 10px rgba(0,0,0,.15);
  padding-top: 60px;
  z-index: 999;
  transition: .3s;
}
.nav-menu.active{ left: 0; }

.nav-item{ border-bottom: 1px solid #eee; }
.nav-link{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  color: #0a3a5a;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

.sub-menu{
  display: none;
  background: #f5f9fb;
}
.sub-menu a{
  display: block;
  padding: 10px 30px;
  font-size: 14px;
  color: #0a5c7a;
  text-decoration: none;
}
.nav-item.open > .sub-menu{ display: block; }

/* ===== CONTROL PANEL ===== */
.control-panel{
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
  padding-bottom: 10px;
  border-bottom: 1px solid #cde7ef;
}

#search-input{
  padding: 8px 12px;
  border: 1px solid #0ab3c9;
  border-radius: 5px;
  font-size: 14px;
  width: 250px;
}

#stats-box{
  background: #0ab3c9;
  color: #fff;
  padding: 8px 12px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 14px;
}

/* ===== DANH SÁCH TÀI LIỆU ===== */
.file-item{
  border-bottom: 1px solid #cde7ef;
  padding: 15px 0;
  display: flex;
  justify-content: space-between;
  gap: 15px;
}
.file-info h3{
  margin: 0;
  font-size: 18px;
}
.file-info h3 a{
  color: #0a3a5a;
  text-decoration: none;
}
.file-info p{
  margin-top: 6px;
  font-size: 14px;
  color: #08405d;
}
.download-btn{
  padding: 8px 16px;
  background: #0a7f99;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
}
.download-btn:hover{ background: #0a99aa; }

/* MOBILE */
@media (max-width: 768px){
  .post-list{ grid-template-columns: 1fr; }
  .control-panel{
    flex-direction: column;
    align-items: stretch;
  }
  #search-input{ width: 100%; }
  .file-item{ flex-direction: column; }
}
</style>
</head>

<body>

<div class="page-wrapper">

  <!-- HEADER -->
  <header class="page-header">
    <button class="menu-btn" id="menuBtn">☰</button>
    
<h1 class="page-title tailieu">
<a href="tailieu.html">Tài liệu </a>
</h1>

    <a href="index.html">🏠</a>
  </header>

  <!-- MENU -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="nav-menu" id="navMenu">
    <div class="nav-item"><a class="nav-link" href="index.html">🏠 Trang chủ</a></div>
    <div class="nav-item"><a class="nav-link" href="gioithieu.html">🏛 Giới thiệu</a></div>

    <div class="nav-item">
      <div class="nav-link toggle">📄 Văn bản <span>▾</span></div>
      <div class="sub-menu">
        <a href="vanban.html">📖 Nội dung văn bản</a>
        <a href="vanban/qd69.html">📜 Quy định 69</a>
        <a href="vanban/dieuledang.html">📕 Điều lệ Đảng</a>
      </div>
    </div>

    <div class="nav-item"><a class="nav-link" href="baiviet.html">✍ Bài viết</a></div>
    <div class="nav-item"><a class="nav-link" href="tintuc.html">📢 Tin tức</a></div>
<div class="nav-item"><a class="nav-link" href="anh.html">📷 Thư viện ảnh</a></div>
    <div class="nav-item"><a class="nav-link" href="suckhoe.html">❤️ Sức khỏe</a></div>
    <div class="nav-item"><a class="nav-link" href="tailieu.html">📁 Tài liệu</a></div>
  </nav>

  <<div class="page-wrapper">
<main class="main-content">
<div class="main-grid">
    <!-- CỘT TRÁI -->
<section class="content-left">

    <div class="control-panel">
      <input type="text" id="search-input" placeholder="Tìm kiếm tài liệu..." />
      <div id="stats-box">📊 Tổng: <span id="document-count">0</span> file</div>
    </div>

    <div id="document-list-container" class="post-list"></div>

</section>
 <!-- CỘT PHẢI -->
    <aside class="content-right" id="sidebar-container"></aside>
  </div>
</main>

  <!-- FOOTER -->
  <footer>
    ❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC
  </footer>

</div>

<script>
const JSON_URL = 'posts_data.json';
const listContainer = document.getElementById("document-list-container");
const searchInput = document.getElementById("search-input");
const countBox = document.getElementById("document-count");
let allDocs = [];

async function loadDocs(){
  const res = await fetch(JSON_URL);
  const data = await res.json();
  allDocs = data.filter(p => p.category === "tailieu" && p.fileData);
  render(allDocs);
}

function render(list){
  listContainer.innerHTML = '';
  countBox.textContent = list.length;

  if(!list.length){
    listContainer.innerHTML = '<p style="color:#888">Không có tài liệu.</p>';
    return;
  }

  list.forEach(p=>{
    listContainer.innerHTML += `
      <div class="file-item">
        <div class="file-info">
          <h3><a href="post.html?id=${p.id}">${p.title}</a></h3>
          <p>${p.shortDescription || ''}</p>
        </div>
        <a class="download-btn" href="${p.fileData}" download>⬇ Tải</a>
      </div>`;
  });
}

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.toLowerCase();
  render(allDocs.filter(p => p.title.toLowerCase().includes(q)));
});

document.addEventListener('DOMContentLoaded', loadDocs);

/* MENU */
menuBtn.onclick = ()=>{
  navMenu.classList.add("active");
  menuOverlay.classList.add("active");
};
menuOverlay.onclick = ()=>{
  navMenu.classList.remove("active");
  menuOverlay.classList.remove("active");
};
document.querySelectorAll(".toggle").forEach(t=>{
  t.onclick = ()=>t.parentElement.classList.toggle("open");
});
</script>

<script>
fetch("sidebar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("sidebar-container").innerHTML = data;
  });
</script>

</body>
</html>
