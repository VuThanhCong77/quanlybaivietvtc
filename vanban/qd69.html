<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Văn bản chuyên môn</title>

<!-- CSS DÙNG CHUNG -->
<link rel="stylesheet" href="../layout.css">

<style>
/* ===============================
   RIÊNG TRANG VĂN BẢN
   =============================== */

/* SEARCH BAR */
#search-container{
  max-width: 600px;
  margin: 0 auto;
  padding: 0 15px;
  display: flex;
  gap: 8px;
  align-items: center;
}

#search-input{
  flex: 1;
  padding: 10px;
  border: 2px solid var(--secondary);
  border-radius: 6px;
  font-size: 15px;
}

.btn-action{
  padding: 10px 14px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.btn-nav{
  width: 38px;
  height: 38px;
  background: var(--secondary);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
.btn-nav:disabled{ background:#ccc; }

#search-results{
  max-width: 600px;
  margin: 6px auto 0;
  font-size: 14px;
  color: var(--primary);
  display: none;
}

/* VĂN BẢN */
h2{
  color: var(--primary);
  border-left: 5px solid var(--primary);
  padding-left: 15px;
  margin-top: 0;
}

.justified-p{
  text-align: justify;
  margin-bottom: 15px;
}

/* HIGHLIGHT */
mark{
  background: yellow;
  padding: 0 2px;
  border-radius: 2px;
}
mark.current-match{
  background: orange;
  font-weight: bold;
}

/* BACK TO TOP */
#backToTop{
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: none;
  z-index: 1200;
}
</style>
</head>

<body>
<div class="page-wrapper">

<!-- HEADER DÙNG CHUNG -->
<header class="page-header">
  <button class="menu-btn" onclick="location.href='../index.html'">🏠</button>
  <h1>📖 Văn bản chuyên môn</h1>
</header>

<!-- THANH SEARCH CỐ ĐỊNH -->
<div class="sub-fixed">
  <div id="search-container">
    <input id="search-input" type="text" placeholder="Nhập từ khóa tìm kiếm…">
    <button id="prev-match" class="btn-nav" disabled>↑</button>
    <button id="next-match" class="btn-nav" disabled>↓</button>
    <button id="search-button" class="btn-action">Tìm</button>
  </div>
  <div id="search-results">
    <span id="match-count"></span>
  </div>
</div>

<!-- NỘI DUNG -->
<main id="content-body">
  <h2 id="doc-title"></h2>
  <div id="doc-content"></div>
</main>

<button id="backToTop">▲</button>

<footer>
  <p>🚀 SỨC KHỎE – TRÍ TUỆ – TỰ DO 🌸</p>
</footer>

</div>

<script>
/* ===============================
   LOAD JSON + TÌM KIẾM CHUẨN
   =============================== */

const contentArea = document.getElementById('content-body');
const searchInput = document.getElementById('search-input');
const btnSearch = document.getElementById('search-button');
const btnNext = document.getElementById('next-match');
const btnPrev = document.getElementById('prev-match');
const resultBox = document.getElementById('search-results');
const matchCount = document.getElementById('match-count');

let originalHTML = '';
let matches = [];
let index = -1;

/* LOAD JSON */
fetch('qd69.json')
  .then(res => res.json())
  .then(data => {
    document.getElementById('doc-title').innerText = data.title || '';

    const contentDiv = document.getElementById('doc-content');
    contentDiv.innerHTML = '';

    const paragraphs = data.content
      .split('</p>')
      .map(p => p.trim())
      .filter(p => p !== '');

    paragraphs.forEach(text => {
      const p = document.createElement('p');
      p.className = 'justified-p';
      p.innerHTML = text;
      contentDiv.appendChild(p);
    });

    /* ⚠️ RẤT QUAN TRỌNG */
    originalHTML = contentArea.innerHTML;
  })
  .catch(err => {
    contentArea.innerHTML =
      '<p style="color:red">❌ Không tải được nội dung văn bản</p>';
    console.error(err);
  });

/* TÌM KIẾM */
btnSearch.onclick = () => {
  const key = searchInput.value.trim();
  if (!key) return resetSearch();

  contentArea.innerHTML = originalHTML;

  const regex = new RegExp(`(${key})`, 'gi');
  contentArea.innerHTML = contentArea.innerHTML.replace(regex, '<mark>$1</mark>');

  matches = contentArea.querySelectorAll('mark');
  index = -1;

  if (matches.length) {
    btnNext.disabled = false;
    btnPrev.disabled = false;
    resultBox.style.display = 'block';
    goNext();
  } else {
    alert('Không tìm thấy từ khóa');
    resetSearch();
  }
};

function resetSearch() {
  contentArea.innerHTML = originalHTML;
  matches = [];
  index = -1;
  btnNext.disabled = true;
  btnPrev.disabled = true;
  resultBox.style.display = 'none';
  matchCount.innerText = '';
}

function updateView() {
  matches.forEach(m => m.classList.remove('current-match'));
  const cur = matches[index];
  cur.classList.add('current-match');

  const offset = 140;
  const y = cur.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top: y, behavior: 'smooth' });

  matchCount.innerText = `${index + 1} / ${matches.length}`;
}

function goNext() {
  if (!matches.length) return;
  index = (index + 1) % matches.length;
  updateView();
}

function goPrev() {
  if (!matches.length) return;
  index = (index - 1 + matches.length) % matches.length;
  updateView();
}

btnNext.onclick = goNext;
btnPrev.onclick = goPrev;

/* BACK TO TOP */
const topBtn = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
});
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>

<script>
fetch('qd69.json')
  .then(res => res.json())
  .then(data => {
    // Gán tiêu đề
    document.getElementById('doc-title').innerText = data.title || '';

    const contentDiv = document.getElementById('doc-content');

    // Tách nội dung theo </p>
    const paragraphs = data.content
      .split('</p>')
      .map(p => p.trim())
      .filter(p => p !== '');

    paragraphs.forEach(text => {
      const p = document.createElement('p');
      p.className = 'justified-p';
      p.innerHTML = text; // dùng innerHTML để giữ icon, chữ hoa
      contentDiv.appendChild(p);
    });
  })
  .catch(err => {
    document.getElementById('content-body').innerHTML =
      '<p style="color:red">❌ Không tải được nội dung văn bản</p>';
    console.error(err);
  });

</script>

</body>
</html>
