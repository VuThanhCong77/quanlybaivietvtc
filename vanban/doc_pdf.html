<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đọc văn bản PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- THẺ CHIA SẺ MẠNG XÃ HỘI -->
<meta property="og:type" content="article">
<meta property="og:title" content="Đọc file PDF">
<meta property="og:description" content="Văn bản pdf">
<meta property="og:url" content="https://vuthanhcong77.github.io/quanlybaivietvtc/vanban/doc_pdf.html">
<meta property="og:image" content="https://raw.githubusercontent.com/VuThanhCong77/quanlybaivietvtc/main/images/vutrong.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

 <!-- CSS DÙNG CHUNG -->
  <link rel="stylesheet" href="../layout.css">

<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
    }

    header {
      background: #b30000;
      color: #fff;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .toolbar {
      background: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
    }

    select {
      padding: 6px 10px;
      font-size: 14px;
    }

    .pdf-container {
      height: calc(100vh - 100px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>

<body>
<div class="page-wrapper">
<header class="page-header">
<button class="menu-btn" onclick="location.href='../index.html'">🏠</button>
  VĂN BẢN PDF
</header>

<div class="toolbar">
  Chọn văn bản:
  <select onchange="loadPDF(this.value)">
<option value="pdf/nq08chuyendoixanh.pdf">Nghị quyết chuyển đổi xanh</option>
<option value="pdf/xhcnhp.pdf">Nghị quyết xây dựng XHCN ở Hải Phòng</option>
    <option value="pdf/qd296tw.pdf">Quy định 296 TW</option>
    <option value="pdf/ytuonghay.pdf">Ý tưởng hay</option>
    <option value="pdf/Bi-mat-cua-mot-tri-nho-sieu-pham.pdf">Bí mật trí nhớ siêu phàm</option>
    <option value="pdf/Nhanto_Enzyme.pdf">Nhân tố Enzyme</option>
    <option value="pdf/nghiquyetdh14.pdf">Nghị quyết đại hội XIV của Đảng</option>
<option value="pdf/24 QD 2021 Thi hanh Dieu le Dang.pdf">Quy định thi hành Điều lệ Đảng</option>
<option value="pdf/01 HD 2021 thi hanh dieu le Dang.pdf">Hướng dẫn thi hành Điều lệ Đảng</option>
<option value="pdf/Nq Dai hoi Dang bo phuong lan 1.pdf">Nghị quyết Đại hội Đảng bộ phường lần I</option>
<option value="pdf/Ct hanh cong thuc hien Nq Dh Dang bo phuong lan 1.pdf">Chương trình hành động thực hiện NQ ĐH Đảng bộ phường</option>
<option value="pdf/danhsachtrungcuphuong26.pdf">Danh sách đại biểu HĐND phường 2026 - 2031</option>
  </select>
</div>

<div class="pdf-container">
  <iframe id="pdfViewer" src="pdf/xhcnhp.pdf"></iframe>
</div>

<div id="pdfArea"></div>

<footer>
  <p>❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC</p>
  </footer>
</div>

<script>
  function loadPDF(file) {
    document.getElementById("pdfViewer").src = file;
  }

function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  if (isMobile()) {
    document.getElementById("pdfArea").innerHTML = `
      <div style="padding:20px;text-align:center">
        <p><b>📄 Văn bản PDF</b></p>
        <a href="${pdfFile}" 
           style="
             display:inline-block;
             padding:12px 20px;
             background:#b30000;
             color:#fff;
             text-decoration:none;
             border-radius:6px;
             font-size:16px">
          👉 Nhấn để mở văn bản PDF
        </a>
        <p style="margin-top:10px;font-size:13px;color:#555">
          (Hỗ trợ tốt trên điện thoại)
        </p>
      </div>
    `;
  } else {
    document.getElementById("pdfArea").innerHTML = `
      <iframe src="${pdfFile}" 
              style="width:100%;height:90vh;border:none"></iframe>
    `;
  }
</script>

</body>
</html>
