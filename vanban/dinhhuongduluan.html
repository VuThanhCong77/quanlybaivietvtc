<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Định hướng dư luận</title>
<link rel="stylesheet" href="../layout.css">
<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    line-height:1.8;
}

/* ===== SEARCH ===== */

#search-container{
    max-width:1500px;
    margin:20px auto;
    display:flex;
    gap:8px;
    padding:0 15px;
}

#searchInput{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:2px solid #1976d2;
    font-size:16px;
}

#searchBtn,
#prevBtn,
#nextBtn{
    padding:12px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

#searchBtn{
    background:#1976d2;
}

#prevBtn,
#nextBtn{
    background:#009688;
}

#resultBox{
    display:flex;
    align-items:center;
    font-weight:bold;
    color:red;
}

/* ===== MAIN ===== */

main{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.main-box{
    background:#fffbea;
    border-radius:12px;
    padding:20px;
}

/* ===== ACCORDION ===== */

.content-section{
    margin-bottom:15px;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #ddd;
}

.section-header{
    background:#eef7fa;
    padding:16px;
    cursor:pointer;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section-title{
    margin:0;
    font-size:20px;
}

.section-content{
    display:none;
    padding:20px;
    border-top:1px solid #eee;
}

.content-section.active .section-content{
    display:block;
}

.section-arrow{
    transition:.3s;
}

.content-section.active .section-arrow{
    transform:rotate(180deg);
}

/* ===== MARK ===== */

mark{
    background:yellow;
}

.current-match{
    background:orange;
}

/* ===== BUTTON ===== */

#backToTop{
    position:fixed;
    right:30px;
    bottom:30px;

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    background:#1976d2;
    color:#fff;

    cursor:pointer;

    display:none;
}

.floating-back{
    position:fixed;
    top:20px;
    right:20px;

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    background:#c0b000;
    color:#fff;

    font-size:24px;
    cursor:pointer;
}

p{
    text-align:justify;
}

/* ===== NÚT TÌM KIẾM NỔI ===== */

#prevBtn,
#nextBtn{

position:fixed;

right:20px;

z-index:9999;

width:50px;
height:50px;

border:none;
border-radius:50%;

font-size:22px;
font-weight:bold;

cursor:pointer;

color:#fff;

box-shadow:0 4px 10px rgba(0,0,0,.3);

}

#prevBtn{

bottom:140px;

background:#1976d2;

}

#nextBtn{

bottom:80px;

background:#009688;

}

</style>
</head>

<body>
<div class="page-wrapper">

<header class="page-header">
  <h1>
<a href="index.html" title="Trang chủ">| 🏠 |</a>
Bảo vệ nền tảng tư tưởng trên không gian mạng
</h1>
</header>
    
<div id="search-container">

<input
type="text"
id="searchInput"
placeholder="Nhập từ khóa...">

<button id="searchBtn">
Tìm
</button>

<button id="prevBtn">⬆</button>

<button id="nextBtn">⬇</button>

<span id="resultBox"></span>

</div>

<main>

<div class="main-box">

<h2 id="page-title">
Đang tải...
</h2>

<button onclick="startSpeak()">🔊</button>
<button onclick="pauseSpeak()">⏸</button>
<button onclick="resumeSpeak()">▶</button>
<button onclick="stopSpeak()">⏹</button>

<div id="content">
Đang tải nội dung...
</div>

</div>

</main>

<button id="backToTop">
▲
</button>

<button class="floating-back"
onclick="history.back()">
←
</button>
</div>
    
<script>

/* ======================
   TEXT TO SPEECH
====================== */

let utterance;

function startSpeak(){

const text =
document.getElementById(
"content"
).innerText;

speechSynthesis.cancel();

utterance =
new SpeechSynthesisUtterance(
text
);

utterance.lang = "vi-VN";

speechSynthesis.speak(
utterance
);

}

function pauseSpeak(){
speechSynthesis.pause();
}

function resumeSpeak(){
speechSynthesis.resume();
}

function stopSpeak(){
speechSynthesis.cancel();
}



/* ======================
   BACK TO TOP
====================== */

const topBtn =
document.getElementById(
"backToTop"
);

window.addEventListener(
"scroll",
() => {

topBtn.style.display =
window.scrollY > 300
? "block"
: "none";

});

topBtn.onclick = () => {

window.scrollTo({
top:0,
behavior:"smooth"
});

};



/* ======================
   LOAD JSON
====================== */

const area =
document.getElementById(
"content"
);

let originalHTML = "";

fetch("./dinhhuongduluan.json")

.then(res => {

if(!res.ok){

throw new Error(
"Không đọc được JSON"
);

}

return res.json();

})

.then(data => {

let html = "";

if(data.title){

document.getElementById(
"page-title"
).innerHTML = data.title;

}


if(Array.isArray(data.sections)){

data.sections.forEach(
section => {

html += createSection(

section.heading ||
section.title ||
"",

section.content ||
section.noidung ||
""

);

});

}

else if(Array.isArray(data)){

data.forEach(item => {

html += createSection(

item.heading ||
item.title ||
"",

item.content ||
item.noidung ||
""

);

});

}

area.innerHTML = html;

originalHTML = html;

initAccordion();

})

.catch(err => {

console.error(err);

area.innerHTML = `
<p style="color:red">
Không tải được JSON
</p>
`;

});



/* ======================
   CREATE SECTION
====================== */

function createSection(
title,
content
){

return `

<div class="content-section active">

<div class="section-header">

<h2 class="section-title">
${title}
</h2>

<span class="section-arrow">
▼
</span>

</div>

<div class="section-content">
${content}
</div>

</div>

`;

}



/* ======================
   ACCORDION
====================== */

function initAccordion(){

document
.querySelectorAll(
".section-header"
)

.forEach(header => {

header.onclick = () => {

header.parentElement
.classList.toggle(
"active"
);

};

});

}



/* ======================
   SEARCH
====================== */

const searchInput =
document.getElementById(
"searchInput"
);

const searchBtn =
document.getElementById(
"searchBtn"
);

const prevBtn =
document.getElementById(
"prevBtn"
);

const nextBtn =
document.getElementById(
"nextBtn"
);

const resultBox =
document.getElementById(
"resultBox"
);

let matches = [];

let currentIndex = -1;



function escapeRegExp(text){

return text.replace(
/[.*+?^${}()|[\]\\]/g,
"\\$&"
);

}



searchBtn.onclick = () => {

const keyword =
searchInput.value.trim();

if(!keyword){

resultBox.innerHTML =
"Nhập từ khóa";

return;

}


/* RESET */
area.innerHTML =
originalHTML;

initAccordion();


/* OPEN ALL */
document
.querySelectorAll(
".content-section"
)

.forEach(section => {

section.classList.add(
"active"
);

});


/* SEARCH */
const regex =
new RegExp(
escapeRegExp(keyword),
"gi"
);


/* HIGHLIGHT */
area.innerHTML =
area.innerHTML.replace(
regex,
match =>
`<mark>${match}</mark>`
);


/* GET MATCHES */
matches =
area.querySelectorAll(
"mark"
);


if(!matches.length){

resultBox.innerHTML =
"Không tìm thấy";

return;

}


currentIndex = 0;

updateMatch();

};



function updateMatch(){

matches.forEach(m => {

m.classList.remove(
"current-match"
);

});


matches[currentIndex]
.classList.add(
"current-match"
);


matches[currentIndex]
.scrollIntoView({

behavior:"smooth",

block:"center"

});


resultBox.innerHTML =
`${currentIndex + 1}/${matches.length}`;

}



/* NEXT */

nextBtn.onclick = () => {

if(!matches.length)
return;

currentIndex++;

if(
currentIndex >= matches.length
){

currentIndex = 0;

}

updateMatch();

};



/* PREV */

prevBtn.onclick = () => {

if(!matches.length)
return;

currentIndex--;

if(currentIndex < 0){

currentIndex =
matches.length - 1;

}

updateMatch();

};



/* ENTER */

searchInput.addEventListener(
"keydown",
e => {

if(e.key === "Enter"){

searchBtn.click();

}

});

</script>

</body>
</html>
