<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sách PDF lật trang</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Turn.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style>

body{
    margin:0;
    background:#555;
    font-family:Arial;
    overflow:hidden;
}

/* HEADER */
header{
    background:#8b0000;
    color:white;
    padding:12px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* THANH CHỌN */
.toolbar{
    background:white;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    border-bottom:1px solid #ccc;
}

select{
    padding:8px;
    font-size:15px;
}

button{
    padding:8px 14px;
    border:none;
    background:#8b0000;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

/* KHU SÁCH */
#book-container{
    width:100%;
    height:calc(100vh - 110px);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* QUYỂN SÁCH */
#flipbook{
    width:1200px;
    height:800px;
}

/* TRANG */
.page{
    background:white;
    overflow:hidden;
}

/* CANVAS PDF */
.page canvas{
    width:100%;
    height:100%;
}

</style>
</head>

<body>

<header>📖 TỦ SÁCH ĐIỆN TỬ</header>

<div class="toolbar">

<select id="pdfSelect">

<option value="pdf/ytuonghay.pdf">Ý tưởng hay</option>
 <option value="pdf/Qd20thihanhdieuledang2026.pdf">Quy định 20 thi hành Điều lệ Đảng</option>
 <option value="pdf/qd21ktgs.pdf">Quy định 21 về kiểm tra, giám sát</option>
 <option value="pdf/nqtw80vanhoa.pdf">Nghị quyết TW về văn hóa</option>
 <option value="pdf/Nq Dai hoi Dang bo phuong lan 1.pdf">Nghị quyết Đại hội Đảng bộ phường Lưu Kiếm lần I</option>
 <option value="pdf/Qd19chinhtritutuong.pdf">Quy định 19 về chính trị, tư tưởng</option>
 <option value="../sach_hay/triethocmaclenin.pdf">Triết học Mác Lênin</option>
<option value="pdf/xhcnhp.pdf">Nghị quyết xây dựng XHCN</option>
<option value="pdf/nq08chuyendoixanh.pdf">Nghị quyết chuyển đổi xanh</option>
<option value="pdf/Lich su Luu Ky_A5.pdf">Lưu Kỳ những chặng đường lịch sử</option>

</select>

<button onclick="loadBook()">
Mở sách
</button>

<button onclick="$('#flipbook').turn('previous')">
⬅ Trang trước
</button>

<button onclick="$('#flipbook').turn('next')">
Trang sau ➡
</button>

</div>

<div id="book-container">
    <div id="flipbook"></div>
</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

async function loadBook(){

    const pdfFile =
        document.getElementById("pdfSelect").value;

    const flipbook =
        document.getElementById("flipbook");

    flipbook.innerHTML = "";

    const pdf =
        await pdfjsLib.getDocument(pdfFile).promise;

    for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

        const page =
            await pdf.getPage(pageNum);

        const viewport =
            page.getViewport({scale:1.5});

        const canvas =
            document.createElement("canvas");

        const context =
            canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext:context,
            viewport:viewport
        }).promise;

        const div =
            document.createElement("div");

        div.className = "page";

        div.appendChild(canvas);

        flipbook.appendChild(div);
    }

    // Khởi tạo hiệu ứng lật sách
    $("#flipbook").turn({

        width:1200,
        height:800,

        autoCenter:true,

        gradients:true,

        elevation:50

    });
}

window.onload = loadBook;

</script>

</body>
</html>
