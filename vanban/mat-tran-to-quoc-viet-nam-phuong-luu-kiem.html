<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

content="Mặt trận Tổ quốc Việt Nam phường Lưu Kiếm xin nghi nhận mọi phản ánh kiến nghị của Nhân dân về tất các vấn đề tại địa phương">

content="https://vuthanhcong77.github.io/quanlybaivietvtc/anhvietbai/phan-anh-mttq.jpg">

href="../layout.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;

  background:transparent;

  color:#1f2937;

  line-height:1.9;

  overflow-x:hidden;
}

header{
    top:0;
    width:100%;
    background:#ead10d;
}

.article{

  width:100%;

  max-width:860px;

  margin:0 auto;

  padding:24px 22px 40px;

  background:#ffffff;

  border-radius:0;

  box-shadow:none;
}

.article h1{

  text-align:center;

  color:#0b4ea2;

  font-size:32px;

  margin-bottom:10px;

  line-height:1.4;
}

.article-date{

  text-align:center;

  font-size:14px;

  color:#6b7280;

  margin-bottom:26px;
}

.voice-wrap{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  flex-wrap:wrap;

  margin-bottom:24px;
}

.voice-wrap button{

  border:none;

  padding:10px 18px;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #0b4ea2,
      #199586
    );

  color:#fff;

  font-size:14px;

  font-weight:600;

  cursor:pointer;

  transition:.25s;

  box-shadow:
    0 6px 18px rgba(0,0,0,.10);
}

.voice-wrap button:hover{

  transform:
    translateY(-2px);
}

.font-tools{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin-bottom:28px;
}

.font-tools button{

  width:42px;
  height:42px;

  border:none;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #0b4ea2,
      #199586
    );

  color:#fff;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.25s;
}

.font-tools button:hover{

  transform:scale(1.08);
}

.font-tools span{

  font-size:14px;

  color:#374151;

  font-weight:600;
}

.article-content p{

  font-size:16px;

  line-height:1.5;

  text-align:justify;

  text-indent:2em;

  margin-bottom:16px;
}

.article-content p:first-child::first-letter{

  font-size:42px;

  font-weight:700;

  color:#0b4ea2;
}

.img-box{

  margin:28px 0;

  text-align:center;
}

.img-box img{

  width:100%;

  max-width:760px;

  border-radius:18px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.14);
}


.float-btn{

  position:fixed;

  width:50px;
  height:50px;

  border:none;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #0b4ea2,
      #199586
    );

  color:#fff;

  font-size:20px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  box-shadow:
    0 8px 22px rgba(0,0,0,.18);

  z-index:9999;

  transition:.25s;
}

.float-btn:hover{

  transform:
    translateY(-3px)
    scale(1.06);
}

/* Nút quay lại */

#backBtn{

  top:18px;
  right:18px;
}

/* Nút lên đầu */

#topBtn{

  bottom:18px;
  right:18px;

  display:none;
}


@media(max-width:768px){

  .article{

    padding:
      18px 16px 30px;
  }

  .article h1{

    font-size:28px;
  }

  .article-content p{

    font-size:16px;

    line-height:1.9;

    text-indent:1.8em;
  }

  .voice-wrap{

    gap:8px;
  }

  .voice-wrap button{

    padding:10px 14px;

    font-size:13px;
  }

}


.related-posts{

  margin-top:50px;

  padding-top:20px;

  border-top:2px dashed #dbe4f0;
}

.related-posts h2{

  font-size:24px;

  color:#0b4ea2;

  margin-bottom:22px;

  text-align:center;
}

.related-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));

  gap:20px;
}

.related-card{

  background:#fff;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 8px 22px rgba(0,0,0,.08);

  transition:.3s;

  border:1px solid #edf2f7;
}

.related-card:hover{

  transform:
    translateY(-5px);

  box-shadow:
    0 14px 28px rgba(0,0,0,.12);
}

.related-card img{

  width:100%;

  height:170px;

  object-fit:cover;
}

.related-content{

  padding:16px;
}

.related-content h3{

  font-size:17px;

  color:#0f172a;

  margin-bottom:10px;

  line-height:1.5;
}

.related-content p{

  font-size:14px;

  color:#475569;

  line-height:1.7;

  margin-bottom:12px;

  text-align:justify;
}

.related-content a{

  display:inline-block;

  padding:8px 14px;

  border-radius:999px;

  text-decoration:none;

  background:
    linear-gradient(
      135deg,
      #0b4ea2,
      #199586
    );

  color:#fff;

  font-size:13px;

  font-weight:600;

  transition:.25s;
}

.related-content a:hover{

  transform:scale(1.05);
}

@media(max-width:768px){

  .related-card img{

    height:190px;
  }

}


.feedback-box{

margin-top:50px;

padding:28px;

border-radius:22px;

background:
linear-gradient(
135deg,
#f8fbff,
#eef7ff
);

border:1px solid #dbeafe;

box-shadow:
0 8px 24px rgba(0,0,0,.06);
}

.feedback-box h2{

text-align:center;

color:#0b4ea2;

margin-bottom:10px;

font-size:24px;
}

.feedback-box p{

text-align:center;

color:#475569;

margin-bottom:22px;

font-size:15px;
}

#feedbackForm{

display:flex;

flex-direction:column;

gap:16px;
}

#feedbackForm input,
#feedbackForm textarea{

width:100%;

padding:14px 16px;

border-radius:14px;

border:1px solid #cbd5e1;

font-size:15px;

font-family:inherit;

outline:none;

transition:.25s;

background:#fff;
}

#feedbackForm input:focus,
#feedbackForm textarea:focus{

border-color:#0b4ea2;

box-shadow:
0 0 0 4px rgba(11,78,162,.10);
}

#feedbackForm textarea{

min-height:140px;

resize:vertical;
}

#feedbackForm button{

border:none;

padding:14px;

border-radius:999px;

background:
linear-gradient(
135deg,
#0b4ea2,
#199586
);

color:#fff;

font-size:15px;

font-weight:700;

cursor:pointer;

transition:.25s;
}

#feedbackForm button:hover{

transform:
translateY(-2px);

box-shadow:
0 10px 22px rgba(0,0,0,.12);
}

#fbStatus{

margin-top:10px;

text-align:center;

font-size:14px;

font-weight:600;

color:#199586;
}

@media(max-width:768px){

.feedback-box{

padding:22px 16px;
}

}

</style>

<button

id="backBtn"
onclick="history.back()">

<div class="article">

<header>

</a>
</li>
</ul>
</header>

<h1>Mặt trận Tổ quốc Việt Nam phường Lưu Kiếm</h1>

<div class="article-date">
📅 22-05-2026
</div>


<div class="article-content" id="readingContent">

<div class="img-box">
<a href="https://docs.google.com/forms/d/e/1FAIpQLScHzV-WeSD8W2JAMq-6-Db_SSkjikj8Qp0zOTlFmb-UzKJbRw/viewform"><img src="../anhvietbai/phan-anh-mttq.jpg">
<p>Xin tiếp nhận ý kiến phản ánh của Nhân dân về tất cả các vấn đề trên địa bàn phường (Hãy nhấn vào ảnh để đến địa chỉ góp ý)</p>
</a>
</div>

</div>

<div class="related-posts">

<h2>📚 Bài viết liên quan</h2>

<div id="relatedList" class="related-grid"></div>

</div>

</div>

<button
class="float-btn"
id="topBtn">

⬆

</button>

</div>

<script >
function copyLink(){

navigator.clipboard.writeText(location.href);

alert("Đã copy liên kết!");

}

function sendHeight(){

const height =
document.body.scrollHeight;

parent.postMessage({

iframeHeight:height

},"*");

}

window.onload = sendHeight;

window.onresize = sendHeight;


async function loadRelatedPosts(){

try{

const response =
await fetch('../data/posts.json');

const posts =
await response.json();


const currentPage =
location.pathname.split("/").pop();


const related =
posts.filter(post => {

return !post.url.includes(currentPage)

&& post.category === "Chính trị";

}).slice(0,4);

const container =
document.getElementById(
"relatedList"
);

container.innerHTML =
related.map(post => `

<div class="related-card">

<img src="../${post.image}"
alt="${post.title}">

<div class="related-content">

<h3>${post.title}</h3>

<p>${post.desc}</p>

<a href="../${post.url}">
Đọc bài →
</a>

</div>

</div>

`).join("");

}catch(error){

console.log(
"Lỗi tải bài liên quan:",
error
);

}

}

loadRelatedPosts();
</script>

</body>
</html>
