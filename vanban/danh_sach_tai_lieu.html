<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách tài liệu</title>

<link rel="stylesheet" href="../layout.css">

<style>
body{
    font-family: Arial;
    margin:0;
    padding:10px;
    background:#f4f6f9;
}

/* HEADER */
.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.page-title{
    font-size:18px;
}

/* CONTROL */
.controls{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
}

input, select{
    padding:10px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* TABLE */
table{
    width:100%;
    border-collapse: collapse;
    background:white;
    font-size:14px;
}

th, td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#3498db;
    color:white;
}

tr:hover{
    background:#f1f1f1;
}

/* NÚT */
.btn{
    display:inline-block;
    padding:6px 10px;
    background:#2ecc71;
    color:white;
    border-radius:5px;
    text-decoration:none;
    font-size:13px;
}

.btn:active{
    transform:scale(0.95);
}

/* MOBILE TỐI ƯU */
@media(max-width:768px){

    table, thead, tbody, th, td, tr{
        display:block;
    }

    thead{
        display:none;
    }

    tr{
        margin-bottom:10px;
        background:white;
        padding:10px;
        border-radius:8px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    td{
        border:none;
        padding:6px 0;
    }

    td::before{
        font-weight:bold;
        display:block;
        color:#555;
    }

    td:nth-child(1)::before{content:"STT";}
    td:nth-child(2)::before{content:"Tên";}
    td:nth-child(3)::before{content:"Loại";}
    td:nth-child(4)::before{content:"Thư mục";}
    td:nth-child(5)::before{content:"Mở";}
}

/* VIEWER */
#viewer{
    width:100%;
    height:60vh;
    margin-top:10px;
    border:1px solid #ccc;
}

/* FOOTER */
footer{
    text-align:center;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="page-header">
  <h1 class="page-title">
    <a href="../vanban/danh_sach_tai_lieu.html">QUẢN LÝ TÀI LIỆU</a>
  </h1>
  <a href="../index.html">🏠</a>
</div>

<div class="controls">
<input type="text" id="search" placeholder="Tìm kiếm..." onkeyup="render()">

<select id="folderFilter" onchange="render()">
<option value="">-- Tất cả thư mục --</option>
</select>
</div>

<table>
<thead>
<tr>
<th>STT</th>
<th>Tên</th>
<th>Loại</th>
<th>Thư mục</th>
<th>Mở</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<iframe id="viewer"></iframe>

<footer>
<p>❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC</p>
</footer>

<script>
let files = [
{"name":"Nghị quyết chuyển đổi xanh của Hải Phòng","link":"pdf/nq08chuyendoixanh.pdf","type":"PDF","folder":"NQ08_HP"},
{"name":"Mô hình chủ nghĩa xã hội ở Hải Phòng","link":"pdf/xhcnhp.pdf","type":"PDF","folder":"NQ05_HP"},
{"name":"Nghị quyết đại hội XIV của Đảng","link":"pdf/nghiquyetdh14.pdf","type":"PDF","folder":"Đại hội XIV"}
];

function isMobile(){
    return /iPhone|Android/i.test(navigator.userAgent);
}

function render(){
    let keyword = document.getElementById("search").value.toLowerCase();
    let folder = document.getElementById("folderFilter").value;
    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    let stt = 1;

    files.forEach(f=>{
        if(keyword && !f.name.toLowerCase().includes(keyword)) return;
        if(folder && f.folder !== folder) return;

        tbody.innerHTML += `
        <tr>
            <td>${stt++}</td>
            <td>${f.name}</td>
            <td>${f.type}</td>
            <td>${f.folder || ""}</td>
            <td><span class="btn" onclick="openFile('${f.link}','${f.type}')">Mở</span></td>
        </tr>
        `;
    });
}

function loadFolders(){
    let select = document.getElementById("folderFilter");
    let folders = [...new Set(files.map(f=>f.folder).filter(f=>f))];

    folders.forEach(f=>{
        select.innerHTML += `<option value="${f}">${f}</option>`;
    });
}

function openFile(link, type){
    if(type === "PDF"){
        if(isMobile()){
            window.open(link, "_blank"); // Mobile mở tab mới
        }else{
            document.getElementById("viewer").src = link;
        }
    }else{
        window.open(link, "_blank");
    }
}

loadFolders();
render();
</script>

</body>
</html>
