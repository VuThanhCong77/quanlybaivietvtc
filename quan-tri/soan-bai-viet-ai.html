<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trợ lý Biên tập AI - Vũ Thành Công</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --vtc-blue: #003366;
      --vtc-light-blue: #0056b3;
      --vtc-bg: #f4f6f9;
    }
    body {
      background-color: var(--vtc-bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .vtc-header {
      background-color: var(--vtc-blue);
      color: white;
      padding: 15px 20px;
      border-bottom: 4px solid #ffcc00;
    }
    .card-vtc {
      border: 1px solid #dce3ec;
      border-top: 3px solid var(--vtc-blue);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .btn-vtc {
      background-color: var(--vtc-blue);
      color: white;
    }
    .btn-vtc:hover {
      background-color: var(--vtc-light-blue);
      color: white;
    }
    .editor-box {
      min-height: 350px;
      background: #fff;
      border: 1px solid #ced4da;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Header Cổng thông tin -->
  <header class="vtc-header d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <i class="fa-solid => fa-newspaper fa-2x me-3"></i>
      <div>
        <h4 class="m-0 text-uppercase fw-bold">CỔNG THÔNG TIN ĐIỆN TỬ VŨ THÀNH CÔNG</h4>
        <small>Hệ thống Trợ lý Biên tập Bài viết AI Chuyên nghiệp</small>
      </div>
    </div>
  </header>

  <div class="container-fluid mt-4 mb-5">
    <div class="row">
      <!-- Cột trái: Đầu vào sự kiện -->
      <div class="col-lg-4 mb-3">
        <div class="card card-vtc p-3">
          <h5 class="text-primary fw-bold mb-3"><i class="fa-solid fa-pen-clip me-2"></i>Nhập dữ liệu tin bài</h5>
          <form id="newsForm">
            <div class="mb-2">
              <label class="form-label fw-bold">Chủ đề / Tên sự kiện</label>
              <input type="text" id="topic" class="form-control" placeholder="Đại lễ khánh thành...">
            </div>
            <div class="row">
              <div class="col-md-6 mb-2">
                <label class="form-label fw-bold">Thời gian</label>
                <input type="text" id="time" class="form-control" placeholder="Sáng 27/9/2026">
              </div>
              <div class="col-md-6 mb-2">
                <label class="form-label fw-bold">Địa điểm</label>
                <input type="text" id="location" class="form-control" placeholder="Tổ dân phố Lưu Kỳ...">
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold">Diễn biến / Nội dung chính</label>
              <textarea id="content" class="form-control" rows="3" placeholder="Khai tâm, điểm nhãn, an vị rồng..."></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold">Nhân vật / Đại biểu</label>
              <input type="text" id="figures" class="form-control" placeholder="Đồng chí A, lãnh đạo B...">
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold">Số liệu quan trọng</label>
              <input type="text" id="stats" class="form-control" placeholder="500 đại biểu, 20 tỷ đồng...">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Thông điệp cốt lõi</label>
              <input type="text" id="message" class="form-control" placeholder="Gợi mở phát triển du lịch tâm linh...">
            </div>
            <button type="button" class="btn btn-vtc w-100 fw-bold" onclick="executeAI('generate_news')">
              <i class="fa-solid fa-wand-magic-sparkles me-2"></i>AI VIẾT BÀI HOÀN CHỈNH
            </button>
          </form>
        </div>
      </div>

      <!-- Cột giữa: Trình biên tập & Công cụ AI -->
      <div class="col-lg-8">
        <div class="card card-vtc p-3 mb-3">
          <!-- Thanh công cụ AI -->
          <div class="d-flex flex-wrap gap-2 mb-3 border-bottom pb-2">
            <button class="btn btn-outline-primary btn-sm" onclick="executeTransform('style_party')"><i class="fa-solid fa-landmark me-1"></i>Văn phong Đảng - Nhà nước</button>
            <button class="btn btn-outline-primary btn-sm" onclick="executeTransform('style_journalism')"><i class="fa-solid fa-newspaper me-1"></i>Văn phong Báo chí</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="executeTransform('expand')"><i class="fa-solid fa-expand me-1"></i>Mở rộng</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="executeTransform('shorten')"><i class="fa-solid fa-compress me-1"></i>Rút gọn</button>
            <button class="btn btn-outline-warning btn-sm" onclick="executeTransform('check_logic')"><i class="fa-solid fa-magnifying-glass-warning me-1"></i>Kiểm tra suy diễn</button>
            <button class="btn btn-outline-info btn-sm" onclick="executeAI('social_media')"><i class="fa-brands fa-facebook me-1"></i>Bản Facebook/Zalo</button>
          </div>

          <!-- Trình hiển thị & Soạn thảo -->
          <label class="form-label fw-bold">Nội dung bài viết (HTML / Text Output)</label>
          <div id="editor" class="editor-box" contenteditable="true">
            <i class="text-muted">Nội dung tin bài sau khi tạo sẽ hiển thị ở đây...</i>
          </div>

          <!-- Các nút thao tác xuất bản -->
          <div class="d-flex justify-content-between mt-3">
            <div>
              <button class="btn btn-success me-2" onclick="saveDraft()"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu nháp</button>
              <button class="btn btn-secondary me-2" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>In bài</button>
            </div>
            <button class="btn btn-dark" onclick="copyHTML()"><i class="fa-solid fa-code me-1"></i>Sao chép HTML</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL API Trung gian (Thay bằng endpoint Cloudflare Worker của bạn)
    const WORKER_URL = "https://quanlybaivietvtc.2025muahenamay.workers.dev/";

    async function executeAI(action) {
      const editor = document.getElementById('editor');
      editor.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-primary"></div><p class="mt-2">AI đang xử lý nội dung...</p></div>';

      const payload = {
        topic: document.getElementById('topic').value,
        time: document.getElementById('time').value,
        location: document.getElementById('location').value,
        content: document.getElementById('content').value,
        figures: document.getElementById('figures').value,
        stats: document.getElementById('stats').value,
        message: document.getElementById('message').value,
        text: editor.innerText
      };

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, payload })
        });
        const data = await response.json();
        editor.innerHTML = data.result || "Không có phản hồi từ máy chủ.";
      } catch (err) {
        editor.innerHTML = `<span class="text-danger">Lỗi kết nối API: ${err.message}</span>`;
      }
    }

    function executeTransform(type) {
      alert("Đã gửi yêu cầu xử lý tác vụ: " + type);
      // Gọi API tương ứng với action xử lý văn bản
    }

    function saveDraft() {
      localStorage.setItem('vtc_draft', document.getElementById('editor').innerHTML);
      alert('Đã lưu bản nháp thành công!');
    }

    function copyHTML() {
      const htmlContent = document.getElementById('editor').innerHTML;
      navigator.clipboard.writeText(htmlContent);
      alert('Đã sao chép mã HTML vào bộ nhớ tạm!');
    }
  </script>
</body>
</html>
