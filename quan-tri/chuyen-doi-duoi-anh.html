<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nén ảnh hàng loạt chuẩn Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f2f4f7;
    padding: 20px;
    margin: 0;
}
.box {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}
h1 {
    text-align: center;
    color: #b30000;
    margin-top: 0;
}
.form-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}
.field { display: flex; flex-direction: column; }
label {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 5px;
}
input, select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}
.actions { margin-bottom: 20px; }
button {
    background: #b30000;
    color: #fff;
    padding: 10px 18px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    margin-right: 8px;
    transition: background 0.2s;
}
button:hover { background: #8e0000; }
button:disabled { background: #ccc; cursor: not-allowed; }

.preview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.card {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    background: #fafafa;
    box-shadow: 0 2px 5px rgba(0,0,0,.03);
}
.card img {
    max-width: 100%;
    height: 140px;
    object-fit: contain;
    margin-bottom: 8px;
    background: #e9e9e9;
    border-radius: 4px;
}
.card-info { margin-bottom: 8px; text-align: left; }
.card button { width: 100%; margin: 0; padding: 6px; font-weight: normal; }
.note { font-size: 13px; color: #666; margin-top: 15px; line-height: 1.5; }
</style>

<link rel="stylesheet" href="../tai-nguyen/css/menu.css">
<script src="../tai-nguyen/js/goi-menu.js"></script>
<script src="../tai-nguyen/js/menu.js"></script>
    
</head>

<body>

<header id="menu"></header>
    
<div class="box">
<h1>NÉN ẢNH HÀNG LOẠT CHUẨN WEBSITE</h1>

<div class="form-group">
    <div class="field" style="grid-column: 1 / -1;">
        <label>Chọn ảnh (chọn nhiều ảnh):</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    
    <div class="field">
        <label>Giới hạn Rộng (px):</label>
        <input type="number" id="width" value="1200">
    </div>

    <div class="field">
        <label>Chế độ Resize:</label>
        <select id="resizeMode">
            <option value="aspectRatio">Tự động giữ tỷ lệ (Khuyên dùng)</option>
            <option value="fixedCanvas">Cố định khung (Điền nền trắng)</option>
        </select>
    </div>

    <div class="field">
        <label>Định dạng xuất:</label>
        <select id="format">
            <option value="image/webp" selected>WEBP (Tối ưu nhất)</option>
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
        </select>
    </div>

    <div class="field">
        <label>Chất lượng nén: <span id="qualityVal">75%</span></label>
        <input type="range" min="0.1" max="1" step="0.05" value="0.75" id="quality">
    </div>
</div>

<div class="actions">
    <button id="btnProcess" onclick="processAll()">Xử lý & nén ảnh</button>
    <button id="btnDownload" onclick="downloadAll()" disabled>Tải tất cả ảnh</button>
</div>

<div id="preview" class="preview"></div>

<p class="note">
💡 <b>Gợi ý chuẩn Web:</b> Rộng 1200px – Chất lượng 0.75 (75%) – Định dạng WEBP để tối ưu tốc độ load trang tốt nhất.<br>
</p>
</div>

<script>
let files = [];
let results = [];

// Cập nhật nhãn hiển thị chất lượng nén
document.getElementById("quality").addEventListener("input", (e) => {
    document.getElementById("qualityVal").innerText = Math.round(e.target.value * 100) + "%";
});

document.getElementById("fileInput").addEventListener("change", function(e){
    files = Array.from(e.target.files);
    clearResults();
});

function clearResults() {
    // Giải phóng bộ nhớ RAM từ Blob URL cũ
    results.forEach(r => URL.revokeObjectURL(r.url));
    results = [];
    document.getElementById("preview").innerHTML = "";
    document.getElementById("btnDownload").disabled = true;
}

async function processAll() {
    if(files.length === 0){
        alert("Vui lòng chọn ảnh trước!");
        return;
    }

    clearResults();
    const btnProcess = document.getElementById("btnProcess");
    btnProcess.disabled = true;
    btnProcess.innerText = "Đang xử lý...";

    for (let file of files) {
        try {
            const res = await processImage(file);
            results.push(res);
            renderCard(res, results.length - 1);
        } catch (err) {
            console.error("Lỗi khi xử lý file:", file.name, err);
        }
    }

    btnProcess.disabled = false;
    btnProcess.innerText = "Xử lý & nén ảnh";
    if (results.length > 0) document.getElementById("btnDownload").disabled = false;
}

function processImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                const maxWidth = parseInt(document.getElementById("width").value) || img.width;
                const mode = document.getElementById("resizeMode").value;
                const format = document.getElementById("format").value;
                const quality = parseFloat(document.getElementById("quality").value);

                let targetW = img.width;
                let targetH = img.height;

                // Tự động thu nhỏ nếu kích thước gốc lớn hơn giới hạn
                if (img.width > maxWidth) {
                    targetW = maxWidth;
                    targetH = Math.round((img.height * maxWidth) / img.width);
                }

                if (mode === "aspectRatio") {
                    canvas.width = targetW;
                    canvas.height = targetH;
                    ctx.drawImage(img, 0, 0, targetW, targetH);
                } else {
                    // Cố định khung với nền trắng
                    canvas.width = maxWidth;
                    canvas.height = maxWidth; // Vuông
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    let ratio = Math.min(maxWidth / img.width, maxWidth / img.height);
                    let newW = Math.round(img.width * ratio);
                    let newH = Math.round(img.height * ratio);
                    let x = (maxWidth - newW) / 2;
                    let y = (maxWidth - newH) / 2;
                    ctx.drawImage(img, x, y, newW, newH);
                }

                canvas.toBlob(blob => {
                    if(!blob) return reject("Không thể tạo Blob");
                    const url = URL.createObjectURL(blob);
                    resolve({
                        blob, 
                        url, 
                        name: file.name,
                        originalSize: file.size,
                        width: canvas.width,
                        height: canvas.height
                    });
                }, format, quality);
            };
            img.onerror = reject;
        };
        reader.onerror = reject;
    });
}

function renderCard(item, index) {
    const card = document.createElement("div");
    card.className = "card";
    const savedPercent = Math.round((1 - (item.blob.size / item.originalSize)) * 100);
    
    card.innerHTML = `
        <img loading="lazy" src="${item.url}">
        <div class="card-info">
            <b>Kích thước:</b> ${item.width}×${item.height}px<br>
            <b>Gốc:</b> ${(item.originalSize / 1024).toFixed(1)} KB<br>
            <b>Sau nén:</b> ${(item.blob.size / 1024).toFixed(1)} KB 
            <span style="color: ${savedPercent > 0 ? 'green' : 'red'};">(${savedPercent > 0 ? '-' : '+'}${Math.abs(savedPercent)}%)</span>
        </div>
        <button onclick="downloadOne(${index})">Tải xuống</button>
    `;
    document.getElementById("preview").appendChild(card);
}

function getExtension(mimeType) {
    switch(mimeType) {
        case "image/webp": return ".webp";
        case "image/jpeg": return ".jpg";
        case "image/png": return ".png";
        default: return "";
    }
}

function downloadOne(i) {
    const item = results[i];
    const format = document.getElementById("format").value;
    const ext = getExtension(format);
    
    // Đổi đuôi file cũ thành đuôi file mới
    let filename = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;
    filename += ext;

    const a = document.createElement("a");
    a.href = item.url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function downloadAll() {
    results.forEach((_, i) => {
        setTimeout(() => downloadOne(i), i * 200); // Delay tránh trình duyệt chặn popup tải hàng loạt
    });
}
</script>
</body>
</html>
