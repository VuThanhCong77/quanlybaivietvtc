<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đọc văn bản PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- THẺ CHIA SẺ -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Đọc file PDF">
  <meta property="og:description" content="Văn bản pdf">
  <meta property="og:url" content="https://vuthanhcong77.github.io/quanlybaivietvtc/vanban/doc_pdf.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/VuThanhCong77/quanlybaivietvtc/main/images/vuthanhcong.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- CSS -->
  <link rel="stylesheet" href="layout.css">

  <!-- Icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon180.png">
  <meta name="theme-color" content="#0a7f99">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
    }

    .toolbar {
      background: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
    }

    select {
      padding: 6px 10px;
      font-size: 14px;
    }

    .pdf-container {
      height: calc(100vh - 120px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .mobile-open {
      display: none;
      text-align: center;
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .mobile-open a {
      background: #b30000;
      color: #fff;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      display: inline-block;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #16b5e6;
      border-top: 1px solid #ec0a0a;
      font-size: 14px;
    }
/* Nút Thích trang – Copy – Lượt xem */
.action-bar {
  display: flex;
  justify-content: left;      /* căn giữa cả hàng */
  align-items: center;
  gap: 3px;                    /* khoảng cách giữa các nút */
  margin: 6px 3;
  flex-wrap: wrap;              /* mobile thì tự xuống dòng nếu chật */
}

/* đảm bảo các div con không chiếm cả dòng */
.action-bar > div {
  display: flex;
}

.main-content{
  padding-top: 15px;
}

.action-bar{
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 15px 0;
  flex-wrap: wrap;
}

.like-box button,
.share-btn{
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #d607a2;
  background: #14cec4;
  cursor: pointer;
}

.like-box button:hover,
.share-btn:hover{
  background: #20e007;
}

.view-box{
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid #0ea5a4;
  background: #e0f7f6;
  font-size: 14px;
}

  </style>
</head>

<body>

<div class="page-wrapper">

<header class="page-header">
  <button class="menu-btn" onclick="location.href='../index.html'">🏠</button>
  VĂN BẢN PDF
</header>

<div class="action-bar">
  <div class="like-box">
    <button id="likeBtn">👍 Thích: <b id="likeCount">0</b></button>
  </div>

  <button class="share-btn" onclick="copyLink(this)">🔗 Copy link</button>

  <div class="view-box">
    👁 Đã xem: <b id="viewCount">0</b>
  </div>
</div>

<div class="toolbar">
  Chọn văn bản:
  <select onchange="loadPDF(this.value)">
    <option value="vanban/pdf/nq08chuyendoixanh.pdf">Nghị quyết chuyển đổi xanh</option>
    <option value="vanban/pdf/xhcnhp.pdf">Nghị quyết xây dựng XHCN ở Hải Phòng</option>
    <option value="vanban/pdf/qd296tw.pdf">Quy định 296 TW</option>
    <option value="vanban/pdf/ytuonghay.pdf">Ý tưởng hay</option>
    <option value="vanban/pdf/Bi-mat-cua-mot-tri-nho-sieu-pham.pdf">Bí mật trí nhớ siêu phàm</option>
    <option value="vanban/pdf/Nhanto_Enzyme.pdf">Nhân tố Enzyme</option>
    <option value="vanban/pdf/nghiquyetdh14.pdf">Nghị quyết Đại hội XIV của Đảng</option>
    <option value="vanban/pdf/24 QD 2021 Thi hanh Dieu le Dang.pdf">Quy định thi hành Điều lệ Đảng</option>
    <option value="vanban/pdf/01 HD 2021 thi hanh dieu le Dang.pdf">Hướng dẫn thi hành Điều lệ Đảng</option>
    <option value="vanban/pdf/Nq Dai hoi Dang bo phuong lan 1.pdf">Nghị quyết Đại hội Đảng bộ phường lần I</option>
    <option value="vanban/pdf/Ct hanh cong thuc hien Nq Dh Dang bo phuong lan 1.pdf">Chương trình hành động</option>
    <option value="vanban/pdf/danhsachtrungcuphuong26.pdf">Danh sách đại biểu HĐND phường</option>
  </select>
</div>

<div class="mobile-open" id="mobileOpen">
  <a id="openPDF" target="_blank">👉 Mở PDF toàn màn hình</a>
</div>

<div class="pdf-container">
  <iframe id="pdfViewer"></iframe>
</div>

<footer>
  <p style="text-align:center">❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC</p>
</footer>
</div>

<script>
function isMobile(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function loadPDF(file){
  const viewer = document.getElementById("pdfViewer");
  const openBtn = document.getElementById("openPDF");

  const fullURL = "https://vuthanhcong77.github.io/quanlybaivietvtc/" + file;

  // Mobile dùng Google Docs Viewer
  if(isMobile()){
    viewer.src = "https://docs.google.com/gview?embedded=1&url=" + encodeURIComponent(fullURL);
  }else{
    viewer.src = fullURL;
  }

  openBtn.href = fullURL;
}

// Load file đầu tiên khi mở trang
window.addEventListener("DOMContentLoaded", function(){
  const firstFile = document.querySelector("select").value;
  loadPDF(firstFile);
});
</script>

<script>
// Copy link
function copyLink(btn){
  navigator.clipboard.writeText(window.location.href)
    .then(()=>{
      const oldText = btn.innerText;
      btn.innerText = "✅ Đã copy";
      setTimeout(()=>btn.innerText = oldText,1500);
    });
}
</script>

<script>
// Lượt xem
const VIEW_API = "https://script.google.com/macros/s/AKfycbxi8dkZZjOCRR6IcyVYA2qP0t9ce94UCdeV-xSMrWpqk87ebV-uBfIcTQmjycV_5R4bWw/exec";
const postId = "page_doc_pdf"; 
const viewCount = document.getElementById("viewCount");

async function updateViews(){
  if(!sessionStorage.getItem("viewed_"+postId)){
    const res = await fetch(VIEW_API + "?action=increment&postId=" + postId);
    const data = await res.json();
    viewCount.innerText = data.views;
    sessionStorage.setItem("viewed_"+postId,"true");
  }else{
    const res = await fetch(VIEW_API + "?postId=" + postId);
    const data = await res.json();
    viewCount.innerText = data.views;
  }
}
updateViews();
</script>

</body>
</html>
