/* Nút floating quay lại */
.floating-back{
    position:fixed;
    top:20px;
    right:20px;
    width:50px;
    height:50px;

    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#aeb107,#9a9c06);
    color:white;

    font-size:24px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 6px 18px rgba(0,0,0,0.25);

    z-index:9999;

    transition:all 0.3s ease;
}

/* Hover desktop */
.floating-back:hover{
    transform:translateY(-3px) scale(1.08);
    background:linear-gradient(135deg,#175fe4,#032a80);
}

/* Khi nhấn */

    transform:scale(0.92);
}

<script>
let data = [];

// Đọc file JSON
fetch("pdf-list.json")
.then(res => res.json())
.then(json => {
    data = json;
    renderTable(data);
    loadCategory();
});

// Hiển thị bảng
function renderTable(list){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    list.forEach((item, index) => {
        tbody.innerHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${item.category || ""}</td>
            <td>${item.name}</td>
            <td><a href="${item.file}" target="_blank">Mở</a></td>
        </tr>
        `;
    });
}

// Load danh sách phân loại
function loadCategory(){
    const select = document.getElementById("categoryFilter");
    let categories = [...new Set(data.map(x => x.category).filter(Boolean))];

    categories.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

// Lọc
document.getElementById("categoryFilter").addEventListener("change", filterData);
document.getElementById("searchBox").addEventListener("keyup", filterData);

function filterData(){
    const category = document.getElementById("categoryFilter").value.toLowerCase();
    const keyword = document.getElementById("searchBox").value.toLowerCase();

    let filtered = data.filter(item => {
        return (!category || (item.category || "").toLowerCase() == category)
            && item.name.toLowerCase().includes(keyword);
    });

    renderTable(filtered);
}
</script>

<script>
/* ==========
   THÍCH TRANG
   ==========*/
const API = "https://script.google.com/macros/s/AKfycbxjfwu2JFjKwji5SPaPk8ZPxkL5p3kuzdEWyUazHr9DDBTpT3rbqpTs4ddUcbiYwB_2/exec";
const likeBtn = document.getElementById("likeBtn");
const likeCount = document.getElementById("likeCount");

const pageName = "doc_pdf";   // tên trang

function loadLike() {
  fetch(API + "?action=get&page=" + pageName)
    .then(res => res.text())
    .then(data => {
      likeCount.innerText = data;
    });
}

loadLike();

likeBtn.addEventListener("click", function () {

  if (localStorage.getItem("liked_" + pageName)) {
    alert("Bạn đã đồng tình trước đó.");
    return;
  }

  fetch(API + "?action=like&page=" + pageName)
    .then(res => res.text())
    .then(data => {
      likeCount.innerText = data;
      localStorage.setItem("liked_" + pageName, "true");
    });
});
</script>

<script>
function copyLink(btn){
  navigator.clipboard.writeText(window.location.href)
    .then(()=>{
      const oldText = btn.innerText;
      btn.innerText = "✅ Đã copy";
      setTimeout(()=>btn.innerText = oldText, 1500);
    })
    .catch(()=>{
      alert("Không copy được link!");
    });
}
</script>

<script>
const VIEW_API = "https://script.google.com/macros/s/AKfycbxi8dkZZjOCRR6IcyVYA2qP0t9ce94UCdeV-xSMrWpqk87ebV-uBfIcTQmjycV_5R4bWw/exec";

const postId = "doc_pdf"; 

const viewCount = document.getElementById("viewCount");

async function updateViews(){
  try{
    if(!sessionStorage.getItem("viewed_" + postId)){
      const res = await fetch(VIEW_API + "?action=increment&postId=" + postId);
      const data = await res.json();
      viewCount.innerText = data.views;
      sessionStorage.setItem("viewed_" + postId, "true");
    }else{
      const res = await fetch(VIEW_API + "?postId=" + postId);
      const data = await res.json();
      viewCount.innerText = data.views;
    }
  }catch(err){
    console.log("Lỗi view:", err);
  }
}

updateViews();
</script>

<script>
const btn = document.getElementById("backToTop");

// Hiện nút khi cuộn xuống
window.addEventListener("scroll", function(){
  if (window.scrollY > 300) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
});

// Cuộn mượt lên đầu trang
btn.addEventListener("click", function(){
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>
