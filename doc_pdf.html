<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách văn bản</title>

<!-- THẺ CHIA SẺ -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Đọc file PDF">
  <meta property="og:description" content="Văn bản pdf">
  <meta property="og:url" content="https://vuthanhcong77.github.io/quanlybaivietvtc/vanban/doc_pdf.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/VuThanhCong77/quanlybaivietvtc/main/images/vuthanhcong.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- CSS -->
  <link rel="stylesheet" href="layout.css">

  <!-- Icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon180.png">
  <meta name="theme-color" content="#0a7f99">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<style>
body{
    font-family: Arial;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

.toolbar{
    margin-bottom:15px;
    text-align:center;
}

select, input{
    padding:6px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ccc;
    padding:8px;
    text-align:left;
}

th{
    background:#007bff;
    color:white;
}

tr:hover{
    background:#f1f1f1;
}

a{
    text-decoration:none;
    color:#007bff;
}
</style>
</head>

<body>

<div class="page-wrapper">

<header class="page-header">
  <button class="menu-btn" onclick="location.href='index.html'">🏠</button>
  VĂN BẢN PDF
</header>

<div class="toolbar">
    Phân loại:
    <select id="categoryFilter">
        <option value="">Tất cả</option>
    </select>

    Tìm kiếm:
    <input type="text" id="searchBox" placeholder="Nhập tên văn bản...">
</div>

<table>
    <thead>
        <tr>
            <th>STT</th>
            <th>Phân loại</th>
            <th>Tên văn bản</th>
            <th>Mở file</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<footer>
  <p style="text-align:center">❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC</p>
</footer>
</div>

<script>
let data = [];

// Đọc file JSON
fetch("pdf-list.json")
.then(res => res.json())
.then(json => {
    data = json;
    renderTable(data);
    loadCategory();
});

// Hiển thị bảng
function renderTable(list){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    list.forEach((item, index) => {
        tbody.innerHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${item.category || ""}</td>
            <td>${item.name}</td>
            <td><a href="${item.file}" target="_blank">Mở</a></td>
        </tr>
        `;
    });
}

// Load danh sách phân loại
function loadCategory(){
    const select = document.getElementById("categoryFilter");
    let categories = [...new Set(data.map(x => x.category).filter(Boolean))];

    categories.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

// Lọc
document.getElementById("categoryFilter").addEventListener("change", filterData);
document.getElementById("searchBox").addEventListener("keyup", filterData);

function filterData(){
    const category = document.getElementById("categoryFilter").value.toLowerCase();
    const keyword = document.getElementById("searchBox").value.toLowerCase();

    let filtered = data.filter(item => {
        return (!category || (item.category || "").toLowerCase() == category)
            && item.name.toLowerCase().includes(keyword);
    });

    renderTable(filtered);
}
</script>

</body>
</html>
