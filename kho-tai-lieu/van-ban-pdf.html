<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện khai thác văn bản PDF</title>

<link rel="icon" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon32.ico">
<link rel="icon" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/icons/icon192.ico">

<link rel="stylesheet" href="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/css/menu.css">

<style>
:root{
    --primary:#0099DA;
    --primary-dark:#0077aa;
    --bg:#f4f7fa;
    --card:#fff;
    --text:#23313d;
    --muted:#6b7780;
    --border:#dce5eb;
    --shadow:0 4px 18px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}
main{
    width:min(1500px,calc(100% - 24px));
    margin:18px auto 30px;
}
.toolbar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
}
.search-row{
    display:grid;
    grid-template-columns:minmax(220px,1fr) 220px auto auto;
    gap:10px;
}
input,select,button{
    min-height:42px;
    border:1px solid #cbd8e0;
    border-radius:7px;
    padding:9px 12px;
    font-size:15px;
}
input:focus,select:focus{outline:2px solid rgba(0,153,218,.18);border-color:var(--primary)}
button{
    cursor:pointer;
    border-color:var(--primary);
    background:var(--primary);
    color:#fff;
    font-weight:600;
}
button:hover{background:var(--primary-dark)}
button.secondary{background:#fff;color:var(--primary)}

.library{
    display:grid;
    grid-template-columns:330px minmax(0,1fr);
    gap:16px;
}
.list-panel,.viewer-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
}
.list-panel{
    max-height:78vh;
    overflow:auto;
    padding:10px;
}
.result-count{padding:8px 10px;color:var(--muted);font-size:13px}
.doc-item{
    width:100%;
    text-align:left;
    background:#fff;
    color:var(--text);
    border:1px solid transparent;
    border-bottom:1px solid var(--border);
    border-radius:8px;
    padding:12px 10px;
    margin:2px 0;
    cursor:pointer;
}
.doc-item:hover,.doc-item.active{
    background:#eef9fd;
    border-color:#b9e5f5;
}
.doc-title{font-weight:700;line-height:1.35}
.doc-meta{font-size:12px;color:var(--muted);margin-top:5px}
.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:20px;
    background:#e7f5fb;
    color:#00739f;
    font-size:11px;
    margin-right:4px;
}

.viewer-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
}
.viewer-title{font-weight:700}
.viewer-actions{display:flex;gap:7px;flex-wrap:wrap}
#pdf-frame{
    display:block;
    width:100%;
    height:72vh;
    min-height:520px;
    border:0;
    background:#fff;
    border-radius:0 0 12px 12px;
}

.empty{
    padding:30px 15px;
    text-align:center;
    color:var(--muted);
}

@media(max-width:900px){
    .library{grid-template-columns:1fr}
    .list-panel{max-height:360px}
    .search-row{grid-template-columns:1fr 1fr}
    #pdf-frame{height:68vh;min-height:460px}
}
@media(max-width:560px){
    main{width:calc(100% - 12px);margin-top:10px}
    .search-row{grid-template-columns:1fr}
    .viewer-head{align-items:flex-start;flex-direction:column}
    .viewer-actions{width:100%}
    .viewer-actions button{flex:1}
    #pdf-frame{height:70vh;min-height:420px}
}
</style>
</head>

<body>
<header>
    <div id="menu"></div>
</header>

<main>
    <section class="toolbar">
        <div class="search-row">
            <input id="keyword" type="search"
                   placeholder="🔎 Tìm theo tên văn bản, số hiệu, từ khóa...">
            <select id="category">
                <option value="">Tất cả phân loại</option>
            </select>
            <button id="btnSearch">Tìm kiếm</button>
            <button id="btnReset" class="secondary">Xóa lọc</button>
        </div> 
    </section>

    <section class="library">
        <aside class="list-panel">
            <div id="resultCount" class="result-count">Đang tải dữ liệu...</div>
            <div id="documentList"></div>
        </aside>

        <section class="viewer-panel">
            <div class="viewer-head">
                <div id="viewerTitle" class="viewer-title">Chưa chọn văn bản</div>
                <div class="viewer-actions">
                    <button id="btnOpen" class="secondary">↗ Mở PDF</button>
                </div>
            </div>

            <iframe id="pdf-frame" title="Trình đọc văn bản PDF"></iframe>
        </section>
    </section>
</main>

<script>
const JSON_URL = "van-ban-pdf.json";

const FALLBACK_DATA = [
    {title:"Lời bài hát Lưu Kỳ Hạ Long trên cạn", category:"Học tập, nghiên cứu", url:"https://vuthanhcong77.github.io/quanlybaivietvtc/bai-viet/chuyen-mon/pdf/Luu Ky Ha Long tren can.pdf"},
];

let documents = [];
let filteredDocuments = [];
let currentDocument = null;

const $ = id => document.getElementById(id);

async function loadComponent(id,file){
    try{
        const response = await fetch(file);
        if(!response.ok) throw new Error("Lỗi tải component: " + file);
        $(id).innerHTML = await response.text();
    }catch(error){ console.log(error); }
}

async function loadData(){
    try{
        const response = await fetch(JSON_URL + "?v=" + Date.now());
        if(!response.ok) throw new Error("Không tải được JSON");
        const data = await response.json();
        documents = Array.isArray(data) ? data : (data.documents || data.tai_lieu || []);
        if(!documents.length) throw new Error("JSON không có dữ liệu");
    }catch(error){
        console.warn(error);
        documents = FALLBACK_DATA;
    }

   // 1. Gọi hàm hiển thị danh sách của bạn (nếu có)
    if (typeof renderSidebar === 'function') {
        renderSidebar(documents);
    } else if (typeof displayList === 'function') {
        displayList(documents);
    }

    // 2. Tự động mở văn bản đầu tiên
    if (documents && documents.length > 0) {
        const firstDoc = documents[0];
        
        // Kiểm tra xem hàm xem PDF của bạn tên là gì để gọi đúng hàm đó:
        if (typeof openPDF === 'function') {
            openPDF(firstDoc);
        } else if (typeof viewPDF === 'function') {
            viewPDF(firstDoc.url || firstDoc);
        } else if (typeof showPDF === 'function') {
            showPDF(firstDoc.url || firstDoc);
        } else {
            // Nếu không tìm thấy hàm, gán trực tiếp vào iframe xem PDF (thay 'pdf-viewer' bằng ID iframe của bạn)
            const iframe = document.getElementById('pdf-viewer') || document.querySelector('iframe');
            if (iframe && firstDoc.url) {
                iframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(firstDoc.url)}&embedded=true`;
            }
        }
    }

    documents = documents.map((item,index)=>({
        id:item.id || ("pdf-" + (index+1)),
        title:item.title || item.name || "Văn bản chưa có tên",
        category:item.category || item.loai || "Chưa phân loại",
        number:item.number || item.so_hieu || "",
        date:item.date || item.ngay || "",
        description:item.description || item.desc || "",
        keywords:Array.isArray(item.keywords) ? item.keywords.join(" ") : (item.keywords || ""),
        url:item.url || item.pdf || item.file || ""
    })).filter(x=>x.url);

    buildCategories();
    searchDocuments();
}

function buildCategories(){
    const cats = [...new Set(documents.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"vi"));
    $("category").innerHTML = '<option value="">Tất cả phân loại</option>' +
        cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
}

function normalize(s){
    return String(s || "").toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/đ/g,"d");
}

function searchDocuments(){
    const keyword = normalize($("keyword").value.trim());
    const category = $("category").value;
    filteredDocuments = documents.filter(doc=>{
        const haystack = normalize([
            doc.title,doc.category,doc.number,doc.date,
            doc.description,doc.keywords
        ].join(" "));
        return (!keyword || haystack.includes(keyword)) &&
               (!category || doc.category === category);
    });
    renderList();
}

function renderList(){
    $("resultCount").textContent = `Tìm thấy ${filteredDocuments.length}/${documents.length} văn bản`;
    if(!filteredDocuments.length){
        $("documentList").innerHTML = '<div class="empty">Không tìm thấy văn bản phù hợp.</div>';
        return;
    }
    $("documentList").innerHTML = filteredDocuments.map(doc=>`
        <button class="doc-item ${currentDocument && currentDocument.id===doc.id ? "active":""}"
                onclick="selectDocument('${escapeJs(doc.id)}')">
            <div class="doc-title">${escapeHtml(doc.title)}</div>
            <div class="doc-meta">
                <span class="badge">${escapeHtml(doc.category)}</span>
                ${doc.number ? escapeHtml(doc.number) : ""}
                ${doc.date ? " · " + escapeHtml(doc.date) : ""}
            </div>
        </button>
    `).join("");
}

function selectDocument(id){
    currentDocument = documents.find(x=>x.id === id);
    if(!currentDocument) return;
    $("viewerTitle").textContent = currentDocument.title;
    $("pdf-frame").src = getGoogleViewerUrl(currentDocument.url);
    $("btnOpen").onclick = () => window.open(currentDocument.url,"_blank");
    renderList();
}

function getGoogleViewerUrl(url){
    return "https://docs.google.com/viewer?url=" +
           encodeURIComponent(url) + "&embedded=true";
}

function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
}
function escapeJs(s){
    return String(s ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

$("btnSearch").addEventListener("click",searchDocuments);
$("btnReset").addEventListener("click",()=>{
    $("keyword").value="";
    $("category").value="";
    searchDocuments();
});
$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter") searchDocuments();});
$("category").addEventListener("change",searchDocuments);

document.addEventListener("DOMContentLoaded",async()=>{
    await loadComponent("menu",
        "https://vuthanhcong77.github.io/quanlybaivietvtc/thanh-phan/menu.html");
    await loadData();
});
</script>

<script src="https://vuthanhcong77.github.io/quanlybaivietvtc/tai-nguyen/js/menu.js"></script>
</body>
</html>
