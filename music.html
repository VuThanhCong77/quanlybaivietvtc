<script>

/* =========================================================
   CẤU HÌNH GITHUB
========================================================= */

const GITHUB_OWNER =
    "VuThanhCong77";

const GITHUB_REPO =
    "quanlybaivietvtc";

const GITHUB_BRANCH =
    "main";

const AUDIO_FOLDER =
    "am-thanh";


/*
   API lấy danh sách file:

   https://api.github.com/repos/
   VuThanhCong77/
   quanlybaivietvtc/
   contents/am-thanh
*/

const API_URL =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/` +
    `${GITHUB_REPO}/` +
    `contents/${AUDIO_FOLDER}` +
    `?ref=${GITHUB_BRANCH}`;


/*
   URL MP3 trực tiếp trên GitHub Pages
*/

const AUDIO_BASE_URL =
    `https://${GITHUB_OWNER.toLowerCase()}.github.io/` +
    `${GITHUB_REPO}/` +
    `${AUDIO_FOLDER}/`;


/* =========================================================
   DOM
========================================================= */

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const volumeIcon =
    document.getElementById("volumeIcon");

const album =
    document.getElementById("album");

const songName =
    document.getElementById("songName");

const songList =
    document.getElementById("songList");

const search =
    document.getElementById("search");

const count =
    document.getElementById("count");

const status =
    document.getElementById("status");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const repeatBtn =
    document.getElementById("repeatBtn");


/* =========================================================
   BIẾN
========================================================= */

let songs = [];

let filteredSongs = [];

let currentIndex = 0;

let shuffle = false;

let repeat = false;


/* =========================================================
   CHUYỂN TÊN FILE
========================================================= */

function decodeFileName(name){

    try{

        return decodeURIComponent(name);

    }catch{

        return name;

    }

}


/* =========================================================
   BỎ ĐUÔI MP3
========================================================= */

function cleanName(name){

    return name
        .replace(/\.[^/.]+$/,"")
        .replace(/[_-]+/g," ")
        .trim();

}


/* =========================================================
   FORMAT THỜI GIAN
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "00:00";

    }


    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60);


    return (
        String(minutes).padStart(2,"0")
        + ":"
        +
        String(secondsPart).padStart(2,"0")
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TẢI DANH SÁCH MP3 TỪ GITHUB
========================================================= */

async function loadSongs(){

    try{

        status.textContent =
            "Đang kết nối GitHub...";


        const response =
            await fetch(
                API_URL,
                {
                    headers:{
                        "Accept":
                        "application/vnd.github+json"
                    },

                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Thư mục am-thanh không trả về danh sách file."
            );

        }


        /*
           Chỉ lấy file MP3
        */

        songs =
            data
            .filter(item => {

                return (
                    item.type === "file" &&
                    /\.mp3$/i.test(item.name)
                );

            })
            .map(item => {

                const fileName =
                    decodeFileName(
                        item.name
                    );


                return {

                    name:
                        cleanName(
                            fileName
                        ),

                    fileName:
                        fileName,

                    url:
                        AUDIO_BASE_URL +
                        encodeURIComponent(
                            fileName
                        )

                };

            });


        /*
           Sắp xếp theo tên
        */

        songs.sort(
            (a,b)=>
                a.name.localeCompare(
                    b.name,
                    "vi",
                    {
                        numeric:true
                    }
                )
        );


        filteredSongs =
            [...songs];


        count.textContent =
            songs.length +
            " bài";


        if(!songs.length){

            songName.textContent =
                "Chưa có file MP3";

            songList.innerHTML = `

                <div class="empty">

                    📂 Thư mục
                    <strong>am-thanh</strong>
                    chưa có file MP3.

                </div>

            `;

            status.textContent =
                "Không tìm thấy MP3.";

            return;

        }


        currentIndex = 0;


        renderPlaylist();


        loadSong();


        status.textContent =
            "✓ Đã tải " +
            songs.length +
            " bài hát";


    }catch(error){

        console.error(error);


        songName.textContent =
            "Không thể tải danh sách nhạc";


        songList.innerHTML = `

            <div class="error">

                ❌ Không thể tải danh sách MP3.

                <br><br>

                Kiểm tra:

                <br>

                • Repository có công khai không?

                <br>

                • Thư mục
                <strong>am-thanh</strong>
                có tồn tại không?

                <br>

                • File có đúng phần mở rộng
                <strong>.mp3</strong>
                không?

                <br><br>

                <button
                    onclick="loadSongs()"
                    style="
                        border:none;
                        padding:9px 15px;
                        border-radius:20px;
                        cursor:pointer;
                    "
                >
                    🔄 Thử lại
                </button>

            </div>

        `;


        count.textContent =
            "Lỗi";


        status.textContent =
            error.message;

    }

}


/* =========================================================
   HIỂN THỊ PLAYLIST
========================================================= */

function renderPlaylist(){

    songList.innerHTML = "";


    if(!filteredSongs.length){

        songList.innerHTML = `

            <div class="empty">

                Không tìm thấy bài hát phù hợp.

            </div>

        `;

        return;

    }


    filteredSongs.forEach(
        (song,index)=>{


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "song-item";


            /*
               Xác định bài hiện tại
            */

            const originalIndex =
                songs.indexOf(song);


            if(
                originalIndex ===
                currentIndex
            ){

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <div class="song-number">

                    ${index + 1}

                </div>

                <div class="song-icon">

                    🎵

                </div>

                <div class="song-title">

                    ${escapeHTML(
                        song.name
                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                ()=>{

                    currentIndex =
                        songs.indexOf(
                            song
                        );

                    loadSong();

                    playSong();

                }
            );


            songList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   NẠP BÀI HIỆN TẠI
========================================================= */

function loadSong(){

    if(!songs.length){

        return;

    }


    const song =
        songs[currentIndex];


    if(!song){

        return;

    }


    audio.src =
        song.url;


    songName.textContent =
        song.name;


    progress.value = 0;


    currentTime.textContent =
        "00:00";


    duration.textContent =
        "00:00";


    renderPlaylist();


    /*
       Cuộn đến bài hiện tại
    */

    setTimeout(
        scrollCurrentIntoView,
        100
    );

}


/* =========================================================
   CUỘN ĐẾN BÀI HIỆN TẠI
========================================================= */

function scrollCurrentIntoView(){

    const active =
        document.querySelector(
            ".song-item.active"
        );


    if(active){

        active.scrollIntoView({

            behavior:"smooth",

            block:"nearest"

        });

    }

}


/* =========================================================
   PHÁT
========================================================= */

function playSong(){

    if(!songs.length){

        return;

    }


    audio.play()
        .then(()=>{

            playBtn.textContent =
                "⏸";

            album.classList.add(
                "playing"
            );

        })
        .catch(error=>{

            console.log(
                "Không thể phát:",
                error
            );

        });

}


/* =========================================================
   DỪNG
========================================================= */

function pauseSong(){

    audio.pause();


    playBtn.textContent =
        "▶";


    album.classList.remove(
        "playing"
    );

}


/* =========================================================
   PHÁT / DỪNG
========================================================= */

playBtn.addEventListener(
    "click",
    ()=>{

        if(!songs.length){

            loadSongs();

            return;

        }


        if(audio.paused){

            playSong();

        }else{

            pauseSong();

        }

    }
);


/* =========================================================
   BÀI TIẾP THEO
========================================================= */

function nextSong(){

    if(!songs.length){

        return;

    }


    if(shuffle){

        if(songs.length === 1){

            currentIndex = 0;

        }else{

            let next;

            do{

                next =
                    Math.floor(
                        Math.random()
                        *
                        songs.length
                    );

            }while(
                next ===
                currentIndex
            );


            currentIndex =
                next;

        }

    }else{

        currentIndex++;


        if(
            currentIndex >=
            songs.length
        ){

            currentIndex = 0;

        }

    }


    loadSong();

    playSong();

}


/* =========================================================
   BÀI TRƯỚC
========================================================= */

function previousSong(){

    if(!songs.length){

        return;

    }


    /*
       Nếu đã nghe quá 3 giây
       thì quay lại đầu bài
    */

    if(audio.currentTime > 3){

        audio.currentTime = 0;

        return;

    }


    currentIndex--;


    if(currentIndex < 0){

        currentIndex =
            songs.length - 1;

    }


    loadSong();

    playSong();

}


nextBtn.addEventListener(
    "click",
    nextSong
);


prevBtn.addEventListener(
    "click",
    previousSong
);


/* =========================================================
   AUDIO TIMEUPDATE
========================================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration){

            return;

        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progress.value =
            percent;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================================
   TUA NHẠC
========================================================= */

progress.addEventListener(
    "input",
    ()=>{

        if(!audio.duration){

            return;

        }


        audio.currentTime =
            (
                progress.value /
                100
            ) *
            audio.duration;

    }
);


/* =========================================================
   ÂM LƯỢNG
========================================================= */

volume.addEventListener(
    "input",
    ()=>{

        audio.volume =
            Number(
                volume.value
            );


        updateVolumeIcon();

    }
);


function updateVolumeIcon(){

    const v =
        Number(
            volume.value
        );


    if(v === 0){

        volumeIcon.textContent =
            "🔇";

    }else if(v < .5){

        volumeIcon.textContent =
            "🔉";

    }else{

        volumeIcon.textContent =
            "🔊";

    }

}


/* =========================================================
   NGẪU NHIÊN
========================================================= */

shuffleBtn.addEventListener(
    "click",
    ()=>{

        shuffle =
            !shuffle;


        shuffleBtn.classList.toggle(
            "active",
            shuffle
        );

    }
);


/* =========================================================
   LẶP DANH SÁCH
========================================================= */

repeatBtn.addEventListener(
    "click",
    ()=>{

        repeat =
            !repeat;


        repeatBtn.classList.toggle(
            "active",
            repeat
        );


        if(repeat){

            repeatBtn.textContent =
                "🔁 Lặp bài";

        }else{

            repeatBtn.textContent =
                "🔁 Lặp danh sách";

        }

    }
);


/* =========================================================
   KHI BÀI HÁT KẾT THÚC
========================================================= */

audio.addEventListener(
    "ended",
    ()=>{

        /*
           Nếu bật lặp:
           phát lại chính bài hiện tại
        */

        if(repeat){

            audio.currentTime = 0;

            playSong();

            return;

        }


        /*
           Nếu không lặp:
           sang bài tiếp
        */

        nextSong();

    }
);


/* =========================================================
   TÌM KIẾM
========================================================= */

search.addEventListener(
    "input",
    ()=>{

        const keyword =
            search.value
                .trim()
                .toLowerCase();


        if(!keyword){

            filteredSongs =
                [...songs];

        }else{

            filteredSongs =
                songs.filter(
                    song =>
                        song.name
                            .toLowerCase()
                            .includes(
                                keyword
                            )
                );

        }


        renderPlaylist();

    }
);


/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        /*
           Space:
           Phát / Dừng
        */

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            playBtn.click();

        }


        /*
           Mũi tên phải:
           tua +5 giây
        */

        if(
            event.code === "ArrowRight"
        ){

            if(audio.duration){

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 5
                    );

            }

        }


        /*
           Mũi tên trái:
           tua -5 giây
        */

        if(
            event.code === "ArrowLeft"
        ){

            if(audio.duration){

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 5
                    );

            }

        }

    }
);


/* =========================================================
   KHI AUDIO PLAY
========================================================= */

audio.addEventListener(
    "play",
    ()=>{

        playBtn.textContent =
            "⏸";

        album.classList.add(
            "playing"
        );

    }
);


/* =========================================================
   KHI AUDIO PAUSE
========================================================= */

audio.addEventListener(
    "pause",
    ()=>{

        playBtn.textContent =
            "▶";

        album.classList.remove(
            "playing"
        );

    }
);


/* =========================================================
   XỬ LÝ LỖI AUDIO
========================================================= */

audio.addEventListener(
    "error",
    ()=>{

        status.textContent =
            "⚠ Không thể phát file: " +
            (
                songs[currentIndex]
                ?.name || ""
            );

    }
);


/* =========================================================
   KHỞI TẠO
========================================================= */

audio.volume = 1;

updateVolumeIcon();

loadSongs();

</script>

</body>
</html>
