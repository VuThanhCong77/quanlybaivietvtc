<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>⏰ Lịch công tác | Vũ Thành Công</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS DÙNG CHUNG -->
<link rel="stylesheet" href="layout.css">


<style>
body{
  font-family:Segoe UI,Tahoma;
  padding:20px;
  background: transparent;
}
.container{
  max-width:960px;
  margin:auto;
  background: rgba(255,255,255,0.92);
  padding:12px;
  border-radius:10px;
}

.hidden{display:none}
.title-wrap{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:4px; }
.title-wrap img{ height:42px; }
.title-text{ font-size:20px; font-weight:bold; color:#1a73e8; }
button{ padding:8px 16px; border:none; border-radius:6px; color:#fff; cursor:pointer; margin:2px;}
.add{background:#28a745}
.del{background:#dc3545}
.exp{background:#1a73e8}
.imp{background:#6c757d}
.logout{background:#ff9800; float:right}
.login-btn{background:#007bff}
table{ width:100%; border-collapse:collapse; margin-top:10px; }
th,td{ border:1px solid #ddd; padding:8px; text-align:left; }
th{ background:#1a73e8; color:#fff; }
.urgent{ background:#dc3545 !important; color:#fff; font-weight:bold; animation:pulse 1.5s infinite; }
.past{
    background:#FFD966 !important;   /* vàng kem */
    color:#6c757d;
}
.past td{
    color:#6c757d;
}

@keyframes pulse{ 0%{opacity:1} 50%{opacity:.7} 100%{opacity:1} }
#adminControls { border:1px dashed #ccc; padding:10px; margin-bottom:10px; border-radius:8px; background:#f9f9f9; }
.title-text{
  font-size:20px;
  font-weight:bold;
  color:#1a73e8;
  white-space: nowrap; /* ✅ Luôn giữ trên một hàng */
}

</style>
</head>

<body>

<div class="container">
    <div class="title-wrap">
        <img src="images/hoamai.jpg" alt="hoamai">
        <div class="title-text">LỊCH CÔNG TÁC</div>
        <img src="images/hoadao.jpg" alt="Icon">
    </div>

<div id="ngayHienTai"
     style="text-align:right;color:#b30000;font-weight:bold;margin-bottom:6px">
</div>

<div id="lich-am" style="font-weight:600;color:#8B0000;"></div>

    <div style="margin-bottom:10px;">
        <a href="index.html">🏠Trang chủ</a> |
             <button id="btnShowLogin" onclick="toggleLoginBox()" class="login-btn" style="float:right">🔐 Đăng nhập Quản trị</button>
        <button id="btnLogout" onclick="logout()" class="logout hidden">🚪 Đăng xuất</button>
    </div>

    <hr>

    <div id="loginBox" class="hidden" style="background:#eee; padding:15px; border-radius:8px; margin-bottom:15px;">
        <b>Đăng nhập dành cho Cán bộ/Quản trị:</b><br><br>
        <select id="role">
            <option value="admin">Quản trị</option>
            <option value="user">Cán bộ</option>
        </select>
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button onclick="login()" class="add">Xác nhận</button>
        <button onclick="toggleLoginBox()" style="background:#666">Hủy</button>
    </div>

    <div id="mainBox">
        <div id="userInfo" style="font-weight:bold; color:#1a73e8; margin-bottom:10px;"></div>

        <div id="adminControls" class="hidden">
            <input id="inpViec" placeholder="Nội dung công việc" style="width:60%; padding:5px;">
            <input type="datetime-local" id="inpGio" style="padding:5px;">
            <button onclick="themLich()" class="add">➕ Thêm</button>
            <br><br>
            <button onclick="xuat()" class="exp">💾 Sao lưu</button>
            <button onclick="fileIn.click()" class="imp">📂 Phục hồi</button>
            <input type="file" id="fileIn" hidden onchange="nhap(event)">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Nội dung</th>
                    <th>Trạng thái</th>
                    <th id="colHanhDong" class="hidden">Hành động</th>
                </tr>
            </thead>
            <tbody id="body"></tbody>
        </table>
    </div>
</div>

<audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby3UYBLatxtDhG3Qah1pMhLxPmLD_8Ak_c6kgQHCHRh85b8VbCWX9dRYybdLnuTNUdc6Q/exec";

const USERS = {
    admin: "Congkhuyen@",
    user: "Congkhuyen@"
};

let role = "view";
let data = [];

function toggleLoginBox(){
    loginBox.classList.toggle("hidden");
}

function login(){
    const r = document.getElementById("role").value; // ✅ đúng ID
    const p = document.getElementById("pass").value;

    if (USERS[r] !== p) {
        alert("Sai mật khẩu");
        return;
    }

    sessionStorage.setItem("ROLE", r);
    location.reload();
}

function init(){
   role = sessionStorage.getItem("ROLE") || "view"; // ← DÒNG BẮT BUỘC 
   userInfo.innerText = "Chế độ: " + (role === "view" ? "Xem" : role.toUpperCase());

    if(role === "admin" || role === "user"){
        adminControls.classList.remove("hidden");
        colHanhDong.classList.remove("hidden");
        btnLogout.classList.remove("hidden");
        btnShowLogin.classList.add("hidden");
    }
    if(role === "user"){
        document.querySelector(".imp").style.display = "none";
    }
  }

function render(){
    body.innerHTML = "";
    const now = new Date();
    let coCanhBao = false;

    data.sort((a,b)=> new Date(b.g) - new Date(a.g));

    data.forEach(i=>{
        const tg = new Date(i.g);
        const diff = (tg-now)/3600000;
let trangThai="Đang chờ", cls="";

if(diff < 0){
    trangThai = "Đã qua";
    cls = "past";             // 👈 gán class cho lịch đã qua
}
else if(diff <= 12){
    trangThai = "⚠️ Sắp diễn ra";
    cls = "urgent";
    coCanhBao = true;
}

        let row = `<tr class="${cls}">
            <td>${tg.toLocaleString("vi-VN")}</td>
            <td>${i.v}</td>
            <td>${trangThai}</td>`;

        if(role==="admin"){
            row+=`<td>
                <button class="exp" onclick="sua(${i.id})">✏️ Sửa</button>
                <button class="del" onclick="xoa(${i.id})">Xóa</button>
            </td>`;
        }else if(role==="user"){
            row+=`<td>-</td>`;
        }
        row+="</tr>";
        body.innerHTML+=row;
    });

    if(coCanhBao && role!=="view"){
        alertSound.play().catch(()=>{});
    }
function saveData(){
  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });
}
saveData();
}

function themLich(){
    if(!inpViec.value||!inpGio.value) return alert("Thiếu thông tin");
    data.push({id:Date.now(),v:inpViec.value,g:inpGio.value});
    inpViec.value=""; inpGio.value="";
    render();
}

function sua(id){
    const item = data.find(i=>i.id===id);
    if(!item) return;

    const v = prompt("Sửa nội dung:", item.v);
    if(v===null) return;

    const g = prompt("Sửa thời gian (YYYY-MM-DDTHH:MM):", item.g);
    if(g===null) return;

    item.v = v.trim();
    item.g = g;
    render();
}

function xoa(id){
    if(confirm("Xóa lịch này?")){
        data=data.filter(i=>i.id!==id);
        render();
    }
}

function xuat(){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)]));
    a.download="backup_lich.json";
    a.click();
}

function nhap(e){
    const r=new FileReader();
    r.onload=ev=>{
        data=JSON.parse(ev.target.result);
        render();
        alert("Phục hồi thành công");
    };
    r.readAsText(e.target.files[0]);
}
function logout(){
    if(confirm("Đăng xuất khỏi hệ thống?")){
        sessionStorage.clear();        // ← DÒNG BẮT BUỘC
        role = "view";                 // ← RESET TRẠNG THÁI
        location.replace(location.href); // ← LOAD SẠCH
    }
}

function hienNgayDayDu(){
    return new Date().toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

ngayHienTai.innerText=hienNgayDayDu();
init();
loadData();

function loadData(){
  fetch(API_URL)
    .then(res => res.json())
    .then(json => {
      data = json || [];
      render();
    })
    .catch(err => {
      alert("Không tải được dữ liệu lịch công tác");
      console.error(err);
    });
}
setInterval(render,60000);
</script>

<script>
var CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
var CHI = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];

function INT(d){return Math.floor(d);}

function jdFromDate(dd,mm,yy){
  var a=INT((14-mm)/12);
  var y=yy+4800-a;
  var m=mm+12*a-3;
  return dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
}

function getNewMoonDay(k,timeZone){
  var T=k/1236.85;
  var T2=T*T;
  var T3=T2*T;
  var dr=Math.PI/180;
  var Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  var Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  var F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C1-=0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(2*dr*Mpr);
  C1-=0.0004*Math.sin(3*dr*Mpr);
  C1+=0.0104*Math.sin(2*dr*F)-0.0051*Math.sin((M+Mpr)*dr);
  C1-=0.0074*Math.sin((M-Mpr)*dr)+0.0004*Math.sin((2*F+M)*dr);
  C1-=0.0004*Math.sin((2*F-M)*dr)-0.0006*Math.sin((2*F+Mpr)*dr);
  C1+=0.0010*Math.sin((2*F-Mpr)*dr)+0.0005*Math.sin((2*Mpr+M)*dr);
  var deltaT = T< -11 ? 0.001+0.000839*T+0.0002261*T2-0.00000845*T3 : -0.000278+0.000265*T+0.000262*T2;
  return INT(Jd1+C1-deltaT+0.5+timeZone/24);
}

function getSunLongitude(jdn,timeZone){
  var T=(jdn-2451545.5-timeZone/24)/36525;
  var T2=T*T;
  var dr=Math.PI/180;
  var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  var L0=280.46645+36000.76983*T+0.0003032*T2;
  var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL+=(0.019993-0.000101*T)*Math.sin(2*dr*M)+0.000290*Math.sin(3*dr*M);
  var L=L0+DL;
  L=L*dr;
  L=L-2*Math.PI*(INT(L/(2*Math.PI)));
  return INT(L/Math.PI*6);
}

function getLunarMonth11(yy,timeZone){
  var off=jdFromDate(31,12,yy)-2415021;
  var k=INT(off/29.530588853);
  var nm=getNewMoonDay(k,timeZone);
  var sunLong=getSunLongitude(nm,timeZone);
  if(sunLong>=9) nm=getNewMoonDay(k-1,timeZone);
  return nm;
}

function convertSolar2Lunar(dd,mm,yy,timeZone){
  var dayNumber=jdFromDate(dd,mm,yy);
  var k=INT((dayNumber-2415021)/29.530588853);
  var monthStart=getNewMoonDay(k+1,timeZone);
  if(monthStart>dayNumber) monthStart=getNewMoonDay(k,timeZone);
  var a11=getLunarMonth11(yy,timeZone);
  var b11=a11;
  var lunarYear;
  if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,timeZone);}
  else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,timeZone);}
  var lunarDay=dayNumber-monthStart+1;
  var diff=INT((monthStart-a11)/29);
  var lunarMonth=diff+11;
  if(lunarMonth>12) lunarMonth-=12;
  if(lunarMonth>=11&&diff<4) lunarYear--;
  var yearCanChi=CAN[(lunarYear+6)%10]+" "+CHI[(lunarYear+8)%12];
  return [lunarDay,lunarMonth,yearCanChi];
}

function updateLichAm(){
  var now=new Date();
  var l=convertSolar2Lunar(now.getDate(),now.getMonth()+1,now.getFullYear(),7);
  document.getElementById("lich-am").innerHTML=
    "Âm lịch: <b>Ngày "+l[0]+" tháng "+l[1]+" năm "+l[2]+"</b>";
}

window.addEventListener("load",updateLichAm);
</script>

</body>
</html>
