<!-- Favicon & PWA --> <link rel="icon" type="image/png" sizes="32x32" 
href="icons/icon32.png"> <link rel="icon" type="image/png" sizes="192x192"
href="icons/icon192.png"> <link rel="apple-touch-icon" sizes="180x180"
href="icons/icon180.png"> <link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0a7f99">

<style>
/* ===== MENU MOBILE (GIỮ NGUYÊN) ===== */
.menu-btn{
  background: transparent;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
}

.menu-overlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  visibility: hidden;
  z-index: 998;
  transition: .3s;
}
.menu-overlay.active{
  opacity: 1;
  visibility: visible;
}

.nav-menu{
  position: fixed;
  top: 0;
  left: -280px;
  width: 260px;
  height: 100%;
  background: #ffffff;
  box-shadow: 2px 0 10px rgba(0,0,0,.15);
  padding-top: 60px;
  z-index: 999;
  transition: .3s;
}
.nav-menu.active{ left: 0; }

.nav-item{ border-bottom: 1px solid #eee; }

.nav-link{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  color: #0a3a5a;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

/* MENU CẤP 2 */
.sub-menu{ display: none; background: #f5f9fb; }
.sub-menu a{
  display: block;
  padding: 10px 30px;
  font-size: 14px;
  color: #0a5c7a;
  text-decoration: none;
}
.nav-item.open > .sub-menu{ display: block; }

/* ===== RIÊNG TRANG SỨC KHỎE ===== */
.control-panel{
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid #cde7ef;
}

#search-input{
  padding: 6px 6px;
  border: 1px solid #0ab3c9;
  border-radius: 5px;
  font-size: 14px;
  width: 250px;
}

#stats-box{
  background-color: #0ab3c9;
  color: white;
  padding: 6px 6px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 14px;
}

.post-item{
  display: flex;
  gap: 20px;
  padding: 6px 6px;
  border-bottom: 1px solid #cde7ef;
}
.post-item:last-child{ border-bottom: none; }

.post-thumbnail{
  width: 130px;
  height: 110px;
  object-fit: cover;
  border-radius: 6px;
}

.post-item-content h3{
  margin: 0 0 5px 0;
  font-size: 20px;
}
.post-item-content h3 a{
  color: #0a3a5a;
  text-decoration: none;
}
.post-item-content h3 a:hover{ color: #0a7f99; }

.post-item-content small{
  color: #888;
  display: block;
  margin-bottom: 10px;
}
.post-item-content p{
  margin: 0;
  color: #555;
  text-align: justify;
}

@media (max-width: 991px){
  .post-list{ grid-template-columns: 1fr; }
}
@media (max-width: 768px){
  .control-panel{ flex-direction: column; align-items: stretch; }
  #search-input{ width: auto; }
  .post-item{ flex-direction: column; }
  .post-thumbnail{ width: 100%; height: auto; }
}

/* Floating Menu */
.floating-menu{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:9999;
}

/* Nút chính */
.main-float{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#1565c0,#0d47a1);
    color:#fff;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:.3s;
}

.main-float:hover{
    transform:scale(1.1);
}

/* Các nút phụ */
.sub-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:10px;

    opacity:0;
    transform:translateY(20px);
    pointer-events:none;

    transition:.35s ease;
}

/* Khi mở */
.sub-buttons.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

/* Nút con */
.sub-buttons button{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#e91e63;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:.3s;
}

.sub-buttons button:hover{
    transform:scale(1.1);
    background:#00acc1;
}

</style>
</head>

<body>

<!-- HEADER CHUẨN -->
<header class="page-header">
  
<h1 class="page-title suckhoe">
<a href="suckhoe.html">Sức khỏe - Trí tuệ - Hạnh phúc </a>
</h1>

  <a href="index.html"> 🏠</a>
  <button class="menu-btn" id="menuBtn">☰</button>
</header>

<div class="menu-overlay" id="menuOverlay"></div>

<nav class="nav-menu" id="navMenu">
  <div class="nav-item"><a class="nav-link" href="index.html">🏠 Trang chủ</a></div>
  <div class="nav-item"><a class="nav-link" href="gioithieu.html">🏛 Giới thiệu</a></div>
  <div class="nav-item"><a class="nav-link" href="suckhoe.html">❤️ Sức khỏe</a></div>
  <div class="nav-item"><a class="nav-link" href="baiviet.html">✍ Bài viết</a></div>
  <div class="nav-item"><a class="nav-link" href="tintuc.html">📢 Tin tức</a></div>
  <div class="nav-item"><a class="nav-link" href="anh.html">📷 Thư viện ảnh</a></div>
  <div class="nav-item">
    <div class="nav-link toggle">📄 Văn bản <span>▾</span></div>
    <div class="sub-menu">
      <a href="vanban/dieuledang.html">📕 Điều lệ Đảng</a>
      <a href="vanban/qd19_2026.html">📜 Quy định 19 QĐTW</a>
      <a href="vanban/qd20_2026.html">📜 Quy định 20 QĐTW</a>

<div class="page-wrapper">
<main class="main-content">
<div class="main-grid">
    <!-- CỘT TRÁI -->
<section class="content-left">

    <div class="control-panel">
    <input type="text" id="search-input" placeholder="Tìm kiếm theo tiêu đề sức khỏe...">
    <div id="stats-box">📊 Tổng cộng: <span id="post-count">0</span> bài</div>
  </div>

  <div id="list" class="post-list">
    <p style="text-align:center;">Đang tải bài viết...</p>
  </div>
 </section>
 <!-- CỘT PHẢI -->
    <aside class="content-right" id="sidebar-container"></aside>
  </div>
</main>
<footer>
  ❤️ SỨC KHỎE 🧠 TRÍ TUỆ 🌸 HẠNH PHÚC
</footer>
</div>

<script>
const listContainer=document.getElementById("list");
const searchInput=document.getElementById("search-input");
const postCountSpan=document.getElementById("post-count");
let allPosts=[];

fetch("posts_data.json")
.then(r=>r.json())
.then(data=>{
  allPosts=data.filter(p=>p.category==="suckhoe");
  allPosts.sort((a,b)=>new Date(b.date)-new Date(a.date));
  render(allPosts);
  postCountSpan.textContent=allPosts.length;
});

function render(posts){
  listContainer.innerHTML="";
  if(!posts.length){
    listContainer.innerHTML="<p style='text-align:center'>Không có dữ liệu.</p>";
    return;
  }
  posts.forEach(p=>{
    listContainer.innerHTML+=`
    <div class="post-item">
      ${p.thumbnail?`<img src="${p.thumbnail}" class="post-thumbnail">`:""}
      <div class="post-item-content">
        <h3><a href="post.html?id=${p.id}">${p.title}</a></h3>
        <small>${p.date}</small>
        <p>${p.shortDescription||p.content.substring(0,200)+"..."}</p>
      </div>
    </div>`;
  });
}

searchInput.addEventListener("input",()=>{
  const q=searchInput.value.toLowerCase();
  const f=allPosts.filter(p=>p.title.toLowerCase().includes(q));
  render(f);
  postCountSpan.textContent=f.length;
});

const menuBtn=document.getElementById("menuBtn");
const navMenu=document.getElementById("navMenu");
const menuOverlay=document.getElementById("menuOverlay");

menuBtn.onclick=()=>{
  navMenu.classList.add("active");
  menuOverlay.classList.add("active");
};
menuOverlay.onclick=()=>{
  navMenu.classList.remove("active");
  menuOverlay.classList.remove("active");
};

document.querySelectorAll(".toggle").forEach(t=>{
  t.onclick=()=>t.parentElement.classList.toggle("open");
});
</script>

<script>
fetch("sidebar.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("sidebar-container").innerHTML = data;
  });
</script>
<div class="floating-menu">

    <button class="main-float" onclick="toggleFloatMenu()">
        ☰
    </button>

    <div class="sub-buttons" id="subButtons">

        <button onclick="scrollToTop()" title="Lên đầu trang">
            ⬆
        </button>

        <button onclick="history.back()" title="Quay lại">
            ←
        </button>

    </div>
</div>

<script>
function toggleFloatMenu(){
    document.getElementById("subButtons").classList.toggle("show");
}

function scrollToTop(){
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
</script>
