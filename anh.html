<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📷 Thư viện ảnh | Vũ Thành Công</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS DÙNG CHUNG -->
  <link rel="stylesheet" href="layout.css">

<style>
/* ===============================
   MENU CHÍNH
   =============================== */
.nav-menu{
  position: fixed;
  top: calc(var(--header-height) + var(--sub-height));
  right: 12px;
  right: auto;

  width: 260px;

  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  padding: 10px 0;

  opacity: 0;
  pointer-events: none;
  transform: translateY(-10px);
  transition: all 0.25s ease;
  z-index: 1001;
}

.nav-menu.open{
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.nav-item{
  padding: 6px 16px;
}

.nav-link{
  display: block;
  color: #0a3a5a;
  text-decoration: none;
  font-size: 15px;
  cursor: pointer;
}

.nav-link:hover{
  color: var(--primary);
}

/* SUB MENU */
.sub-menu{
  display: none;
  padding-left: 16px;
}

.sub-menu.open{
  display: block;
}

/* ===============================
   OVERLAY
   =============================== */

.menu-overlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 1000;
}

.menu-overlay.show{
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

  <!-- ================= HEADER FIXED ================= -->
  <header class="page-header">
    <button class="menu-btn" aria-label="Mở menu">☰</button>

    <h1 class="page-title anh">
      <a href="anh.html">Thư viện ảnh</a>
    </h1>

    <a href="index.html" title="Trang chủ">🏠</a>
  </header>

  <!-- ================= SUB FIXED (ĐỂ TRỐNG CŨNG ĐƯỢC) ================= -->
  <div class="sub-fixed"></div>

  <!-- ================= OVERLAY + MENU ================= -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="nav-menu" id="navMenu">
    <div class="nav-item">
      <a class="nav-link" href="index.html">🏠 Trang chủ</a>
    </div>

    <div class="nav-item">
      <a class="nav-link" href="gioithieu.html">🏛 Giới thiệu</a>
    </div>

    <div class="nav-item">
      <div class="nav-link toggle">📄 Văn bản ▾</div>
      <div class="sub-menu">
        <a href="vanban.html">📖 Nội dung</a>
        <a href="vanban/qd69.html">📜 Quy định 69</a>
        <a href="vanban/dieuledang.html">📕 Điều lệ Đảng</a>
      </div>
    </div>

    <div class="nav-item">
      <a class="nav-link" href="baiviet.html">✍ Bài viết</a>
    </div>

    <div class="nav-item">
      <a class="nav-link" href="tintuc.html">📢 Tin tức</a>
    </div>

    <div class="nav-item">
      <a class="nav-link" href="suckhoe.html">❤️ Sức khỏe</a>
    </div>

    <div class="nav-item">
      <a class="nav-link" href="tailieu.html">📁 Tài liệu</a>
    </div>
  </nav>

  <!-- ================= KHUNG TRỤC CHUNG ================= -->
  <div class="page-wrapper">

  <main>
    <h2>Thư viện ảnh</h2>

    <!-- KHUNG SINH ẢNH TỰ ĐỘNG -->
    <section class="photo-grid" id="photoGrid"></section>
  </main>

  <footer>Trang thông tin hình ảnh</footer>

</div>

<!-- ================= SCRIPT SINH NỘI DUNG ================= -->
<script>
fetch('photos.json')
  .then(res => res.json())
  .then(data => {
    const grid = document.getElementById('photoGrid');

    data.forEach(item => {
      const article = document.createElement('article');
      article.className = 'photo-item';

      article.innerHTML = `
        <img src="${item.img}" alt="">
        <p class="photo-note">${item.note}</p>
      `;

      grid.appendChild(article);
    });
  });

<!-- ================= SCRIPT MENU ================= -->

const menuBtn = document.querySelector('.menu-btn');
const navMenu = document.getElementById('navMenu');
const overlay = document.getElementById('menuOverlay');

menuBtn.onclick = () => {
  navMenu.classList.toggle('open');
  overlay.classList.toggle('show');
};

overlay.onclick = () => {
  navMenu.classList.remove('open');
  overlay.classList.remove('show');
};
</script>

</body>
</html>
