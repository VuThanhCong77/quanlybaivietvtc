/* ===============================

   =============================== */
.nav-menu{
  position: fixed;
  top: calc(var(--header-height) + var(--sub-height));
  right: 12px;
  right: auto;

  width: 260px;

  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  padding: 10px 0;

  opacity: 0;
  pointer-events: none;
  transform: translateY(-10px);
  transition: all 0.25s ease;
  z-index: 1001;
}

.nav-menu.open{
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.nav-item{
  padding: 6px 16px;
}

.nav-link{
  display: block;
  color: #0a3a5a;
  text-decoration: none;
  font-size: 15px;
  cursor: pointer;
}

.nav-link:hover{
  color: var(--primary);
}

/* SUB MENU */
.sub-menu{
  display: none;
  padding-left: 16px;
}

.sub-menu.open{
  display: block;
}

/* ===============================
   OVERLAY
   =============================== */

.menu-overlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 999;
}

.menu-overlay.show{

}

.action-bar {

/* đảm bảo các div con không chiếm cả dòng */

<script>
fetch('photos.json')
  .then(res => res.json())
  .then(data => {
    const grid = document.getElementById('photoGrid');

    data.forEach(item => {
      const article = document.createElement('article');
      article.className = 'photo-item';

      article.innerHTML = `
        <img src="${item.img}" alt="">
        <p class="photo-note">${item.note}</p>
      `;

      grid.appendChild(article);
    });
  });

</script>

<script>
/* ===== MENU CHÍNH ===== */
const menuBtn = document.querySelector(".menu-btn");
const navMenu = document.getElementById("navMenu");
const overlay = document.getElementById("menuOverlay");

menuBtn.addEventListener("click", () => {
  navMenu.classList.toggle("open");
  overlay.classList.toggle("show");
});

overlay.addEventListener("click", () => {
  navMenu.classList.remove("open");
  overlay.classList.remove("show");
});

/* ===== MENU CẤP 2 ===== */
document.querySelectorAll(".nav-link.toggle").forEach(toggle => {
  toggle.addEventListener("click", function (e) {
    e.preventDefault(); // không nhảy trang
    const subMenu = this.nextElementSibling;
    subMenu.classList.toggle("open");
  });
});
</script>

<script>
/* ===============================
   THÍCH TRANG
   =============================== */
const API = "https://script.google.com/macros/s/AKfycbxjfwu2JFjKwji5SPaPk8ZPxkL5p3kuzdEWyUazHr9DDBTpT3rbqpTs4ddUcbiYwB_2/exec";
const likeBtn = document.getElementById("likeBtn");
const likeCount = document.getElementById("likeCount");

const pageName = "anh";   // tên trang

function loadLike() {
  fetch(API + "?action=get&page=" + pageName)
    .then(res => res.text())
    .then(data => {
      likeCount.innerText = data;
    });
}

loadLike();

likeBtn.addEventListener("click", function () {

  if (localStorage.getItem("liked_" + pageName)) {
    alert("Bạn đã đồng tình trước đó.");
    return;
  }

  fetch(API + "?action=like&page=" + pageName)
    .then(res => res.text())
    .then(data => {
      likeCount.innerText = data;
      localStorage.setItem("liked_" + pageName, "true");
    });
});
</script>

<script>
function copyLink(btn){
  navigator.clipboard.writeText(window.location.href)
    .then(()=>{
      const oldText = btn.innerText;
      btn.innerText = "✅ Đã copy";
      setTimeout(()=>btn.innerText = oldText, 1500);
    })
    .catch(()=>{
      alert("Không copy được link!");
    });
}
</script>

<script>
const btn = document.getElementById("backToTop");

// Hiện nút khi cuộn xuống
window.addEventListener("scroll", function(){
  if (window.scrollY > 300) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
});

// Cuộn mượt lên đầu trang
btn.addEventListener("click", function(){
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>

<script>
const VIEW_API = "https://script.google.com/macros/s/AKfycbxi8dkZZjOCRR6IcyVYA2qP0t9ce94UCdeV-xSMrWpqk87ebV-uBfIcTQmjycV_5R4bWw/exec";
const postId = "page_anh"; 
const viewCount = document.getElementById("viewCount");

async function updateViews(){
  try{
    // nếu chưa xem thì tăng view
    if(!sessionStorage.getItem("viewed_" + postId)){
      const res = await fetch(VIEW_API + "?action=addView&postId=" + postId);
      const data = await res.json();
      viewCount.innerText = data.views;
      sessionStorage.setItem("viewed_" + postId, "true");
    }else{
      // nếu đã xem thì chỉ lấy số view
      const res = await fetch(VIEW_API + "?action=getViews&postId=" + postId);
      const data = await res.json();
      viewCount.innerText = data.views;
    }
  }catch(err){
    console.log("Lỗi view:", err);
  }
}

updateViews();
</script>
