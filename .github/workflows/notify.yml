name: Notify New Post

on:
workflow_dispatch:

jobs:
notify:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Show Node
    run: |
      node -v
      npm -v

  - name: List files
    run: |
      pwd
      ls -la
      ls -la du-lieu || true
