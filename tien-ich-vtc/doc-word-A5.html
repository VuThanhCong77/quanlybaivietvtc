<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Trình đọc văn bản Word – Khổ A5</title>
<style>
  :root {
    --blue: #087eae;
    --blue2: #06557a;
    --bg: #e6ecf0;
    --toolbar-bg: #f8fafb;
    --border: #d6e0e6;
    --paper: #fffefa;
    --ink: #222b30;
    --muted: #5b6972;
    --font-size: 13.5pt;
  }

  body.theme-sepia {
    --bg: #dfd7c8;
    --paper: #f6efe0;
    --ink: #3b2f23;
  }

  body.theme-dark {
    --bg: #181c20;
    --toolbar-bg: #22272e;
    --border: #373e47;
    --paper: #262c34;
    --ink: #dce3ea;
    --muted: #9aa5b1;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background 0.25s, color 0.25s;
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    -webkit-tap-highlight-color: transparent;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Thu gọn thanh công cụ thành 1 hàng, kích thước tối thiểu, ưu tiên icon và tooltip */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    user-select: none;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .toolbar::-webkit-scrollbar {
    height: 6px;
  }
  .toolbar::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.1);
    border-radius: 3px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 700;
    font-size: 14px;
    color: var(--blue);
    white-space: nowrap;
    flex-shrink: 0;
  }
  body.theme-dark .brand {
    color: #58b8e6;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    flex: 1 1 auto;
    overflow-x: auto;
  }

  .btn-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0, 0, 0, 0.045);
    padding: 1px 4px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  body.theme-dark .btn-group {
    background: rgba(255, 255, 255, 0.07);
  }

  button,
  .file-label {
    border: 0;
    border-radius: 6px;
    padding: 5px 8px;
    background: var(--blue);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.15s, transform 0.1s;
    min-width: 32px;
    min-height: 32px;
    line-height: 1;
  }
  button:hover:not(:disabled),
  .file-label:hover {
    background: var(--blue2);
  }
  button:active:not(:disabled) {
    transform: scale(0.95);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.secondary {
    background: transparent;
    color: var(--ink);
    padding: 4px 7px;
    min-width: 28px;
    min-height: 28px;
  }
  button.secondary:hover:not(:disabled) {
    background: rgba(8, 126, 174, 0.12);
    color: var(--blue);
  }
  button.secondary.active {
    background: var(--blue);
    color: #fff;
  }

  .file-label input {
    display: none;
  }

  .page-jump {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
    flex-shrink: 0;
  }
  .page-jump input {
    width: 40px;
    padding: 3px 4px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
    font-size: 12px;
  }

  #filename {
    font-size: 12px;
    color: var(--muted);
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  /* Vùng đọc chiếm gần toàn bộ viewport, giảm khoảng trống, viền, bóng */
  #reader-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 4px 8px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Nút chuyển trang dạng phủ ở hai mép vùng đọc, không chiếm chiều ngang */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 22px;
    padding: 0;
    justify-content: center;
    flex: 0 0 auto;
    box-shadow: 0 4px 12px rgb(226, 18, 4);
    background: #ecdd0a;
    border: none;
    cursor: pointer;
    user-select: none;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 15;
  }
  .arrow:hover:not(:disabled) {
    opacity: 1;
  }
  .arrow:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  #left {
    left: 4px;
  }
  #right {
    right: 4px;
  }

  /* Trang A5 tự động co giãn lớn nhất theo chiều rộng và chiều cao, giữ tỷ lệ 148:210 */
  #page {
    width: 100%;
    max-width: calc(100vh * 0.704); /* 148/210 = 0.704 */
    max-height: 100vh;
    aspect-ratio: 148 / 210;
    background: var(--paper);
    box-shadow: none;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 3px;
    padding: 10mm 8mm 12mm;
    overflow: hidden;
    position: relative;
    transition: background 0.25s, border-color 0.25s;
    display: flex;
    flex-direction: column;
  }

  #page.drag-over {
    outline: 3px dashed var(--blue);
    outline-offset: -6px;
  }

  .a5-body {
    flex: 1 1 auto;
    overflow-y: auto;
    font-family: "Times New Roman", Times, serif;
    font-size: var(--font-size);
    line-height: 1.5;
    overflow-wrap: break-word;
    word-wrap: break-word;
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    padding-right: 4px;
  }

  .a5-body p {
    margin: 0 0 8pt;
    text-align: justify;
    text-indent: 1.8em;
  }
  .a5-body p.no-indent,
  .a5-body li p,
  .a5-body td p,
  .a5-body th p {
    text-indent: 0;
  }

  .a5-body h1,
  .a5-body h2,
  .a5-body h3,
  .a5-body h4 {
    font-family: "Times New Roman", Times, serif;
    line-height: 1.28;
    text-align: center;
    margin: 6pt 0 10pt;
    page-break-after: avoid;
  }
  .a5-body h1 {
    font-size: 1.35em;
    text-transform: uppercase;
  }
  .a5-body h2 {
    font-size: 1.2em;
  }
  .a5-body h3 {
    font-size: 1.08em;
  }

  .a5-body ul,
  .a5-body ol {
    margin: 0 0 8pt;
    padding-left: 1.6em;
  }
  .a5-body li {
    margin-bottom: 4pt;
    text-align: justify;
  }

  .a5-body img {
    max-width: 100%;
    max-height: 140mm;
    height: auto;
    display: block;
    margin: 6pt auto;
  }

  .a5-body table {
    border-collapse: collapse;
    width: 100%;
    max-width: 100%;
    font-size: 0.85em;
    margin: 6pt 0 10pt;
  }
  .a5-body td,
  .a5-body th {
    border: 1px solid #777;
    padding: 4px 6px;
    vertical-align: top;
  }

  #page-number {
    position: absolute;
    bottom: 6mm;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--muted);
    font: 11.5px "Times New Roman", serif;
    letter-spacing: 0.5px;
    user-select: none;
    pointer-events: none;
  }

  #status {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 4px 12px 8px;
    user-select: none;
    flex-shrink: 0;
  }

  #empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  #empty .big {
    font-size: 48px;
    margin-bottom: 12px;
  }
  #empty strong {
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  #empty p {
    text-align: center !important;
    text-indent: 0 !important;
    font-size: 13.5px;
    line-height: 1.5;
    max-width: 340px;
  }

  #print-container {
    display: none;
  }

  /* Nút toàn màn hình */
  #fullscreen-btn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    font-size: 20px;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: background 0.2s;
  }
  #fullscreen-btn:hover {
    background: var(--blue2);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .toolbar {
      justify-content: flex-start;
      padding: 6px 6px;
    }
    .brand {
      display: none;
    }
    #filename {
      max-width: 100px;
    }
  }

  @media (max-width: 640px) {
    #reader-wrap {
      gap: 4px;
      padding: 6px 2px 6px;
    }
    .arrow {
      width: 32px;
      height: 32px;
      font-size: 18px;
    }
    #page {
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 148 / 210;
      padding: 8mm 6mm 10mm;
    }
    :root {
      --font-size: 11.5pt;
    }
  }

  @media print {
    @page {
      size: A5 portrait;
      margin: 0;
    }
    body {
      background: #fff !important;
      color: #000 !important;
    }
    .toolbar,
    #reader-wrap,
    #status,
    #fullscreen-btn {
      display: none !important;
    }
    #print-container {
      display: block !important;
    }
    .print-page {
      width: 148mm;
      height: 210mm;
      padding: 13mm 11mm 15mm;
      position: relative;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
      background: #fff;
    }
    .print-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    .print-page-num {
      position: absolute;
      bottom: 6mm;
      left: 0;
      right: 0;
      text-align: center;
      font: 11pt "Times New Roman", serif;
      color: #444;
    }
  }
</style>
</head>
<body>

<div class="toolbar" role="toolbar" aria-label="Thanh công cụ điều khiển">
  <div class="brand" title="Trình đọc văn bản Word khổ A5" aria-hidden="true">📖</div>

  <div class="controls">
    <label class="file-label" title="Mở tệp Microsoft Word (.docx)" tabindex="0" role="button" aria-label="Mở tệp Word">
      📄
      <input id="file" type="file" accept=".docx" aria-describedby="filename" />
    </label>

    <div class="btn-group" title="Cỡ chữ" role="group" aria-label="Điều chỉnh cỡ chữ">
      <button id="font-dec" class="secondary" disabled aria-label="Giảm cỡ chữ" title="Giảm cỡ chữ">A-</button>
      <button id="font-inc" class="secondary" disabled aria-label="Tăng cỡ chữ" title="Tăng cỡ chữ">A+</button>
    </div>

    <div class="btn-group" title="Giao diện đọc" role="group" aria-label="Chọn giao diện đọc">
      <button class="secondary active" data-theme="light" aria-pressed="true" title="Giao diện sáng">S</button>
      <button class="secondary" data-theme="sepia" aria-pressed="false" title="Giao diện giấy cũ">G</button>
      <button class="secondary" data-theme="dark" aria-pressed="false" title="Giao diện tối">T</button>
    </div>

    <button id="print-btn" class="secondary" disabled title="In hoặc lưu thành PDF khổ A5" aria-label="In hoặc lưu PDF">🖨️</button>

    <button id="reset" class="secondary" disabled title="Về trang đầu (Home)" aria-label="Trang đầu">⏮</button>
    <button id="prev" class="secondary" disabled title="Trang trước (←)" aria-label="Trang trước">❮</button>

    <span class="page-jump" aria-label="Đi đến trang">
      <input id="page-input" type="number" min="1" value="1" disabled aria-label="Số trang hiện tại" />
      / <span id="total-pages" aria-live="polite" aria-atomic="true">0</span>
    </span>

    <button id="next" class="secondary" disabled title="Trang sau (→)" aria-label="Trang sau">❯</button>
  </div>

  <span id="filename" aria-live="polite" aria-atomic="true">Chưa chọn tệp</span>
</div>

<div id="reader-wrap">
  <button class="arrow" id="left" disabled aria-label="Trang trước" title="Trang trước">❮</button>
  <section id="page" aria-live="polite" aria-atomic="true" aria-label="Vùng đọc nội dung trang A5">
    <div id="page-content" class="a5-body" tabindex="0">
      <div id="empty" aria-hidden="false">
        <div class="big" aria-hidden="true">📖</div>
        <strong>Chọn hoặc kéo thả tệp Word (.docx) vào đây</strong>
        <p>Văn bản sẽ được tự động ngắt trang theo tỷ lệ khổ giấy A5 (148 × 210 mm). Dùng phím ← →, nút mũi tên hoặc vuốt màn hình để lật trang.</p>
      </div>
    </div>
    <div id="page-number" aria-hidden="true"></div>
  </section>
  <button class="arrow" id="right" disabled aria-label="Trang sau" title="Trang sau">❯</button>
</div>

<button id="fullscreen-btn" title="Chuyển sang toàn màn hình" aria-label="Toàn màn hình" aria-pressed="false">⛶</button>

<div id="status" role="status" aria-live="polite" aria-atomic="true">Hỗ trợ định dạng .docx • Xử lý trực tiếp trên trình duyệt</div>
<div id="print-container" aria-hidden="true"></div>

<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
(() => {
  const fileInput = document.getElementById('file');
  const pageBox = document.getElementById('page');
  const content = document.getElementById('page-content');
  const pageNumEl = document.getElementById('page-number');
  const pageInput = document.getElementById('page-input');
  const totalPagesEl = document.getElementById('total-pages');
  const statusEl = document.getElementById('status');
  const filenameEl = document.getElementById('filename');
  const printContainer = document.getElementById('print-container');
  const fullscreenBtn = document.getElementById('fullscreen-btn');

  const navButtons = ['prev', 'next', 'reset', 'left', 'right'].map(id => document.getElementById(id));
  const toolButtons = ['font-dec', 'font-inc', 'print-btn'].map(id => document.getElementById(id));

  let rawHtml = '';
  let currentFileName = '';
  let pages = [];
  let current = 0;
  let fontSizePt = window.innerWidth <= 640 ? 11.5 : 13.5;

  function setControlsEnabled(enabled) {
    [...navButtons, ...toolButtons].forEach(btn => btn.disabled = !enabled);
    pageInput.disabled = !enabled;
  }

  function saveProgress() {
    if (!currentFileName || !pages.length) return;
    try {
      localStorage.setItem('a5_reader_' + currentFileName, String(current));
    } catch (_) {}
  }

  function loadProgress(name) {
    try {
      const saved = parseInt(localStorage.getItem('a5_reader_' + name), 10);
      return Number.isFinite(saved) && saved >= 0 ? saved : 0;
    } catch (_) {
      return 0;
    }
  }

  function showPage(index = current) {
    if (!pages.length) return;
    current = Math.max(0, Math.min(pages.length - 1, index));
    content.innerHTML = pages[current];
    pageNumEl.textContent = `— ${current + 1} / ${pages.length} —`;
    pageInput.value = current + 1;
    pageInput.max = pages.length;
    totalPagesEl.textContent = pages.length;

    const atStart = current === 0;
    const atEnd = current === pages.length - 1;
    document.getElementById('prev').disabled = document.getElementById('left').disabled = atStart;
    document.getElementById('reset').disabled = atStart;
    document.getElementById('next').disabled = document.getElementById('right').disabled = atEnd;

    saveProgress();
  }

  function createProbe() {
    const rect = content.getBoundingClientRect();
    const cs = getComputedStyle(content);
    const probe = document.createElement('div');
    probe.className = 'a5-body';
    Object.assign(probe.style, {
      position: 'fixed',
      visibility: 'hidden',
      pointerEvents: 'none',
      left: '-99999px',
      top: '0',
      width: rect.width + 'px',
      height: rect.height + 'px',
      fontSize: cs.fontSize,
      lineHeight: cs.lineHeight,
      overflow: 'hidden'
    });
    document.body.appendChild(probe);
    return probe;
  }

  function splitOversizedParagraph(pNode, probe, maxH) {
    const words = pNode.textContent.split(/(\s+)/);
    const parts = [];
    let currentWords = [];
    let isFirstPart = true;

    const buildP = (text, first) => {
      const p = document.createElement('p');
      if (!first) p.className = 'no-indent';
      p.textContent = text;
      return p;
    };

    for (let i = 0; i < words.length; i++) {
      currentWords.push(words[i]);
      probe.innerHTML = '';
      const testP = buildP(currentWords.join(''), isFirstPart);
      probe.appendChild(testP);

      if (probe.scrollHeight > maxH && currentWords.length > 1) {
        const overflowWord = currentWords.pop();
        parts.push(buildP(currentWords.join('').trimEnd(), isFirstPart));
        currentWords = [overflowWord.trimStart()];
        isFirstPart = false;
      }
    }
    if (currentWords.join('').trim()) {
      parts.push(buildP(currentWords.join(''), isFirstPart));
    }
    return parts;
  }

  function paginateHtml(html) {
    const source = document.createElement('div');
    source.innerHTML = html;

    source.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.querySelector('img, table')) p.remove();
    });

    const probe = createProbe();
    const maxH = probe.clientHeight;
    const result = [];
    let pageContainer = document.createElement('div');

    const flushPage = () => {
      if (pageContainer.childNodes.length > 0) {
        result.push(pageContainer.innerHTML);
        pageContainer = document.createElement('div');
      }
    };

    const rawNodes = Array.from(source.childNodes).filter(n =>
      n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim())
    );

    const queue = [];
    for (const node of rawNodes) {
      if (node.nodeType === 3) {
        const p = document.createElement('p');
        p.textContent = node.textContent;
        queue.push(p);
        continue;
      }
      probe.innerHTML = '';
      probe.appendChild(node.cloneNode(true));
      if (probe.scrollHeight > maxH && node.tagName === 'P' && !node.querySelector('img, table')) {
        queue.push(...splitOversizedParagraph(node, probe, maxH));
      } else {
        queue.push(node);
      }
    }

    for (const node of queue) {
      const clone = node.cloneNode(true);
      probe.innerHTML = pageContainer.innerHTML;
      probe.appendChild(clone);

      if (probe.scrollHeight > maxH && pageContainer.childNodes.length > 0) {
        flushPage();
        probe.innerHTML = '';
        probe.appendChild(clone.cloneNode(true));
      }
      pageContainer.appendChild(clone);
    }

    flushPage();
    document.body.removeChild(probe);
    return result.length ? result : ['<p class="no-indent">Tệp không có nội dung văn bản để hiển thị.</p>'];
  }

  function repaginate(keepRatio = true) {
    if (!rawHtml) return;
    const ratio = pages.length > 1 ? current / (pages.length - 1) : 0;
    pages = paginateHtml(rawHtml);
    const targetIndex = keepRatio ? Math.round(ratio * (pages.length - 1)) : 0;
    showPage(targetIndex);
  }

  async function processFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.docx')) {
      statusEl.textContent = '⚠️ Vui lòng chọn tệp định dạng .docx (Word 2007 trở lên).';
      return;
    }

    currentFileName = file.name;
    filenameEl.textContent = file.name;
    filenameEl.title = file.name;
    statusEl.textContent = '⏳ Đang phân tích và dàn trang văn bản...';

    if (!window.mammoth) {
      statusEl.textContent = '❌ Không tải được thư viện đọc Word. Vui lòng kiểm tra kết nối mạng.';
      return;
    }

    try {
      const buffer = await file.arrayBuffer();
      const converted = await mammoth.convertToHtml({ arrayBuffer: buffer });
      rawHtml = converted.value;
      pages = paginateHtml(rawHtml);
      setControlsEnabled(true);

      const savedPage = loadProgress(currentFileName);
      showPage(savedPage < pages.length ? savedPage : 0);

      statusEl.textContent = `✅ Đã mở "${file.name}" (${pages.length} trang A5).` +
        (savedPage > 0 && savedPage < pages.length ? ` Đã khôi phục vị trí trang ${savedPage + 1}.` : '');
    } catch (err) {
      console.error(err);
      statusEl.textContent = '❌ Tệp bị lỗi hoặc không đúng chuẩn .docx.';
    }
  }

  fileInput.addEventListener('change', e => processFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt => {
    pageBox.addEventListener(evt, e => {
      e.preventDefault();
      pageBox.classList.add('drag-over');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    pageBox.addEventListener(evt, e => {
      e.preventDefault();
      pageBox.classList.remove('drag-over');
    });
  });
  pageBox.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  const go = delta => showPage(current + delta);
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('left').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.getElementById('right').onclick = () => go(1);
  document.getElementById('reset').onclick = () => showPage(0);

  pageInput.addEventListener('change', () => {
    const val = parseInt(pageInput.value, 10);
    if (Number.isFinite(val)) showPage(val - 1);
  });

  document.addEventListener('keydown', e => {
    if (document.activeElement === pageInput) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'Home') showPage(0);
    if (e.key === 'End' && pages.length) showPage(pages.length - 1);
  });

  let touchStartX = 0;
  pageBox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  pageBox.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 45) go(diff < 0 ? 1 : -1);
  }, { passive: true });

  function updateFontSize(delta) {
    fontSizePt = Math.max(9.5, Math.min(18, +(fontSizePt + delta).toFixed(1)));
    document.documentElement.style.setProperty('--font-size', fontSizePt + 'pt');
    repaginate(true);
  }
  document.getElementById('font-dec').onclick = () => updateFontSize(-0.5);
  document.getElementById('font-inc').onclick = () => updateFontSize(0.5);

  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('[data-theme]').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      document.body.className = btn.dataset.theme === 'light' ? '' : 'theme-' + btn.dataset.theme;
    };
  });

  document.getElementById('print-btn').onclick = () => {
    if (!pages.length) return;
    printContainer.innerHTML = pages.map((html, idx) => `
      <div class="print-page">
        <div class="a5-body">${html}</div>
        <div class="print-page-num">— ${idx + 1} / ${pages.length} —</div>
      </div>
    `).join('');
    window.print();
  };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => repaginate(true), 220);
  });

  // Toàn màn hình toggle
  fullscreenBtn.onclick = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => {
        fullscreenBtn.setAttribute('aria-pressed', 'true');
        fullscreenBtn.title = 'Thoát toàn màn hình';
      }).catch(() => {});
    } else {
      document.exitFullscreen().then(() => {
        fullscreenBtn.setAttribute('aria-pressed', 'false');
        fullscreenBtn.title = 'Chuyển sang toàn màn hình';
      }).catch(() => {});
    }
  };
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      fullscreenBtn.setAttribute('aria-pressed', 'false');
      fullscreenBtn.title = 'Chuyển sang toàn màn hình';
    } else {
      fullscreenBtn.setAttribute('aria-pressed', 'true');
      fullscreenBtn.title = 'Thoát toàn màn hình';
    }
  });

  // Tự ẩn hoặc thu gọn thanh công cụ khi không dùng (5s)
  let toolbar = document.querySelector('.toolbar');
  let hideTimeout;
  function showToolbar() {
    toolbar.style.opacity = '1';
    toolbar.style.pointerEvents = 'auto';
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      toolbar.style.opacity = '0.15';
      toolbar.style.pointerEvents = 'none';
    }, 5000);
  }
  document.body.addEventListener('mousemove', showToolbar);
  document.body.addEventListener('touchstart', showToolbar);
  showToolbar();

})();
</script>
</body>
</html>
