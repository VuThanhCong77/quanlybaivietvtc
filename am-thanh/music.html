<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trình phát nhạc MP3</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#0a7f99,#063b4a);
    color:#fff;
    min-height:100vh;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

/* =========================
   TIÊU ĐỀ
========================= */

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0 0 8px;
    font-size:30px;
}

.header p{
    margin:0;
    opacity:.8;
}

/* =========================
   TRÌNH PHÁT
========================= */

.player{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.album{
    width:180px;
    height:180px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,#0ab3c9,#0a7f99);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.album.playing{
    animation:xoay 8s linear infinite;
}

@keyframes xoay{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.song-name{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   TIẾN TRÌNH
========================= */

.progress-area{
    margin:15px 0;
}

.progress{
    width:100%;
    cursor:pointer;
}

.time{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    opacity:.8;
    margin-top:5px;
}

/* =========================
   NÚT ĐIỀU KHIỂN
========================= */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:25px 0;
}

.control-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

.control-btn:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,.3);
}

.play-btn{
    width:70px;
    height:70px;
    font-size:30px;
    background:#fff;
    color:#087f98;
}

.play-btn:hover{
    background:#f0f0f0;
}

/* =========================
   ÂM LƯỢNG
========================= */

.volume{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:300px;
    margin:auto;
}

.volume input{
    flex:1;
}

/* =========================
   CHỨC NĂNG
========================= */

.options{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.option-btn{
    border:none;
    padding:9px 15px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    color:#fff;
    cursor:pointer;
}

.option-btn.active{
    background:#fff;
    color:#087f98;
}

/* =========================
   DANH SÁCH NHẠC
========================= */

.playlist{
    margin-top:25px;
    background:rgba(0,0,0,.15);
    border-radius:18px;
    padding:15px;
}

.playlist-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.playlist-header h2{
    margin:0;
    font-size:18px;
}

.file-btn{
    background:#fff;
    color:#087f98;
    border:none;
    padding:8px 14px;
    border-radius:18px;
    cursor:pointer;
    font-weight:bold;
}

.song-list{
    max-height:400px;
    overflow-y:auto;
}

.song-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.song-item:hover{
    background:rgba(255,255,255,.1);
}

.song-item.active{
    background:rgba(255,255,255,.2);
}

.song-number{
    width:30px;
    text-align:center;
    opacity:.7;
}

.song-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    text-align:center;
    padding:25px;
    opacity:.7;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:15px 10px;
    }

    .player{
        padding:20px 15px;
    }

    .album{
        width:140px;
        height:140px;
        font-size:55px;
    }

    .song-name{
        font-size:18px;
    }

    .control-btn{
        width:44px;
        height:44px;
    }

    .play-btn{
        width:64px;
        height:64px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎵 TRÌNH PHÁT NHẠC</h1>
        <p>Những bản nhạc về cuộc sống của tôi</p>
    </div>

    <div class="player">

        <div id="album" class="album">
            🎵
        </div>

        <div id="songName" class="song-name">
            Chưa chọn bài hát
        </div>

        <div class="progress-area">

            <input
                type="range"
                id="progress"
                class="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="time">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>

        </div>

        <div class="controls">

            <button
                class="control-btn"
                id="prevBtn"
                title="Bài trước">
                ⏮
            </button>

            <button
                class="control-btn play-btn"
                id="playBtn"
                title="Phát / Dừng">
                ▶
            </button>

            <button
                class="control-btn"
                id="nextBtn"
                title="Bài tiếp">
                ⏭
            </button>

        </div>

        <div class="volume">

            <span id="volumeIcon">🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

        <div class="options">

            <button
                class="option-btn"
                id="shuffleBtn">
                🔀 Ngẫu nhiên
            </button>

            <button
                class="option-btn"
                id="repeatBtn">
                🔁 Lặp danh sách
            </button>

        </div>

    </div>


    <div class="playlist">

        <div class="playlist-header">

            <h2>📀 Danh sách bài hát</h2>

            <label class="file-btn">
                + Thêm MP3
                <input
                    type="file"
                    id="fileInput"
                    accept="audio/mpeg,audio/mp3,audio/*"
                    multiple
                    hidden
                >
            </label>

        </div>

        <div id="songList" class="song-list">

            <div class="empty">
                Chưa có bài hát.
                <br>
                Hãy chọn các file MP3 để bắt đầu.
            </div>

        </div>

    </div>

</div>


<audio id="audio"></audio>


<script>

/* =========================================================
   TRÌNH PHÁT NHẠC MP3
========================================================= */

const audio = document.getElementById("audio");

const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progress = document.getElementById("progress");

const currentTimeEl =
    document.getElementById("currentTime");

const durationEl =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const volumeIcon =
    document.getElementById("volumeIcon");

const songName =
    document.getElementById("songName");

const songList =
    document.getElementById("songList");

const album =
    document.getElementById("album");

const fileInput =
    document.getElementById("fileInput");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const repeatBtn =
    document.getElementById("repeatBtn");


/* =========================================================
   DỮ LIỆU
========================================================= */

let songs = [];

let currentIndex = 0;

let isShuffle = false;

let isRepeat = false;


/* =========================================================
   ĐỊNH DẠNG THỜI GIAN
========================================================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2,"0")
        + ":" +
        String(secs).padStart(2,"0")
    );
}


/* =========================================================
   HIỂN THỊ DANH SÁCH
========================================================= */

function renderPlaylist(){

    songList.innerHTML = "";

    if(songs.length === 0){

        songList.innerHTML = `
            <div class="empty">
                Chưa có bài hát.
                <br>
                Hãy chọn các file MP3 để bắt đầu.
            </div>
        `;

        return;
    }


    songs.forEach((song,index)=>{

        const item =
            document.createElement("div");

        item.className =
            "song-item";

        if(index === currentIndex){
            item.classList.add("active");
        }


        item.innerHTML = `

            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-title">
                ${escapeHTML(song.name)}
            </div>

            <div>
                🎵
            </div>

        `;


        item.addEventListener(
            "click",
            ()=>{

                currentIndex = index;

                loadSong();

                playSong();

            }
        );


        songList.appendChild(item);

    });

}


/* =========================================================
   CHỐNG HTML INJECTION
========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   NẠP BÀI HÁT
========================================================= */

function loadSong(){

    if(!songs.length){

        songName.textContent =
            "Chưa chọn bài hát";

        return;

    }


    const song =
        songs[currentIndex];


    audio.src =
        song.url;


    songName.textContent =
        song.name;


    progress.value = 0;

    currentTimeEl.textContent =
        "00:00";

    durationEl.textContent =
        "00:00";


    renderPlaylist();

}


/* =========================================================
   PHÁT NHẠC
========================================================= */

function playSong(){

    if(!songs.length){
        return;
    }


    audio.play()
        .then(()=>{

            playBtn.textContent =
                "⏸";

            album.classList.add(
                "playing"
            );

        })
        .catch(error=>{

            console.log(
                "Không thể phát:",
                error
            );

        });

}


/* =========================================================
   DỪNG NHẠC
========================================================= */

function pauseSong(){

    audio.pause();

    playBtn.textContent =
        "▶";

    album.classList.remove(
        "playing"
    );

}


/* =========================================================
   NÚT PHÁT / DỪNG
========================================================= */

playBtn.addEventListener(
    "click",
    ()=>{

        if(!songs.length){

            fileInput.click();

            return;

        }


        if(audio.paused){

            playSong();

        }else{

            pauseSong();

        }

    }
);


/* =========================================================
   BÀI TIẾP
========================================================= */

function nextSong(){

    if(!songs.length){
        return;
    }


    if(isShuffle){

        let newIndex;

        do{

            newIndex =
                Math.floor(
                    Math.random()
                    * songs.length
                );

        }while(
            songs.length > 1 &&
            newIndex === currentIndex
        );


        currentIndex =
            newIndex;

    }else{

        currentIndex++;

        if(currentIndex >= songs.length){

            currentIndex = 0;

        }

    }


    loadSong();

    playSong();

}


nextBtn.addEventListener(
    "click",
    nextSong
);


/* =========================================================
   BÀI TRƯỚC
========================================================= */

prevBtn.addEventListener(
    "click",
    ()=>{

        if(!songs.length){
            return;
        }


        currentIndex--;


        if(currentIndex < 0){

            currentIndex =
                songs.length - 1;

        }


        loadSong();

        playSong();

    }
);


/* =========================================================
   CẬP NHẬT TIẾN TRÌNH
========================================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration){
            return;
        }


        const percent =
            (audio.currentTime /
            audio.duration) * 100;


        progress.value =
            percent;


        currentTimeEl.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   KHI AUDIO ĐÃ CÓ THỜI LƯỢNG
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        durationEl.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================================
   TUA NHẠC
========================================================= */

progress.addEventListener(
    "input",
    ()=>{

        if(!audio.duration){
            return;
        }


        audio.currentTime =
            (progress.value / 100)
            * audio.duration;

    }
);


/* =========================================================
   ÂM LƯỢNG
========================================================= */

volume.addEventListener(
    "input",
    ()=>{

        audio.volume =
            volume.value;


        updateVolumeIcon();

    }
);


function updateVolumeIcon(){

    if(audio.volume === 0){

        volumeIcon.textContent =
            "🔇";

    }else if(audio.volume < 0.5){

        volumeIcon.textContent =
            "🔉";

    }else{

        volumeIcon.textContent =
            "🔊";

    }

}


/* =========================================================
   NGẪU NHIÊN
========================================================= */

shuffleBtn.addEventListener(
    "click",
    ()=>{

        isShuffle =
            !isShuffle;


        shuffleBtn.classList.toggle(
            "active",
            isShuffle
        );

    }
);


/* =========================================================
   LẶP DANH SÁCH
========================================================= */

repeatBtn.addEventListener(
    "click",
    ()=>{

        isRepeat =
            !isRepeat;


        repeatBtn.classList.toggle(
            "active",
            isRepeat
        );

    }
);


/* =========================================================
   BÀI HÁT KẾT THÚC
========================================================= */

audio.addEventListener(
    "ended",
    ()=>{

        if(isRepeat){

            audio.currentTime = 0;

            playSong();

            return;

        }


        nextSong();

    }
);


/* =========================================================
   CHỌN FILE MP3
========================================================= */

fileInput.addEventListener(
    "change",
    event=>{

        const files =
            Array.from(
                event.target.files
            );


        if(!files.length){
            return;
        }


        files.forEach(file=>{

            const url =
                URL.createObjectURL(file);


            songs.push({

                name:
                    file.name
                    .replace(
                        /\.mp3$/i,
                        ""
                    ),

                url:url

            });

        });


        if(songs.length === files.length){

            currentIndex = 0;

            loadSong();

        }


        renderPlaylist();


        fileInput.value = "";

    }
);


/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            playBtn.click();

        }


        if(event.code === "ArrowRight"){

            if(audio.duration){

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 5
                    );

            }

        }


        if(event.code === "ArrowLeft"){

            if(audio.duration){

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 5
                    );

            }

        }

    }
);


/* =========================================================
   KHỞI TẠO
========================================================= */

audio.volume = 1;

updateVolumeIcon();

renderPlaylist();

</script>

</body>
</html>
