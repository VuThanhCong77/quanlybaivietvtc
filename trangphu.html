<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh mục nội dung</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}

/* TAB */
.tabs{
    display:flex;
    flex-wrap:wrap;
    background:#50a9e9cb;
    border-bottom:2px solid #e9f154;
    position:sticky;
    top:0;
    z-index:100;
}

.tab{
    flex:1;
    min-width:60px;
    text-align:center;
    padding:12px 8px;
    cursor:pointer;
    font-weight:bold;
    color:#333;
    font-size:18px;
    transition:0.2s;
}

.tab.active{
    background:#d4eb6f;
    color:#fff;
}

/* CONTENT */
.tab-content{
    display:none;
    max-width:1500px;
    margin:auto;
    padding:10px;
}

.tab-content.active{
    display:block;
}

/* CARD */
.card{
    display:flex;
    background:#fff;
    margin-bottom:12px;
    border-radius:10px;
    overflow:hidden;
    transition:0.2s;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.card:hover{
    transform:translateY(-2px);
}

/* IMAGE */
.card img{
    width:90px;
    height:90px;
    object-fit:cover;
    flex-shrink:0;
    padding:8px;
}

/* CONTENT */
.card-content{
    padding:10px;
    flex:1;
}

.card-title{
    font-weight:bold;
    margin-bottom:8px;
    line-height:1.4;
}

.card-title a{
    text-decoration:none;
    color:#0066cc;
}

.card-desc{
    font-size:14px;
    color:#555;
    text-align:justify;
    line-height:1.6;
}

/* IFRAME */
iframe{
    width:100%;
    min-height:100vh;
    border:none;
}

/* MOBILE */
@media (max-width:768px){

    .tabs{
        overflow-x:auto;
        white-space:nowrap;
    }

    .tab{
        flex:none;
        min-width:70px;
        font-size:16px;
        padding:10px;
    }

    .card{
        flex-direction:column;
    }

    .card img{
        width:100%;
        height:180px;
        padding:0;
    }

    .card-content{
        padding:12px;
    }

    .card-title{
        font-size:16px;
    }

    .card-desc{
        font-size:15px;
        text-indent:0;
    }

    iframe{
        min-height:85vh;
    }
}

</style>
</head>

<body>

<!-- TAB -->
<div class="tabs">
    <div class="tab active" onclick="showTab(0)"title="Sức khỏe">❤️ Sức khỏe</div>
    <div class="tab" onclick="showTab(1)" title="Trí tuệ">🧠 Trí tuệ</div>
    <div class="tab" onclick="showTab(2)" title="Hạnh phúc">🌿 Hạnh phúc</div>
    <div class="tab" onclick="showTab(3)" title="Văn bản PDF">Văn bản PDF</div>
</div>


<!-- TAB 1 -->
<div class="tab-content active">
    
<div class="card">
<iframe src="suc_khoe.html"></iframe>
</div>
</div>

<!-- TAB 2 -->
<div class="tab-content">

<div class="card">
<iframe src="tritue.html"></iframe>
</div>

</div>

<!-- TAB 3 -->
<div class="tab-content">

<div class="card">
<iframe src="hanhphuc.html"></iframe>
</div>

</div>

<!-- TAB 4 -->
<div class="tab-content">

<div class="card">
<iframe src="vanban/doc_pdf_truc_tiep.html"></iframe>
</div>

</div>
</div>

<script>
function showTab(index) {
    let tabs = document.querySelectorAll(".tab");
    let contents = document.querySelectorAll(".tab-content");

    tabs.forEach(t => t.classList.remove("active"));
    contents.forEach(c => c.classList.remove("active"));

    tabs[index].classList.add("active");
    contents[index].classList.add("active");
}
</script>

</body>
</html>
